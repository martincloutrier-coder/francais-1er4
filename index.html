o lui prêtera qui sauront toucher Roxane. La scène étudiée est justement celle du balcon. Après une tentative échouée de parler seul à Roxane, Christian fait appel au secours de Cyrano, qui dissimulé dans l’ombre lui souffle ses mots.", "Lecture", "Nous verrons comment ce jeu de paroles permet de dévoiler le cœur de Cyrano.", "Ce texte est découpé en trois mouvements : des lignes 1 à 10 (vers 1 à 4) qui montrent la déception de Roxane face à la pauvreté des mots de Christian, puis des lignes 11 à 25 (vers 4 à 15) dans lequel Roxane sera retenue par les mots de Cyrano avant d’être séduite dans le dernier mouvement des lignes 26 à 44 (vers 16 à 30).", "Premier mouvement : La déception de Roxane", "ROXANE, entrouvrant sa fenêtre Qui donc m’appelle ?", "CHRISTIAN Moi.", "ROXANE Qui, moi ?", "CHRISTIAN Christian.", "ROXANE, avec dédain C’est vous. //", "CHRISTIAN Je voudrais vous parler.", "CYRANO, sous le balcon, à Christian Bien. Bien. Presque à voix basse. //", "ROXANE Non ! Vous parlez trop mal. Allez-vous-en !", "CHRISTIAN De grâce !… //", "ROXANE Non ! Vous ne m’aimez plus !", "Si Rostand disloque l’alexandrin ici, c’est à la fois pour dynamiser le début de l’échange marqué par la déception de Roxane suite à la dernière entrevue avec Christian seul, et pour faire oublier le rythme et la sonorité de la versification. C’est donc un échange spontané et assez vif entre les personnages. Si Roxane essaie de faire parler Christian les échanges sont laconiques (moi / qui moi ? / c’est vous) et Christian ne parvient même pas à fournir de réponse complète obligeant Roxane à le relancer. Il ne parvient pas à engager de discussion alors même que Cyrano est là, ce que voient tant Christian que le spectateur (didascalie sous le balcon) et qui encourage Christian. Roxane elle, a sans doute compris que Christian était celui qui l’appelait mais sa question « Qui moi ? » est un appel pour faire parler Christian alors qu’elle est toujours sous le coup de la déception. Mais Christian ne saisit pas cette attente et ne parvient donc pas à s’exprimer ce qui entraîne le dédain de Roxane (didascalie : avec dédain). Roxane affiche donc un refus catégorique d’échanger plus avant avec Christian : deux des répliques commencent par « non » et ces répliques sonnent comme des jugements définitifs. Le premier rappelant la piètre éloquence de Christian (vous parlez trop mal). Ici le jugement de valeur est extrêmement sévère avec l’adverbe d’intensité « trop » à ce point que la sanction subséquente se trouve dans l’injonction impérative « Allez-vous-en ». Le second jugement sonne lui comme la conclusion mélodramatique de cette incapacité à être éloquent devant elle (vous ne m’aimez plus). Si cela paraît une rupture définitive de Roxane, il ne faut pas oublier qu’elle est éprise de Christian et espère qu’il va retrouver les mots qui sauront la toucher.", "Deuxième mouvement vers 4 à 15 : Les mots de Cyrano retiennent Roxane", "CHRISTIAN, à qui Cyrano souffle ses mots M’accuser, - justes dieux !-//", "De n’aimer plus …quand…j’aime plus !", "ROXANE, qui allait refermer sa fenêtre, s’arrêtant Tiens, mais c’est mieux ! //", "CHRISTIAN, même jeu L’amour grandit bercé dans mon âme inquiète… //", "Que ce … cruel marmot prit pour …barcelonnette ! //", "ROXANE, s’avançant sur le balcon C’est mieux ! – Mais, puisqu’il est cruel, vous fûtes sot //", "De ne pas, cet amour, l’étouffer au berceau ! //", "CHRISTIAN, même jeu Aussi l’ai-je tenté, mais …tentative nulle : //", "Ce…nouveau-né, Madame, est un petit …Hercule //", "ROXANE C’est mieux !", "CHRISTIAN, même jeu De sorte qu’il …strangula comme rien… //", "Les deux serpents…Orgueil et Doute.", "ROXANE, s’accoudant au balcon Ah ! c’est très bien. //", "Mais pourquoi parlez-vous de façon peu hâtive ? //", "Auriez-vous donc la goutte à l’imaginative ? //", "C’est à partir du début du quatrième vers (lignes 10 /11) que les mots de Cyrano vont précéder ceux de Christian, indication qui nous est communiquée par la didascalie « à qui Cyrano souffle ses mots » et des trois occurrences de celle « même jeu ». Dès lors la qualité de la parole change et le discours devient fluide, construit, et poétique. Il gagne en longueur ; alors que jusqu’à présent Christian ne parvenait à énoncer que de courtes paroles incomplètes, qui ici, soufflèes par Cyrano, deviennent des vers complets (lignes 14 / 15). Et quand ce ne sont pas des vers complets ils sont partagés dans leur construction avec Roxane ce qui appuie leur connivence et leur complicité dans la parole et les mots échangés. Par ailleurs et contrairement au début du texte où elle affichait du dédain, c’est ici une admiration qui transparait de ses mots « C’est mieux / Ah c’est très bien » qui partagent les vers de Cyrano soit qu’ils soient placés en tête de vers, soit en fin. Les jugements de valeur de Roxane suivent par ailleurs un rythme crescendo passant du comparatif (deux occurrences : tiens ! mais c’est mieux ! et c’est mieux) au superlatif (ah ! c’est très bien). Au-delà de la fluidité de la parole c’est la poésie qui tranche ici avec le premier mouvement. Cyrano va avoir recours à des métaphores. Son âme inquiète, devient du fait du mouvement une barcelonnette et son amour est assimilé à un « cruel marmot » traduisant ainsi le tourment que cet amour lui cause. Après la connivence dans les mots, c’est la connivence et la complicité culturelle qui s’installe entre les deux personnages, lorsque Cyrano assimile son amour à Hercule : référence à la mythologie, Hercule avait étranglé, alors qu’il n’avait que 10 mois, deux serpents envoyés par jalousie par Héra, l’épouse de Zeus, pour le tuer. Cyrano entraîne avec lui Roxane et les deux personnages sont cultivés et possèdent de l’esprit et jouent avec les mots ; au terme « étouffer » par exemple, Cyrano répondra par « stranguler ». Ainsi, en convoquant Hercule, Cyrano témoigne de la force et de la puissance de cet amour. Toutefois les paroles étant prononcées par Christian après que Cyrano les lui a soufflées, Roxane le trouve hésitant et va le lui notifier « mais pourquoi parlez-vous de façon peu hâtive ? » et par la référence à la maladie infectieuse de la goutte. Cyrano va donc être contraint de prendre la place de Christian de crainte que leur subterfuge ne soit découvert.", "Troisième mouvement : La séduction de Roxane par les mots de Cyrano", "CYRANO, tirant Christian sous le balcon, et se glissant à sa place Chut ! Cela devient trop difficile !…", "ROXANE Aujourd’hui…//", "Vos mots sont hésitants. Pourquoi ?", "CYRANO, parlant à mi-voix, comme Christian C’est qu’il fait nuit, //", "Dans cette ombre, à tâtons, ils cherchent votre oreille.//", "ROXANE Les miens n’éprouvent pas difficulté pareille. //", "CYRANO Ils trouvent tout de suite ? oh ! cela va de soi,//", "Puisque c’est dans mon cœur, eux, que je les reçoi ; //", "Or, moi, j’ai le cœur grand, vous, l’oreille petite.//", "D’ailleurs vos mots, à vous, descendent : ils vont plus vite. //", "Les miens montent, Madame : il leur faut plus de temps ! //", "ROXANE Mais ils montent bien mieux depuis quelques instants. //", "CYRANO De cette gymnastique, ils ont pris l’habitude ! //", "ROXANE Je vous parle, en effet, d’une vraie altitude ! //", "CYRANO Certe, et vous me tueriez si de cette hauteur //", "Vous me laissiez tomber un mot dur sur le cœur. //", "ROXANE, avec un mouvement Je descends.", "CYRANO, vivement Non !", "Dès le début du mouvement ici c’est Christian qui est mis à l’écart. D’abord physiquement, il est tiré sous le balcon ; puis dans sa parole étant réduit au silence par l’onomatopée « Chut » de Cyrano qui en même temps (emploi des participes présents) se glisse à sa place. Cyrano doit masquer leur subterfuge face à l’étonnement de Roxane quant à l’hésitation dont il fait preuve. En lui répondant pour s’en justifier, les personnages se livrent à un métadiscours : ils ne parlent plus du fond et de l’essence des mots mais de la façon de les prononcer. Cyrano va utiliser le cadre spatio-temporel à cette fin. Il utilise la nuit (il fait nuit, dans cette ombre) pour justifier l’hésitation de ses mots qui par le jeu de leur personnification, doivent chercher. Grammaticalement les mots deviennent les sujets de nombreux verbes de perception comme éprouver et surtout des verbes de mouvement qui par le jeu de l’anthropomorphisme deviennent des athlètes qui doivent se surmener et fournir des efforts physiques (monter notamment, et prendre l’habitude d’une gymnastique). Roxane accepte le jeu de cette image et s’en empare en répondant avec un certain humour qu’elle lui parle d’une « vraie altitude ». Cyrano n’omet pas de mentionner le sentiment amoureux donnant aussi à cette scène sa tonalité lyrique, en mentionnant par trois fois son cœur. L’hyperbole d’un mot dur qui le tuerait s’il venait à tomber sur son cœur traduit là encore le fait que les deux personnages partagent avec élégance et un certain amusement leur amour pour les mots. Dans l’antithèse (grand / petite) il va insister tant sur la grandeur de son amour pour Roxane que pour la délicatesse de cette dernière. Mais c’est un instant suspendu, une complicité intellectuelle qui appelle les amoureux à un rapprochement physique « Je descends ». C’est ici la réalité qui reprend ses droits et la didascalie (vivement) du refus de Cyrano traduit l’obligation pour Roxane et Christian (mis de côté et oublié sur ce mouvement) de retarder le rapprochement intime, du fait même de ce subterfuge qui pourtant était le seul moyen de séduire Roxane.", "Conclusion", "Ainsi dans cette scène, le stratège mis en place par Christian et Cyrano traduit bien l’effet des mots sur le cœur de Roxane. Déçue de leur dernier entretien, elle se laisse à nouveau emporter puis séduire. Si elle est attirée par Christian, c’est qu’au-delà de son apparence, elle pense que c’est son cœur qui lui parle alors que c’est celui de Cyrano. Ce dernier est obligé de duper Roxane, pour continuer à l’aimer par l’entremise de Christian."]}, {"slug": "dissertation", "cat": "methodo", "group": "Méthodes", "title": "La dissertation", "sub": "Préparer, construire un plan, rédiger", "obj": ["Savoir préparer la dissertation", "Construire un plan", "Rédiger"], "toc": [["s1", "I / Préparer la dissertation : (Y consacrer du temps : trois quarts d’heure environ)"], ["s2", "II/ Mettre au point le plan de la dissertation (au moins une demi-heure)"], ["s3", "III/ Rédaction de la dissertation"]], "html": "\n<h2 data-pi=\"0\" id=\"s1\">I / Préparer la dissertation : (Y consacrer du temps : trois quarts d’heure environ)<\/h2>\n<p data-pi=\"1\">Il est impératif de prendre le temps de lire et d’analyser le sujet. Cela permet de rechercher et mobiliser toutes les connaissances qui vont permettre de bâtir un plan détaillé du devoir.<\/p>\n<h3 data-pi=\"2\">1/ Etudier le sujet et la problématique<\/h3>\n<p data-pi=\"3\"><em>Identifier le type de sujet :<\/em><\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th data-pi=\"4\">TYPE DE SUJET<\/th>\n<th data-pi=\"5\">PROBLEMATIQUE<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-pi=\"6\">Sujet sans citation : la question est posée dans le libellé du sujet.<\/td>\n<td><p data-pi=\"7\">1 Chercher les mots clés et vérifier leur sens<\/p>\n<p data-pi=\"8\">2 Reformuler pour soi-même la problématique<\/p><\/td>\n<\/tr>\n<tr>\n<td data-pi=\"9\">Sujet avec citation et question : la question oriente la réflexion<\/td>\n<td><p data-pi=\"10\">1 Analyser avec soin la citation et la question<\/p>\n<p data-pi=\"11\">2 Reformuler la problématique<\/p><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p data-pi=\"12\"><em>Associer le sujet à l’œuvre et au parcours<\/em> : voir quels éléments de l’œuvre et du parcours peuvent être associés au sujet et noter ces premiers éléments au brouillon.<\/p>\n<h3 data-pi=\"13\">2/ Analyse de la question posée<\/h3>\n<p data-pi=\"14\">Attachez-vous à bien comprendre la question. Son contenu et sa formulation indiquent de quelle façon organiser la dissertation :<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th data-pi=\"15\">Exemples de formulation<\/th>\n<th data-pi=\"16\">Ce qu’il faut faire<\/th>\n<th data-pi=\"17\">Type de plan<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-pi=\"18\">En quoi……… ?<\/td>\n<td data-pi=\"19\">Expliquer de quelle manière et dans quelle mesure l’affirmation du sujet est vraie<\/td>\n<td data-pi=\"20\">Analytique<\/td>\n<\/tr>\n<tr>\n<td data-pi=\"21\">Dans quelle mesure…… ?<\/td>\n<td data-pi=\"22\">S’interroger sur la pertinence de l’affirmation, sur son degré de vérité.<\/td>\n<td data-pi=\"23\">Analytique<\/td>\n<\/tr>\n<tr>\n<td data-pi=\"24\">Peut-on dire que…. ?<\/td>\n<td data-pi=\"25\">Discuter l’affirmation contenue dans le sujet<\/td>\n<td data-pi=\"26\">Dialectique<\/td>\n<\/tr>\n<tr>\n<td data-pi=\"27\">Faut-il….. ?<\/td>\n<td data-pi=\"28\">S’interroger sur la démarche suggérée et la discuter.<\/td>\n<td data-pi=\"29\">Dialectique<\/td>\n<\/tr>\n<tr>\n<td data-pi=\"30\">Comment…….. ?<\/td>\n<td data-pi=\"31\">S’interroger sur les mécanismes de la démarche proposée dans le sujet.<\/td>\n<td data-pi=\"32\">Analytique<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3 data-pi=\"33\">3 / La recherche des idées<\/h3>\n<p data-pi=\"34\"><strong>UTILISER L’ŒUVRE :<\/strong> Se rappeler de tout ce qui, dans l’œuvre et son étude, est en relation avec le sujet. Notez toutes les idées au brouillon.<\/p>\n<p data-pi=\"35\"><strong>UTILISER LE PARCOURS ET LES LECTURES ASSOCIEES :<\/strong> Se rappeler de tous les textes du parcours figurant sur le descriptif, des prolongements culturels (exposés, vidéos….), des lectures cursives. Eventuellement pour plus de clarté les regrouper dans un tableau :<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th data-pi=\"36\">Idées<\/th>\n<th data-pi=\"37\">Références / citations<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-pi=\"38\">Œuvre étudiée<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td data-pi=\"39\">Parcours<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td data-pi=\"40\">Lecture cursive, prolongements culturels, autres textes…<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 data-pi=\"41\" id=\"s2\">II/ Mettre au point le plan de la dissertation (au moins une demi-heure)<\/h2>\n<h3 data-pi=\"42\">1 / Choix du type de plan<\/h3>\n<p data-pi=\"43\">Comme nous l’avons vu le choix du type de plan dépend du type de sujet.<\/p>\n<p data-pi=\"44\">Donc l’étape précédente de préparation est primordiale : l’analyse du sujet, la thèse qui sera défendue et le rassemblement des connaissances induisent le plan.<\/p>\n<h3 data-pi=\"45\">2/ L’organisation des grandes parties du plan<\/h3>\n<p data-pi=\"46\"><em>Le plan dialectique :<\/em><\/p>\n<p data-pi=\"47\">La première partie : Expliciter la thèse qui sert de point de départ à la réflexion. Montrer qu’elle est comprise, que son enjeu et son intérêt sont maîtrisés.<\/p>\n<p data-pi=\"48\">La deuxième partie : Il faut apporter une nuance à la thèse, et ce grâce à un raisonnement. Expliquer les faiblesses, les limites de la thèse.<\/p>\n<p data-pi=\"49\">La troisième partie : Dépasser l’opposition des deux premières parties. Apporter un élément nouveau, un nouvel angle de réflexion.<\/p>\n<p data-pi=\"50\"><em>Le plan analytique (ou thématique) :<\/em><\/p>\n<p data-pi=\"51\">Comme question de cours. Chaque idée = une partie<\/p>\n<p data-pi=\"52\">La première partie : Expliquer un aspect du sujet. Le mieux étant de partir d’un élément simple du sujet pour montrer qu’on l’a bien compris.<\/p>\n<p data-pi=\"53\">La deuxième partie : Approfondir la réflexion par un autre aspect du sujet (bien entendu différent de celui abordé en première partie).<\/p>\n<p data-pi=\"54\">La troisième partie : Eclaire un nouvel aspect du sujet. Un aspect plus subtil, plus délicat. La réflexion est ici poussée car tous les angles d’analyse ont été balayés.<\/p>\n<h3 data-pi=\"55\">3/ La répartition des idées à l’intérieur des parties du plan<\/h3>\n<p data-pi=\"56\"><cite>Répartir les idées et les références<\/cite> (quitte à reporter un tableau dans chaque partie)<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th data-pi=\"57\">Idées<\/th>\n<th data-pi=\"58\">Références / citations<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td data-pi=\"59\">Œuvre étudiée<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td data-pi=\"60\">Parcours<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td data-pi=\"61\">Lecture cursive, prolongements culturels, autres textes…<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p data-pi=\"62\"><cite>Prévoir ses paragraphes <\/cite>: 2 à 3 paragraphes par partie. Une seule idée par paragraphe avec la référence la plus caractéristique.<\/p>\n<p data-pi=\"63\"><cite>Prévoir les transitions<\/cite> entre chaque partie : il faut montrer la progression logique du raisonnement.<\/p>\n<h2 data-pi=\"64\" id=\"s3\">III/ Rédaction de la dissertation<\/h2>\n<h3 data-pi=\"65\">1 / La rédaction de l’introduction<\/h3>\n<p data-pi=\"66\">Elle comporte trois étapes :<\/p>\n<p data-pi=\"67\">- situer le sujet : évoquer son contexte. Par exemple le genre littéraire concerné, ses caractéristiques, l’ambition de l’auteur ou des écrivains de l’époque, la caractéristique fondamentale de l’œuvre étudiée.<\/p>\n<p data-pi=\"68\">- Exposer la problématique : Citer le sujet et la citation qu’il contient (si elle est trop longue la reformuler ou n’en citer que les parties importantes). Il faut problématiser votre sujet. Ne pas se contenter de le reprendre mais en expliquer les enjeux.<\/p>\n<p data-pi=\"69\">- Annoncer les grandes parties du plan.<\/p>\n<h3 data-pi=\"70\">2/ La rédaction de la conclusion<\/h3>\n<p data-pi=\"71\">Elle comporte deux étapes :<\/p>\n<p data-pi=\"72\">- Le bilan de la réflexion. Revenir sur la problématique et résumer les éléments de réponse.<\/p>\n<p data-pi=\"73\">- Ouverture : élargir la réflexion. Possibilité de proposer une nouvelle réflexion ou de relier le sujet à un autre débat plus large. Ne pas poser de questions.<\/p>\n<h3 data-pi=\"74\">3/ La rédaction du développement<\/h3>\n<p data-pi=\"75\">Toujours débuter sa partie par un sommaire, c’est-à-dire l’annonce de la partie et de ses sous-parties, c’est-à-dire de chaque morceau de l’idée générale de la partie. Respecter un alinéa au début de chaque idée.<\/p>\n<p data-pi=\"76\">A la ligne, on commence le A/ c’est-à-dire la première sous-idée de l’idée générale de la première partie.<\/p>\n<p data-pi=\"77\"><strong>I / Première partie<\/strong><\/p>\n<p data-pi=\"78\"><strong>A/ Première idée de la partie I<\/strong><\/p>\n<p data-pi=\"79\"><strong>B/ Deuxième idée de la partie I<\/strong><\/p>\n<p data-pi=\"80\"><strong>C/ troisième idée de la partie I<\/strong><\/p>\n<p data-pi=\"81\"><strong>Transition<\/strong><\/p>\n<p data-pi=\"82\"><strong>II/ Deuxième partie<\/strong><\/p>\n<p data-pi=\"83\"><strong>A/ Première idée de la partie II<\/strong><\/p>\n<p data-pi=\"84\"><strong>B/ Deuxième idée de la partie II<\/strong><\/p>\n<p data-pi=\"85\"><strong>C/ Troisième idée de la partie II<\/strong><\/p>\n<p data-pi=\"86\"><strong>Transition<\/strong><\/p>\n<p data-pi=\"87\"><strong>III / Troisième partie<\/strong><\/p>\n<p data-pi=\"88\"><strong>A/ Première idée de la partie III<\/strong><\/p>\n<p data-pi=\"89\"><strong>B/ Deuxième idée de la partie III<\/strong><\/p>\n<p data-pi=\"90\"><strong>C/ troisième idée de la partie III<\/strong><\/p>\n<p data-pi=\"91\"><cite>Organiser les paragraphes<\/cite> : chaque partie comprend 2 ou 3 paragraphes = sous partie (A) qui commencent à un alinéa et qui suivent les étapes suivantes<\/p>\n<p data-pi=\"92\">- idée directrice<\/p>\n<p data-pi=\"93\">- argument qui vient étayer cette idée<\/p>\n<p data-pi=\"94\">- exemple issu de l’œuvre et du parcours + son explication, si possible avec une citation.<\/p>\n<p data-pi=\"95\"><strong><cite>Ménager les transitions<\/cite> : entre les parties pour permettre de comprendre la progression logique du raisonnement. Utiliser les connecteurs logiques.<\/strong><\/p>\n<h3 data-pi=\"96\">4/ La présentation de la dissertation<\/h3>\n<p data-pi=\"97\"><cite>Soigner la mise en page <\/cite>: sauter deux lignes au moins entre introduction et développement et entre développement et conclusion. Une ligne au moins entre chaque partie.<\/p>\n<p data-pi=\"98\"><cite>Respecter les codes<\/cite> : souligner les titres des œuvres, mettre les citations entre guillemets, et les coupes entre crochets.<\/p>\n", "idx": ["I / Préparer la dissertation : (Y consacrer du temps : trois quarts d’heure environ)", "Il est impératif de prendre le temps de lire et d’analyser le sujet. Cela permet de rechercher et mobiliser toutes les connaissances qui vont permettre de bâtir un plan détaillé du devoir.", "1/ Etudier le sujet et la problématique", "Identifier le type de sujet :", "TYPE DE SUJET", "PROBLEMATIQUE", "Sujet sans citation : la question est posée dans le libellé du sujet.", "1 Chercher les mots clés et vérifier leur sens", "2 Reformuler pour soi-même la problématique", "Sujet avec citation et question : la question oriente la réflexion", "1 Analyser avec soin la citation et la question", "2 Reformuler la problématique", "Associer le sujet à l’œuvre et au parcours : voir quels éléments de l’œuvre et du parcours peuvent être associés au sujet et noter ces premiers éléments au brouillon.", "2/ Analyse de la question posée", "Attachez-vous à bien comprendre la question. Son contenu et sa formulation indiquent de quelle façon organiser la dissertation :", "Exemples de formulation", "Ce qu’il faut faire", "Type de plan", "En quoi……… ?", "Expliquer de quelle manière et dans quelle mesure l’affirmation du sujet est vraie", "Analytique", "Dans quelle mesure…… ?", "S’interroger sur la pertinence de l’affirmation, sur son degré de vérité.", "Analytique", "Peut-on dire que…. ?", "Discuter l’affirmation contenue dans le sujet", "Dialectique", "Faut-il….. ?", "S’interroger sur la démarche suggérée et la discuter.", "Dialectique", "Comment…….. ?", "S’interroger sur les mécanismes de la démarche proposée dans le sujet.", "Analytique", "3 / La recherche des idées", "UTILISER L’ŒUVRE : Se rappeler de tout ce qui, dans l’œuvre et son étude, est en relation avec le sujet. Notez toutes les idées au brouillon.", "UTILISER LE PARCOURS ET LES LECTURES ASSOCIEES : Se rappeler de tous les textes du parcours figurant sur le descriptif, des prolongements culturels (exposés, vidéos….), des lectures cursives. Eventuellement pour plus de clarté les regrouper dans un tableau :", "Idées", "Références / citations", "Œuvre étudiée", "Parcours", "Lecture cursive, prolongements culturels, autres textes…", "II/ Mettre au point le plan de la dissertation (au moins une demi-heure)", "1 / Choix du type de plan", "Comme nous l’avons vu le choix du type de plan dépend du type de sujet.", "Donc l’étape précédente de préparation est primordiale : l’analyse du sujet, la thèse qui sera défendue et le rassemblement des connaissances induisent le plan.", "2/ L’organisation des grandes parties du plan", "Le plan dialectique :", "La première partie : Expliciter la thèse qui sert de point de départ à la réflexion. Montrer qu’elle est comprise, que son enjeu et son intérêt sont maîtrisés.", "La deuxième partie : Il faut apporter une nuance à la thèse, et ce grâce à un raisonnement. Expliquer les faiblesses, les limites de la thèse.", "La troisième partie : Dépasser l’opposition des deux premières parties. Apporter un élément nouveau, un nouvel angle de réflexion.", "Le plan analytique (ou thématique) :", "Comme question de cours. Chaque idée = une partie", "La première partie : Expliquer un aspect du sujet. Le mieux étant de partir d’un élément simple du sujet pour montrer qu’on l’a bien compris.", "La deuxième partie : Approfondir la réflexion par un autre aspect du sujet (bien entendu différent de celui abordé en première partie).", "La troisième partie : Eclaire un nouvel aspect du sujet. Un aspect plus subtil, plus délicat. La réflexion est ici poussée car tous les angles d’analyse ont été balayés.", "3/ La répartition des idées à l’intérieur des parties du plan", "Répartir les idées et les références (quitte à reporter un tableau dans chaque partie)", "Idées", "Références / citations", "Œuvre étudiée", "Parcours", "Lecture cursive, prolongements culturels, autres textes…", "Prévoir ses paragraphes : 2 à 3 paragraphes par partie. Une seule idée par paragraphe avec la référence la plus caractéristique.", "Prévoir les transitions entre chaque partie : il faut montrer la progression logique du raisonnement.", "III/ Rédaction de la dissertation", "1 / La rédaction de l’introduction", "Elle comporte trois étapes :", "- situer le sujet : évoquer son contexte. Par exemple le genre littéraire concerné, ses caractéristiques, l’ambition de l’auteur ou des écrivains de l’époque, la caractéristique fondamentale de l’œuvre étudiée.", "- Exposer la problématique : Citer le sujet et la citation qu’il contient (si elle est trop longue la reformuler ou n’en citer que les parties importantes). Il faut problématiser votre sujet. Ne pas se contenter de le reprendre mais en expliquer les enjeux.", "- Annoncer les grandes parties du plan.", "2/ La rédaction de la conclusion", "Elle comporte deux étapes :", "- Le bilan de la réflexion. Revenir sur la problématique et résumer les éléments de réponse.", "- Ouverture : élargir la réflexion. Possibilité de proposer une nouvelle réflexion ou de relier le sujet à un autre débat plus large. Ne pas poser de questions.", "3/ La rédaction du développement", "Toujours débuter sa partie par un sommaire, c’est-à-dire l’annonce de la partie et de ses sous-parties, c’est-à-dire de chaque morceau de l’idée générale de la partie. Respecter un alinéa au début de chaque idée.", "A la ligne, on commence le A/ c’est-à-dire la première sous-idée de l’idée générale de la première partie.", "I / Première partie", "A/ Première idée de la partie I", "B/ Deuxième idée de la partie I", "C/ troisième idée de la partie I", "Transition", "II/ Deuxième partie", "A/ Première idée de la partie II", "B/ Deuxième idée de la partie II", "C/ Troisième idée de la partie II", "Transition", "III / Troisième partie", "A/ Première idée de la partie III", "B/ Deuxième idée de la partie III", "C/ troisième idée de la partie III", "Organiser les paragraphes : chaque partie comprend 2 ou 3 paragraphes = sous partie (A) qui commencent à un alinéa et qui suivent les étapes suivantes", "- idée directrice", "- argument qui vient étayer cette idée", "- exemple issu de l’œuvre et du parcours + son explication, si possible avec une citation.", "Ménager les transitions : entre les parties pour permettre de comprendre la progression logique du raisonnement. Utiliser les connecteurs logiques.", "4/ La présentation de la dissertation", "Soigner la mise en page : sauter deux lignes au moins entre introduction et développement et entre développement et conclusion. Une ligne au moins entre chaque partie.", "Respecter les codes : souligner les titres des œuvres, mettre les citations entre guillemets, et les coupes entre crochets."]}, {"slug": "negation", "cat": "langue", "group": "Étude de la langue", "title": "La négation", "sub": "Expression, portée et valeurs", "obj": ["Connaître les différents moyens d’exprimer la négation", "Connaître les valeurs de la négation", "Objectif bac : relever et analyser la négation dans un texte"], "toc": [["s1", "L’expression de la négation"], ["s2", "La portée de la négation"], ["s3", "Les valeurs de la négation"]], "html": "\n<h2 data-pi=\"0\" id=\"s1\">L’expression de la négation<\/h2>\n<p data-pi=\"1\">La négation peut être exprimée par :<\/p>\n<p data-pi=\"2\"><strong>- Le lexique<\/strong><\/p>\n<p data-pi=\"3\">- mots de sens négatif : interdire, le néant<\/p>\n<p data-pi=\"4\">- emploi d’antonyme : il n’est pas beau = il est laid<\/p>\n<p data-pi=\"5\">- mots dérivés par ajout de préfixe négatif : <strong>in<\/strong>visible (non visible), <strong>dés<\/strong>espoir (contraire d’espoir).<\/p>\n<p data-pi=\"6\"><strong>- la syntaxe<\/strong><\/p>\n<p data-pi=\"7\">- la forme négative des phrases (sors / ne sors pas)<\/p>\n<p data-pi=\"8\">- la négation construite avec l’adverbe « ne » accompagné d’un adverbe <em>(pas, guère, jamais, plus, point)<\/em>, d’un pronom (<em>personne, rien)<\/em> ou d’un déterminant <em>(nul, aucu<\/em>n<em>)<\/em>.<\/p>\n<p data-pi=\"9\">- le seul emploi de « ne » se trouve dans un langage soutenu (je ne puis vous dire ce que j’ai ressenti).<\/p>\n<h2 data-pi=\"10\" id=\"s2\">La portée de la négation<\/h2>\n<p data-pi=\"11\">La négation peut être :<\/p>\n<p data-pi=\"12\">- <strong>totale<\/strong> : elle porte sur toute la phrase (il n’a pas faim)<\/p>\n<p data-pi=\"13\">- <strong>partielle<\/strong> : elle ne porte que sur une partie de la phrase (elle ne fait pas souvent de bêtises)<\/p>\n<p data-pi=\"14\">- <strong>restrictive<\/strong> ou <strong>exceptive<\/strong> : il ne regarde que des films d’horreur<\/p>\n<h2 data-pi=\"15\" id=\"s3\">Les valeurs de la négation<\/h2>\n<p data-pi=\"16\">- valeur de négation à proprement parler : il ne viendra pas.<\/p>\n<p data-pi=\"17\">- la double négation s’annule : Mon père ne peut pas ne pas nous aider (il doit nous aider).<\/p>\n<p data-pi=\"18\">- une phrase interro-négative <strong>peut<\/strong> attendre une réponse positive : ne m’accompagnerais-tu pas à la gare ?<\/p>\n<p data-pi=\"19\">- ne explétif : ne transforme pas la phrase affirmative en négative ; il est utilisé pour l’élégance de la phrase dans des subordonnées introduites par : avant que, sans que, de peur que, exprimant la crainte ou la comparaison. <em>Je viendrai avant qu’il ne pleuve / je crains qu’il ne fasse froid / c’est plus facile que je ne l’imaginais.<\/em><\/p>\n", "idx": ["L’expression de la négation", "La négation peut être exprimée par :", "- Le lexique", "- mots de sens négatif : interdire, le néant", "- emploi d’antonyme : il n’est pas beau = il est laid", "- mots dérivés par ajout de préfixe négatif : invisible (non visible), désespoir (contraire d’espoir).", "- la syntaxe", "- la forme négative des phrases (sors / ne sors pas)", "- la négation construite avec l’adverbe « ne » accompagné d’un adverbe (pas, guère, jamais, plus, point), d’un pronom (personne, rien) ou d’un déterminant (nul, aucun).", "- le seul emploi de « ne » se trouve dans un langage soutenu (je ne puis vous dire ce que j’ai ressenti).", "La portée de la négation", "La négation peut être :", "- totale : elle porte sur toute la phrase (il n’a pas faim)", "- partielle : elle ne porte que sur une partie de la phrase (elle ne fait pas souvent de bêtises)", "- restrictive ou exceptive : il ne regarde que des films d’horreur", "Les valeurs de la négation", "- valeur de négation à proprement parler : il ne viendra pas.", "- la double négation s’annule : Mon père ne peut pas ne pas nous aider (il doit nous aider).", "- une phrase interro-négative peut attendre une réponse positive : ne m’accompagnerais-tu pas à la gare ?", "- ne explétif : ne transforme pas la phrase affirmative en négative ; il est utilisé pour l’élégance de la phrase dans des subordonnées introduites par : avant que, sans que, de peur que, exprimant la crainte ou la comparaison. Je viendrai avant qu’il ne pleuve / je crains qu’il ne fasse froid / c’est plus facile que je ne l’imaginais."]}, {"slug": "fausses-confidences", "cat": "exposes", "group": "Œuvres en écho au parcours", "title": "Les Fausses Confidences", "sub": "Marivaux (1737) · Exposé d’Esti Camerlo", "obj": [], "toc": [["s1", "Introduction"], ["s2", "Développement"], ["s3", "Conclusion"]], "html": "<div class=\"tableaux\" role=\"img\" aria-label=\"Deux tableaux blancs. Sur le premier : Les Fausses Confidences, Marivaux. Sur le second : Ouais, j'aurais pas fait comme ça, mais fais comme tu veux.\">\n<div class=\"wb wb1\"><div class=\"wb-s\"><span class=\"hw t1\" style=\"--d:.2s;--w:1.1s\">Les Fausses<\/span><span class=\"hw t1\" style=\"--d:1.2s;--w:1.1s\">Confidences<\/span><svg class=\"hw-line\" viewBox=\"0 0 200 14\" preserveAspectRatio=\"none\" style=\"--d:2.3s\"><path d=\"M4 9c40-5 90-6 192-3\"/><\/svg><span class=\"hw t2\" style=\"--d:2.7s;--w:.9s\">Marivaux<\/span><\/div><div class=\"wb-tray\"><i class=\"mk b\"><\/i><i class=\"mk r\"><\/i><\/div><\/div>\n<div class=\"wb wb2\"><div class=\"wb-s\"><span class=\"hw t3\" style=\"--d:3.8s;--w:1.1s\">Ouais, j’aurais pas fait<\/span><span class=\"hw t3\" style=\"--d:4.9s;--w:1s\">comme ça, mais fais<\/span><span class=\"hw t3\" style=\"--d:5.9s;--w:.9s\">comme tu veux.<\/span><\/div><div class=\"wb-tray\"><i class=\"mk k\"><\/i><i class=\"mk g\"><\/i><\/div><\/div>\n<\/div>\n<h2 id=\"s1\" data-pi=\"0\">Introduction<\/h2>\n<p data-pi=\"1\">Avez-vous l’impression d’être libre là ?<\/p>\n<p data-pi=\"2\">Je ne vous ai pas donné d’ordres ou d’instructions ! J’ai simplement donné mon avis. Et pourtant je pense que la majorité d’entre vous pencheront pour la décision que j’ai prise dans ce cas-là. Votre choix a été orienté. La manipulation devient intéressante lorsqu’elle ne ressemble pas vraiment à de la manipulation.<\/p>\n<p data-pi=\"3\">C’est exactement ce qu’il se passe dans l’œuvre <cite>Les Fausses Confidences<\/cite>. D’ailleurs il y a quelque chose d’assez étrange dans ce titre. Comment une confidence peut-elle être fausse ? Quand on se confie à quelqu’un on est souvent sincère, c’est quelque chose d’authentique et surtout d’intime. Mais ici ces confidences sont fausses. C’est justement cette contradiction qui, rien qu’à la première de couverture, fait que ce livre intrigue, et nous donne un avant-goût des jeux de manipulations et d’influence qu’il va y avoir dans ce livre.<\/p>\n<h2 id=\"s2\" data-pi=\"4\">Développement<\/h2>\n<p data-pi=\"5\"><cite>Les Fausses Confidences<\/cite> est une comédie de Marivaux, créée en 1737.<\/p>\n<p data-pi=\"6\">On y suit principalement Dorante, un jeune homme pauvre qui tombe amoureux d’Araminte, une jeune veuve riche. Le problème, c’est que leur différence sociale semble rendre leur amour difficile. Et c’est là qu’intervient Dubois, ancien valet de Dorante.<\/p>\n<p data-pi=\"7\">Dubois comprend que Dorante aime Araminte et décide de mettre en place une véritable stratégie pour les rapprocher. Et là il va créer des situations, provoquer des réactions et surtout utiliser la parole pour faire naître progressivement le sentiment amoureux (normalement ça doit vous faire penser à quelqu’un ça).<\/p>\n<p data-pi=\"8\">C’est à ce moment-là que le <strong>lien avec le parcours de cette œuvre<\/strong> « Quand la parole devient manipulatrice » devient évident. Dans la pièce, les personnages ne parlent jamais de manière totalement innocente.<\/p>\n<p data-pi=\"9\">Soit ils cachent une information, soit ils cherchent à provoquer une réaction, soit ils utilisent justement une confidence pour influencer un personnage. La parole dans ce livre, c’est une véritable stratégie. Par exemple Dubois dit, je cite : « Il faut que je vous fasse part d’un stratagème ». Ici, Dubois assume ouvertement qu’il construit une stratégie. Mais ce qui est encore plus intéressant, c’est que la manipulation fonctionne justement parce qu’on ne dirait pas une manipulation. Il se confie : « il faut que je vous fasse part ». Il ne ment pas vraiment mais il détourne une information, il fait une révélation de manière spontanée alors que c’est un coup bien préparé.<\/p>\n<p data-pi=\"10\">Pour vous donner un exemple plus concret (parce que celui du début était un peu rapide), si je te dis « On va manger dans ce restaurant » et « On peut aller où tu veux franchement, celui-là a l’air beaucoup mieux. Après fais comme tu veux hein ». Dans les deux cas, j’essaie de te faire choisir le même restaurant. Mais dans la deuxième formulation, je te donne l’impression que la décision vient de toi.<\/p>\n<p data-pi=\"11\">Dans <cite>Les Fausses Confidences<\/cite>, Dubois fonctionne de cette manière. Il agit comme une sorte de metteur en scène des sentiments (là aussi normalement ça vous rappelle quelqu’un, avec même la mise en abîme dont Alix nous parlait et tout).<\/p>\n<h3 data-pi=\"12\">Alors pourquoi cette œuvre est pertinente à utiliser dans une dissert qui fait partie du parcours « Les jeux du cœur et de la parole » ?<\/h3>\n<p data-pi=\"13\">(Et donc là de <cite>On ne badine pas avec l’amour<\/cite>.) D’abord, elle permet d’illustrer concrètement le pouvoir de la parole.<\/p>\n<p data-pi=\"14\">Chez Marivaux, parler, ce n’est pas juste exprimer ce que l’on pense. Chez lui, un personnage peut parler pour séduire, dissimuler, provoquer ou même faire naître un sentiment. Dans les deux œuvres, la parole devient un moyen d’agir sur les sentiments. Dans <cite>Les Fausses Confidences<\/cite> comme dans <cite>On ne badine pas avec l’amour<\/cite>, les personnages ne disent pas toujours directement ce qu’ils ressentent. Ils passent par la mise en scène, le mensonge, la provocation ou encore la manipulation. Chez Marivaux, Dorante et Araminte ne sont pas toujours capables de s’avouer directement leurs sentiments, et Dubois va justement utiliser la parole pour faire évoluer leur relation. Chez Musset, Camille et Perdican connaissent eux aussi cette difficulté à dire directement leurs sentiments. Leur parole devient donc un moyen de se tester, de se provoquer et de chercher à découvrir ce que l’autre ressent réellement.<\/p>\n<p data-pi=\"15\">On peut donc en déduire que, chez les deux auteurs, les personnages jouent avec la parole parce qu’ils ont du mal à avouer leurs sentiments. Mais ce jeu n’a pas les mêmes conséquences. Chez Marivaux, les stratagèmes et les manipulations de la parole finissent par contribuer à rapprocher Dorante et Araminte : la pièce se termine sur une fin heureuse. Chez Musset, au contraire, les jeux de la parole et des sentiments finissent par avoir de lourdes conséquences : le jeu amoureux conduit à la mort, la pièce se termine sur une fin tragique. Cette opposition rend justement le rapprochement entre les deux œuvres intéressant pour une dissertation : elles montrent toutes deux le jeu de la parole sur le cœur, mais elles montrent également deux issues différentes possibles.<\/p>\n<h2 id=\"s3\" data-pi=\"16\">Conclusion<\/h2>\n<p data-pi=\"17\">Pour conclure, <cite>Les Fausses Confidences<\/cite> est donc une œuvre particulièrement pertinente pour réfléchir aux jeux de la parole et du cœur. Marivaux nous montre le pouvoir des mots. Et c’est finalement ce qui rapproche cet auteur de Musset. Dans leurs deux œuvres, les personnages jouent avec la parole. Leurs jeux ne les conduisent en revanche pas au même endroit. Et c’est peut-être là que se trouve le vrai danger de la parole.<\/p>\n<p class=\"chute\" data-pi=\"18\">On peut jouer avec les mots… mais pas toujours avec les conséquences.<\/p>", "idx": ["Introduction", "Avez-vous l’impression d’être libre là ?", "Je ne vous ai pas donné d’ordres ou d’instructions ! J’ai simplement donné mon avis. Et pourtant je pense que la majorité d’entre vous pencheront pour la décision que j’ai prise dans ce cas-là. Votre choix a été orienté. La manipulation devient intéressante lorsqu’elle ne ressemble pas vraiment à de la manipulation.", "C’est exactement ce qu’il se passe dans l’œuvre Les Fausses Confidences. D’ailleurs il y a quelque chose d’assez étrange dans ce titre. Comment une confidence peut-elle être fausse ? Quand on se confie à quelqu’un on est souvent sincère, c’est quelque chose d’authentique et surtout d’intime. Mais ici ces confidences sont fausses. C’est justement cette contradiction qui, rien qu’à la première de couverture, fait que ce livre intrigue, et nous donne un avant-goût des jeux de manipulations et d’influence qu’il va y avoir dans ce livre.", "Développement", "Les Fausses Confidences est une comédie de Marivaux, créée en 1737.", "On y suit principalement Dorante, un jeune homme pauvre qui tombe amoureux d’Araminte, une jeune veuve riche. Le problème, c’est que leur différence sociale semble rendre leur amour difficile. Et c’est là qu’intervient Dubois, ancien valet de Dorante.", "Dubois comprend que Dorante aime Araminte et décide de mettre en place une véritable stratégie pour les rapprocher. Et là il va créer des situations, provoquer des réactions et surtout utiliser la parole pour faire naître progressivement le sentiment amoureux (normalement ça doit vous faire penser à quelqu’un ça).", "C’est à ce moment-là que le lien avec le parcours de cette œuvre « Quand la parole devient manipulatrice » devient évident. Dans la pièce, les personnages ne parlent jamais de manière totalement innocente.", "Soit ils cachent une information, soit ils cherchent à provoquer une réaction, soit ils utilisent justement une confidence pour influencer un personnage. La parole dans ce livre, c’est une véritable stratégie. Par exemple Dubois dit, je cite : « Il faut que je vous fasse part d’un stratagème ». Ici, Dubois assume ouvertement qu’il construit une stratégie. Mais ce qui est encore plus intéressant, c’est que la manipulation fonctionne justement parce qu’on ne dirait pas une manipulation. Il se confie : « il faut que je vous fasse part ». Il ne ment pas vraiment mais il détourne une information, il fait une révélation de manière spontanée alors que c’est un coup bien préparé.", "Pour vous donner un exemple plus concret (parce que celui du début était un peu rapide), si je te dis « On va manger dans ce restaurant » et « On peut aller où tu veux franchement, celui-là a l’air beaucoup mieux. Après fais comme tu veux hein ». Dans les deux cas, j’essaie de te faire choisir le même restaurant. Mais dans la deuxième formulation, je te donne l’impression que la décision vient de toi.", "Dans Les Fausses Confidences, Dubois fonctionne de cette manière. Il agit comme une sorte de metteur en scène des sentiments (là aussi normalement ça vous rappelle quelqu’un, avec même la mise en abîme dont Alix nous parlait et tout).", "Alors pourquoi cette œuvre est pertinente à utiliser dans une dissert qui fait partie du parcours « Les jeux du cœur et de la parole » ?", "(Et donc là de On ne badine pas avec l’amour.) D’abord, elle permet d’illustrer concrètement le pouvoir de la parole.", "Chez Marivaux, parler, ce n’est pas juste exprimer ce que l’on pense. Chez lui, un personnage peut parler pour séduire, dissimuler, provoquer ou même faire naître un sentiment. Dans les deux œuvres, la parole devient un moyen d’agir sur les sentiments. Dans Les Fausses Confidences comme dans On ne badine pas avec l’amour, les personnages ne disent pas toujours directement ce qu’ils ressentent. Ils passent par la mise en scène, le mensonge, la provocation ou encore la manipulation. Chez Marivaux, Dorante et Araminte ne sont pas toujours capables de s’avouer directement leurs sentiments, et Dubois va justement utiliser la parole pour faire évoluer leur relation. Chez Musset, Camille et Perdican connaissent eux aussi cette difficulté à dire directement leurs sentiments. Leur parole devient donc un moyen de se tester, de se provoquer et de chercher à découvrir ce que l’autre ressent réellement.", "On peut donc en déduire que, chez les deux auteurs, les personnages jouent avec la parole parce qu’ils ont du mal à avouer leurs sentiments. Mais ce jeu n’a pas les mêmes conséquences. Chez Marivaux, les stratagèmes et les manipulations de la parole finissent par contribuer à rapprocher Dorante et Araminte : la pièce se termine sur une fin heureuse. Chez Musset, au contraire, les jeux de la parole et des sentiments finissent par avoir de lourdes conséquences : le jeu amoureux conduit à la mort, la pièce se termine sur une fin tragique. Cette opposition rend justement le rapprochement entre les deux œuvres intéressant pour une dissertation : elles montrent toutes deux le jeu de la parole sur le cœur, mais elles montrent également deux issues différentes possibles.", "Conclusion", "Pour conclure, Les Fausses Confidences est donc une œuvre particulièrement pertinente pour réfléchir aux jeux de la parole et du cœur. Marivaux nous montre le pouvoir des mots. Et c’est finalement ce qui rapproche cet auteur de Musset. Dans leurs deux œuvres, les personnages jouent avec la parole. Leurs jeux ne les conduisent en revanche pas au même endroit. Et c’est peut-être là que se trouve le vrai danger de la parole.", "On peut jouer avec les mots… mais pas toujours avec les conséquences."]}]</script>

function valanceSVG(){
  let back='', edge='', f='';
  for(let x=400;x>0;x-=40) back+=`Q${x-20} 74 ${x-40} 44`;
  for(let x=0;x<400;x+=40) edge+=`Q${x+20} 74 ${x+40} 44`;
  for(let x=3;x<400;x+=5){ const y=44+Math.sin((x%40)/40*Math.PI)*15; f+=`M${x} ${y.toFixed(1)}v9`; }
  return `<svg viewBox="0 0 400 86" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="val" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3e0710"/><stop offset="1" stop-color="#93203a"/></linearGradient></defs>

function renderCat(k){
  const c = CATS[k]; if(!c) return renderHome();
  const ds = docsOf(k); const groups=[...new Set(ds.map(d=>d.group))];
  let n=0;
  const prog = groups.map(g=>`<div class="programme"><h2>${g}</h2><ul>${ds.filter(d=>d.group===g).map(d=>{n++;return `<li><a href="#/d/${d.slug}"><span class="n">${d.slug.startsWith('ll')?'LL'+d.slug.slice(2):'·'}</span><span><span class="t">${esc(d.title)}</span><span class="s">${esc(d.sub)}</span></span><svg class="chev"><use href="#i-chev"/></svg></a></li>`}).join('')}</ul></div>`).join('');
  app.innerHTML = `
  <div class="banner${k==='theatre'?'':' plain'}"><div class="wrap">
    <div><div class="crumb"><a href="#/">‹ Accueil</a></div><h1>${c.long}</h1><p>${c.desc}</p></div>
    <svg class="ill"><use href="#${c.ill}"/></svg>
  </div></div>
  <div class="wrap">
    ${c.objet?`<div class="cartouche"><div><span>Objet d'étude</span>${c.objet}</div><div><span>Œuvre</span><i>${c.oeuvre}</i></div><div><span>Parcours associé</span>${c.parcours}</div></div>`:''}
    ${prog}
  </div>`;
}

function renderDoc(slug, pi, q){
  const d = BY[slug]; if(!d) return renderHome();
  const c = CATS[d.cat], list = docsOf(d.cat), i = list.indexOf(d);
  const prev = list[i-1], next = list[i+1];
  const toc = d.toc.length>1 ? `<aside class="toc"><details ${matchMedia('(min-width:980px)').matches?'open':''}><summary>Sommaire</summary><ol>${d.toc.map(([id,t])=>`<li><a href="#/d/${slug}" data-anchor="${id}">${esc(t)}</a></li>`).join('')}</ol></details></aside>` : `<aside class="toc"></aside>`;
  app.innerHTML = `
  <div class="wrap">
    <div class="doc-head">
      <div class="crumb"><a href="#/p/${d.cat}">‹ ${c.name}</a></div>
      <p class="grp">${d.group}</p>
      <h1>${esc(d.title)}</h1>
      <p class="sub">${esc(d.sub)}</p>
    </div>
    <div class="doc-grid">
      ${toc}
      <div>
        ${d.obj.length?`<div class="obj"><b>Objectifs de la séance</b><ul>${d.obj.map(o=>`<li>${esc(o)}</li>`).join('')}</ul></div>`:''}
        <article class="cours">${d.html}</article>
        <nav class="pager">${prev?`<a href="#/d/${prev.slug}"><span>Précédent</span><b>${esc(prev.title)}</b></a>`:''}${next?`<a class="next" href="#/d/${next.slug}"><span>Suivant</span><b>${esc(next.title)}</b></a>`:''}</nav>
      </div>
    </div>
  </div>`;
  app.querySelectorAll('[data-anchor]').forEach(a=>a.addEventListener('click',ev=>{
    ev.preventDefault(); const t=document.getElementById(a.dataset.anchor); if(t) t.scrollIntoView({behavior:'smooth'});
  }));
  if(pi!=null){
    const el = app.querySelector(`article [data-pi="${pi}"]`);
    if(el){ if(q) markIn(el,q); requestAnimationFrame(()=>{ el.scrollIntoView({block:'center'}); el.classList.add('flash'); }); }
  }
}

/* ---------- Routeur ---------- */
function route(){
  const h = location.hash.replace(/^#\/?/,'');
  const [path, qs] = h.split('?'); const parts = path.split('/');
  const params = new URLSearchParams(qs||'');
  if(parts[0]==='p') renderCat(parts[1]);
  else if(parts[0]==='d') renderDoc(parts[1], params.get('pi'), params.get('q'));
  else renderHome();
  if(!params.get('pi')) window.scrollTo(0,0);
  closeSearch(true);
}
addEventListener('hashchange',route);

/* ---------- Compte à rebours ---------- */
function tick(){
  const now = Date.now();
  EVENTS.forEach((e,i)=>{
    const L = app.querySelector(`[data-cd="${i}"]`), J = app.querySelector(`[data-j="${i}"]`);
    if(!L) return;
    let ms = new Date(e.date).getTime() - now;
    if(ms<=0){ L.textContent = ms > -2*86400000 ? "C'est en cours, bon courage !" : "C'est passé."; J.textContent="0"; return; }
    J.textContent = Math.floor(ms/86400000);
    L.innerHTML = `Encore ${Math.floor(ms/86400000)} j<br><b>${duree(ms%86400000,1)}</b>`;
  });
  const cd = document.getElementById('alarmeCd');
  if(cd && document.getElementById('alarme').classList.contains('on')){
    const now2 = Date.now(), e = EVENTS.find(x=>new Date(x.date).getTime()>now2);
    document.getElementById('alarmeQuoi').textContent = e ? `${e.what} dans :` : "Plus d'épreuve blanche… pour l'instant.";
    cd.textContent = e ? duree(new Date(e.date).getTime()-now2) : '—';
  }
}
function duree(ms,sansJ){
  const p = n => String(n).padStart(2,'0');
  return `${sansJ?'':Math.floor(ms/86400000)+' j '}${p(Math.floor(ms/3600000)%24)} h ${p(Math.floor(ms/60000)%60)} min ${p(Math.floor(ms/1000)%60)} s`;
}
setInterval(tick, 1000);

/* ---------- Le prof monte tout seul sur téléphone, un billet à la fois ---------- */
let peekObs = null;
function autoPeek(){
  if(peekObs) peekObs.disconnect();
  if(!matchMedia('(hover: none)').matches || !('IntersectionObserver' in window)) return;
  const vus = new Set(), file = []; let occupe = false;
  const suivant = ()=>{
    if(occupe || !file.length) return;
    const t = file.shift(); if(!t.isConnected) return suivant();
    occupe = true; t.classList.add('auto');
    setTimeout(()=>{ t.classList.remove('auto'); setTimeout(()=>{ occupe = false; suivant(); }, 700); }, 3200);
  };
  peekObs = new IntersectionObserver(es=>es.forEach(e=>{
    if(e.isIntersecting && !vus.has(e.target)){ vus.add(e.target); file.push(e.target); suivant(); }
  }), {threshold:.75});
  app.querySelectorAll('.tk').forEach(t=>peekObs.observe(t));
}

/* ---------- Alarme ---------- */
function alarme(){
  let el = document.getElementById('alarme');
  if(!el){
    el = document.createElement('div'); el.id='alarme'; el.className='alarme';
    el.setAttribute('role','alertdialog'); el.setAttribute('aria-modal','true'); el.setAttribute('aria-label','Alerte bac de français');
    el.innerHTML = `<div class="hazard t"></div><div class="hazard b"></div><div class="gyro l"></div><div class="gyro r"></div>
      <div class="alarme-panel">
        <p class="sur">⚠ Alerte générale ⚠</p>
        <h2>Danger</h2>
        <p class="sous" id="alarmeQuoi"></p>
        <div class="cd" id="alarmeCd"></div>
        <div class="face"><img src="${PROF}" alt="M. Herczeg qui vous observe"></div>
        <p class="legende">M. Herczeg vous observe…</p>
        <button class="stop" type="button">J'ai compris, je vais réviser</button>
      </div>`;
    document.body.appendChild(el);
    el.querySelector('.stop').onclick = finAlarme;
  }
  el.classList.remove('on'); void el.offsetWidth; el.classList.add('on');
  document.documentElement.style.overflow='hidden';
  tick();
  el.querySelector('.stop').focus({preventScroll:true});
}
function finAlarme(){
  const el = document.getElementById('alarme'); if(!el || !el.classList.contains('on')) return;
  el.classList.remove('on'); document.documentElement.style.overflow='';
  const b = document.getElementById('boutonRouge'); if(b) b.focus({preventScroll:true});
}
addEventListener('keydown',e=>{ if(e.key==='Escape') finAlarme(); });

/* ---------- Recherche ---------- */
const norm = s => s.toLowerCase().replace(/[’`]/g,"'").normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function normMap(s){ let out=''; for(const ch of s){ let n = norm(ch); out += n.length===1 ? n : (n[0]||' '); } return out; }
const INDEX = DOCS.map(d=>({d, items:d.idx.map((t,i)=>({i,t,n:normMap(t)}))}));
const box = document.getElementById('search'), qi = document.getElementById('q'), res = document.getElementById('results');
function openSearch(){ box.classList.add('open'); document.body.style.overflow='hidden'; setTimeout(()=>qi.focus(),30); doSearch(); }
function closeSearch(silent){ box.classList.remove('open'); document.body.style.overflow=''; }
document.getElementById('openSearch').onclick = openSearch;
document.getElementById('closeSearch').onclick = ()=>closeSearch();
addEventListener('keydown',e=>{ if(e.key==='Escape') closeSearch(); if(e.key==='/' && !box.classList.contains('open') && document.activeElement.tagName!=='INPUT'){ e.preventDefault(); openSearch(); } });
function snippet(t, n, q){
  const at = n.indexOf(q); const start = Math.max(0, at-60), end = Math.min(t.length, at+q.length+90);
  return (start>0?'…':'') + esc(t.slice(start,at)) + '<mark>' + esc(t.slice(at,at+q.length)) + '</mark>' + esc(t.slice(at+q.length,end)) + (end<t.length?'…':'');
}
function doSearch(){
  const raw = qi.value.trim(); const q = norm(raw);
  if(q.length<2){
    res.innerHTML = `<div class="hint">Tape au moins deux lettres. Quelques idées :<br>${['Rosette','double énonciation','orgueil','ne explétif','problématique','Cyrano','Marivaux'].map(s=>`<button type="button" data-s="${s}">${s}</button>`).join('')}</div>`;
    res.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{qi.value=b.dataset.s;doSearch();});
    return;
  }
  let html='', total=0;
  INDEX.forEach(({d,items})=>{
    const hits = items.filter(it=>it.n.includes(q));
    if(!hits.length) return; total+=hits.length;
    html += `<div class="res-doc">${esc(d.title)}<small>${hits.length} résultat${hits.length>1?'s':''}</small></div>`;
    html += hits.slice(0,4).map(h=>`<button class="res" data-go="#/d/${d.slug}?pi=${h.i}&q=${encodeURIComponent(raw)}">${snippet(h.t,h.n,q)}</button>`).join('');
  });
  res.innerHTML = total ? html : `<div class="hint">Aucun résultat pour « ${esc(raw)} ». Essaie un autre mot ou une orthographe plus courte.</div>`;
  res.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{ location.hash = b.dataset.go; });
}
qi.addEventListener('input', doSearch);
function markIn(el, raw){
  const q = norm(raw); if(q.length<2) return;
  const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT); const nodes=[]; while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(node=>{
    const t=node.nodeValue, n=normMap(t); let at=n.indexOf(q); if(at<0) return;
    const frag=document.createDocumentFragment(); let last=0;
    while(at>=0){ frag.append(t.slice(last,at)); const m=document.createElement('mark'); m.textContent=t.slice(at,at+q.length); frag.append(m); last=at+q.length; at=n.indexOf(q,last); }
    frag.append(t.slice(last)); node.replaceWith(frag);
  });
}

route();
})();
</script>
