ondissement imprévu"], ["s4", "Troisième mouvement : Une issue tragique"], ["s5", "Conclusion"]], "html": "\n<section class=\"extrait\"><p class=\"extrait-label\">Le texte<\/p><p data-pi=\"0\">PERDICAN : Insensés que nous sommes ! nous nous aimons. Quel songe avons-nous fait, Camille ? Quelles vaines paroles, quelles misérables folies ont passé comme un vent funeste entre nous deux ? Lequel de nous a voulu tromper l'autre ? Hélas ! cette vie est elle-même un si pénible rêve : pourquoi encore y mêler les nôtres ? ô mon Dieu ! le bonheur est une perle si rare dans cet océan d'ici-bas ! Tu nous l'avais donné, pêcheur céleste, tu l'avais tiré pour nous des profondeurs de l'abîme, cet inestimable joyau ; et nous, comme des enfants gâtés que nous sommes, nous en avons fait un jouet. Le vert sentier qui nous amenait l'un vers l'autre avait une pente si douce, il était entouré de buissons si fleuris, il se perdait dans un si tranquille horizon ! Il a bien fallu que la vanité, le bavardage et la colère vinssent jeter leurs rochers informes sur cette route céleste, qui nous aurait conduits à toi dans un baiser ! Il a bien fallu que nous nous fissions du mal, car nous sommes des hommes. Ô insensés ! nous nous aimons.<br/>\n<em>Il la prend dans ses bras.<\/em><\/p><p data-pi=\"1\">CAMILLE : Oui, nous nous aimons, Perdican ; laisse-moi le sentir sur ton coeur. Ce Dieu qui nous regarde ne s'en offensera pas ; il veut bien que je t'aime ; il y a quinze ans qu'il le sait.<\/p><p data-pi=\"2\">PERDICAN : Chère créature, tu es à moi !<br/>\n<em>Il l'embrasse ; on entend un grand cri derrière l'autel.<\/em><\/p><p data-pi=\"3\">CAMILLE : C'est la voix de ma sœur de lait.<\/p><p data-pi=\"4\">PERDICAN : Comment est-elle ici ? Je l'avais laissée dans l'escalier, lorsque tu m'as fait rappeler. Il faut donc qu'elle m'ait suivi sans que je m'en sois aperçu.<\/p><p data-pi=\"5\">CAMILLE : Entrons dans cette galerie ; c'est là qu'on a crié.<\/p><p data-pi=\"6\">PERDICAN : Je ne sais ce que j'éprouve ; il me semblé que mes mains sont couvertes de sang.<\/p><p data-pi=\"7\">CAMILLE : La pauvre enfant nous a sans doute épiés ; elle s'est encore évanouie ; viens, portons-lui secours ; hélas tout cela est cruel.<\/p><p data-pi=\"8\">PERDICAN : Non, en vérité, je n'entrerai pas ; je sens un froid mortel qui me paralyse. Vas-y, Camille, et tâche de la ramener.<br/>\n<em>Camille sort.<\/em><br/>\nJe vous en supplie, mon Dieu ! ne faites pas de moi un meurtrier ! Vous voyez ce qui se passe ; nous sommes deux enfants insensés, et nous avons joué avec la vie et la mort ; mais notre cœur est pur ; ne tuez pas Rosette, Dieu juste ! Je lui trouverai un mari, je réparerai ma faute ; elle est jeune, elle sera riche, elle sera heureuse ; ne faites pas cela, à Dieu ! vous pouvez bénir encore quatre de vos enfants. Eh bien ! Camille, qu'y a-t-il ?<br/>\n<em>Camille rentre.<\/em><\/p><p data-pi=\"9\">CAMILLE : Elle est morte. Adieu, Perdican !<\/p><\/section><h2 data-pi=\"10\" id=\"s1\">Introduction<\/h2>\n<p data-pi=\"11\">Alfred de Musset, auteur romantique du XIX° siècle, peinant à trouver des repères dans un monde dans lequel il ne se reconnait pas, décide à la suite de l’échec de sa pièce <cite>La nuit vénitienne<\/cite> de n’écrire plus que pour être lu, délaissant la représentation sur scène. C’est dans ce cadre que parait <cite>On ne badine pas avec l’amour<\/cite> inspiré de sa propre histoire avec George Sand (lorsqu’ils sont à Venise, Musset tombe malade et Sand aura une aventure avec son médecin). Mettant en scène un trio amoureux entre Perdican, Camille et Rosette sa sœur de lait, les jeux de langage dans la pièce vise à ne pas dévoiler ses sentiments mais à forcer l’autre à le faire. Camille refuse au début de la pièce d’embrasser son cousin Perdican, mettant en péril le projet de mariage. Dès lors, chacun piqué par son orgueil se livrera à un jeu cruel en manipulant Rosette. Les personnages sont de plus en plus troublés ce qui conduit Camille, dans cette scène finale, à se réfugier dans un oratoire pour en appeler à Dieu.<\/p>\n<p data-pi=\"12\">Lecture<\/p>\n<p data-pi=\"13\">Nous verrons dans quelle mesure ce dénouement révèle que les jeux du cœur et de la parole ne peuvent mener qu’à une issue tragique.<\/p>\n<p data-pi=\"14\">Le texte sera décomposé en trois mouvements. Vers une fin heureuse des lignes 1 à 16, un rebondissement imprévu des lignes 16 à 26 et une issue tragique de la ligne 27 à la fin.<\/p>\n<h2 data-pi=\"15\" id=\"s2\">Premier Mouvement : Vers une fin heureuse ?<\/h2>\n<p data-pi=\"16\">PERDICAN : Insensés que nous sommes ! nous nous aimons. Quel songe avons-nous fait, Camille ? Quelles vaines paroles, quelles misérables folies ont passé comme un vent funeste entre nous deux ? Lequel de nous a voulu tromper l'autre ? Hélas ! cette vie est elle-même un si pénible rêve : pourquoi encore y mêler les nôtres ? ô mon Dieu ! le bonheur est une perle si rare dans cet océan d'ici-bas ! Tu nous l'avais donné, pêcheur céleste, tu l'avais tiré pour nous des profondeurs de l'abîme, cet inestimable joyau ; et nous, comme des enfants gâtés que nous sommes, nous en avons fait un jouet. Le vert sentier qui nous amenait l'un vers l'autre avait une pente si douce, il était entouré de buissons si fleuris, il se perdait dans un si tranquille horizon ! Il a bien fallu que la vanité, le bavardage et la colère vinssent jeter leurs rochers informes sur cette route céleste, qui nous aurait conduits à toi dans un baiser ! Il a bien fallu que nous nous fissions du mal, car nous sommes des hommes. Ô insensés ! nous nous aimons.<br/>\n<em>Il la prend dans ses bras.<\/em><\/p>\n<p data-pi=\"17\">CAMILLE : Oui, nous nous aimons, Perdican ; laisse-moi le sentir sur ton cœur. Ce Dieu qui nous regarde ne s'en offensera pas ; il veut bien que je t'aime ; il y a quinze ans qu'il le sait.<\/p>\n<p data-pi=\"18\">PERDICAN : Chère créature, tu es à moi !<br/>\n<em>Il l'embrasse ;<\/em><\/p>\n<p data-pi=\"19\">Le lieu « l’oratoire » qui est une petite chapelle est précisé comme pour garantir la sincérité des personnages et ici c’est comme si Dieu était le spectateur garant de la parole à venir. Si Musset critique l’Eglise il croit aussi en un Dieu accessible par le cœur. D’ailleurs dans sa réplique Perdican va s’adresser à Dieu (Ô mon Dieu) en employant le tutoiement. Les types de phrases traduisent l’émotion de Perdican qui s’exprime dans nombre d’exclamatives et d’interrogatives. Cette émotion exprime la sincérité de Perdican qui a laissé tomber le masque de l’orgueil. Dès lors, il va exprimer des regrets. D’abord dans les temps utilisés qui sont des temps du passé : ainsi le passé composé (avons-nous fait, a voulu), le plus que parfait (avais donné, avais tiré), l’imparfait (nous amenait, se perdait), le conditionnel passé à valeur d’irréel du passé (nous aurait conduits). La sincérité se lit aussi dans la beauté du discours de Perdican et des métaphores auxquelles il recourt : celle de la route céleste menant au paradis (pente si douce, buissons si fleuris, si tranquille horizon avec la reprise des adverbes d’intensité « si »), celle des rochers informes qui rappelle les phoques difformes de l’acte II, scène 5, celle de la perle rare que Dieu est capable (pêcheur céleste) de sortir de l’abîme et de leur offrir ; ici, Perdican exprime le remords par l’antithèse entre le joyau offert et le « jouet » qu’en ont fait Camille et lui.<\/p>\n<p data-pi=\"20\">Perdican s’interroge aussi sur les forces contraires qui ont participé à ce résultat qu’il déplore. Ainsi beaucoup d’interrogations questionnent en ce sens « quelles vaines paroles, quelles misérables folies ? », de même que la forme impersonnelle « il a bien fallu » répétée deux fois. La personnification de la vanité du bavardage et de la colère (qui viennent jeter les rochers informes) donc qui ont jeté des obstacles sur leur route. La culpabilité de Perdican vis-à-vis de lui-même et de Camille existe « nous en avons fait un jouet », « lequel de nous deux a voulu tromper l’autre », ais elle est atténué ou expliquée par le fait qu’ils soient insensés (qui débute la réplique et la termine comme une boucle que l’on ferme).<\/p>\n<p data-pi=\"21\">Perdican tout au long de la réplique s’est rapproché de Camille jusqu’à la didascalie, « il la prend dans ses bras ». Camille va donner les signes d’un dénouement heureux en reprenant « oui nous nous aimons » et en convoquant le cœur, ce ne sont plus les mots et la parole trompeuse mais le cœur authentique qui le signifie. Et Camille, venue parler à Dieu dans cet oratoire, accepte l’amour humain, avec une union de l’amour humain et divin (Camille emploie une litote : ce Dieu…ne s’en offusquera pas). Finalement ils obtiennent ce qu’ils voulaient et nous avons le sentiment d’un dénouement heureux digne de la comédie avec l’aveu des sentiments sincères et réciproques. Par ailleurs la didascalie « il l’embrasse » semble clore la pièce dont le nœud est précisément le refus de Camille lors de leurs retrouvailles d’embrasser Perdican.<\/p>\n<h2 data-pi=\"22\" id=\"s3\">Deuxième mouvement : Un rebondissement imprévu<\/h2>\n<p data-pi=\"23\">; <em>on entend un grand cri derrière l'autel.<\/em><\/p>\n<p data-pi=\"24\">CAMILLE : C'est la voix de ma sœur de lait.<\/p>\n<p data-pi=\"25\">PERDICAN : Comment est-elle ici ? Je l'avais laissée dans l'escalier, lorsque tu m'as fait rappeler. Il faut donc qu'elle m'ait suivi sans que je m'en sois aperçu.<\/p>\n<p data-pi=\"26\">CAMILLE : Entrons dans cette galerie ; c'est là qu'on a crié.<\/p>\n<p data-pi=\"27\">PERDICAN : Je ne sais ce que j'éprouve ; il me semblé que mes mains sont couvertes de sang.<\/p>\n<p data-pi=\"28\">CAMILLE : La pauvre enfant nous a sans doute épiés ; elle s'est encore évanouie ; viens, portons-lui secours ; hélas tout cela est cruel.<\/p>\n<p data-pi=\"29\">PERDICAN : Non, en vérité, je n'entrerai pas ; je sens un froid mortel qui me paralyse. Vas-y, Camille, et tâche de la ramener.<br/>\n<em>Camille sort.<br/>\n<\/em><\/p>\n<p data-pi=\"30\">Le basculement de la scène s’opère entre les deux didascalies. Cela marque donc la soudaineté. La parataxe (absence de mots de liaison) accentue la brutalité de ce basculement. C’est un cri que pousse Rosette, et non une parole, les mots ayant concouru à cette fin tragique. Le lecteur / spectateur est surpris car à la différence des autres rendez-vous mis en scène, dans celui-ci qui est sincère il n’a pas été prévu de cacher Rosette et l’on ignore donc qu’elle l’est. Dès que le cri retentit, les erreurs du passé ressurgissent. Camille reconnait la voix de sa sœur de lait et Perdican n’a pas fait suffisamment attention à elle « je l’avais laissée dans l’escalier ». A partir de cet instant il y a une tension et les réactions des deux personnages seront différentes. Ils vont être séparés car Camille va sortir et Perdican va demeurer. Camille utilise des présentatifs « c’est la voix, C’est là qu’on a crié » ce qui traduit sa volonté de se montrer factuelle, de s’en tenir aux faits et de diriger ses actions sans se laisser déborder par les émotions. Le recours aux impératif (entrons, viens, portons) conforte cette vision et cette réaction. Elle va employer également l’indicatif et non le conditionnel (elle s’est encore évanouie) comme pour conjurer le sort et l’adverbe « encore » renvoie à l’acte III scène 6, dans laquelle elle trouve aussi Rosette évanouie. A l’inverse Perdican pense à une hypothèse plus sombre et il a un pressentiment funeste. Aussi emploie-t-il le subjonctif « il faut donc qu’elle m’ait suivi sans que je m’en sois aperçu », retardant le dénouement tragique car pour lui cela n’est pas encore réel.<\/p>\n<p data-pi=\"31\">Par ailleurs son pressentiment est vague et diffus (je ne sais ce que j’éprouve / il me semble). Il est davantage dans l’intuition par rapport à Camille donc dans le factuel. Au-delà de l’intuition ce sont même des visions « il me semble que mes mains sont couvertes de sang ». Cela peut être analysé comme une référence à-au personnage Shakespearien de la reine meurtrière Lady Macbeth, obsédée par la vision de tâches de sang sur ses mains. Ce pressentiment de Perdican s’accompagne du champ lexical de la mort (funeste, sang, froid mortel). Lâchement il ne va pas se rendre auprès de Rosette enjoignant à Camille de le faire (vas-y). On se dirige alors vers un dénouement tragique ; comme dans la tragédie classique la mort n’a pas lieu sur scène, et dès lors que Camille et Perdican seront séparés physiquement par la sortie de Camille, l’on devine que cette séparation sera irrémédiable.<\/p>\n<h2 data-pi=\"32\" id=\"s4\">Troisième mouvement : Une issue tragique<\/h2>\n<p data-pi=\"33\">Je vous en supplie, mon Dieu ! ne faites pas de moi un meurtrier ! Vous voyez ce qui se passe ; nous sommes deux enfants insensés, et nous avons joué avec la vie et la mort ; mais notre cœur est pur ; ne tuez pas Rosette, Dieu juste ! Je lui trouverai un mari, je réparerai ma faute ; elle est jeune, elle sera riche, elle sera heureuse ; ne faites pas cela, à Dieu ! vous pouvez bénir encore quatre de vos enfants. Eh bien ! Camille, qu'y a-t-il ?<br/>\n<em>Camille rentre.<\/em><\/p>\n<p data-pi=\"34\">CAMILLE : Elle est morte. Adieu, Perdican !<\/p>\n<p data-pi=\"35\">C’est une supplication lyrique à laquelle se livre Perdican demeuré seul. Il s’adresse à Dieu (Dieu / Dieu juste) qu’il vouvoie (contrairement au tutoiement du début de l’extrait). Il passe de la position du dandy à celle de l’enfant dans la prière et les impératifs employés (ne faits pas, ne tuez pas) ont effectivement pour valeur la prière. Dieu devient le metteur en scène, c’est lui qui « fait ». Perdican n’est meurtrier que par la volonté de Dieu. Perdican reprend alors les mêmes arguments qu’au début de l’extrait : ils sont deux enfants insensés, ils ont joué avec la vie et la mort. Mais leur cœur est pur et c’est une prière sincère et la pureté de leur cœur rend les personnages à la fois coupables et innocents. Perdican semble aussi cheminer vers le repentir (je réparerai ma faute) avec un futur de promesse, de même que vont suivre les futurs « je lui trouverai un mari », « elle sera riche », « elle sera heureuse » qui sonnent comme des futurs de fausse certitude, comme une valeur prédictive. C’est comme si Perdican, naïvement pensait encore pouvoir mettre son destin en scène campant alors le héros romantique, sensible et imaginatif. Cela étant le champ lexical de la mort continue d’annoncer une fin tragique et la rupture dans sa réplique (eh bien ! Camille, qu’y a-t-il ?) marque le retour à la réalité et c’est un changement de ton dans cette question brève mais dont on imagine que la réponse se trouve déjà sur le visage de Camille qui rentre.<\/p>\n<p data-pi=\"36\">La dernière réplique de Camille est tout aussi brève. D’abord trois mots très bref (épitrochasme) d’une seule syllabe (elle est morte). Réplique brutale et l’on aurait pu attendre un euphémisme dans cette situation (elle n’est plus), brutalité qui va annoncer que cette mort remet tout le reste en question. Succède alors une phrase nominale, courte aussi Adieu Perdican. C’est alors la conséquence directe de la mort de Rosette. Le titre de la pièce est enfin élucidée : ce n’était pas un simple avertissement mais bien une vérité universelle.<\/p>\n<h2 data-pi=\"37\" id=\"s5\">Conclusion<\/h2>\n<p data-pi=\"38\">Deux coups de théâtre dans cette scène finale, l’un heureux avec l’aveu sincère des sentiments des personnages, l’autre malheureux avec la mort de Rosette. Le sens du proverbe est dévoilé : exprimer les sentiments du cœur est difficile du fait de la peur de souffrir, mais jouer avec la parole peut avoir des conséquences tragiques.<\/p>\n<p data-pi=\"39\">A la mort physique des amants, Musset préfère la mort de l’amour. C’est aussi le cas dans sa pièce <cite>Les caprices de Marianne<\/cite>.<\/p>\n", "idx": ["PERDICAN : Insensés que nous sommes ! nous nous aimons. Quel songe avons-nous fait, Camille ? Quelles vaines paroles, quelles misérables folies ont passé comme un vent funeste entre nous deux ? Lequel de nous a voulu tromper l'autre ? Hélas ! cette vie est elle-même un si pénible rêve : pourquoi encore y mêler les nôtres ? ô mon Dieu ! le bonheur est une perle si rare dans cet océan d'ici-bas ! Tu nous l'avais donné, pêcheur céleste, tu l'avais tiré pour nous des profondeurs de l'abîme, cet inestimable joyau ; et nous, comme des enfants gâtés que nous sommes, nous en avons fait un jouet. Le vert sentier qui nous amenait l'un vers l'autre avait une pente si douce, il était entouré de buissons si fleuris, il se perdait dans un si tranquille horizon ! Il a bien fallu que la vanité, le bavardage et la colère vinssent jeter leurs rochers informes sur cette route céleste, qui nous aurait conduits à toi dans un baiser ! Il a bien fallu que nous nous fissions du mal, car nous sommes des hommes. Ô insensés ! nous nous aimons. Il la prend dans ses bras.", "CAMILLE : Oui, nous nous aimons, Perdican ; laisse-moi le sentir sur ton coeur. Ce Dieu qui nous regarde ne s'en offensera pas ; il veut bien que je t'aime ; il y a quinze ans qu'il le sait.", "PERDICAN : Chère créature, tu es à moi ! Il l'embrasse ; on entend un grand cri derrière l'autel.", "CAMILLE : C'est la voix de ma sœur de lait.", "PERDICAN : Comment est-elle ici ? Je l'avais laissée dans l'escalier, lorsque tu m'as fait rappeler. Il faut donc qu'elle m'ait suivi sans que je m'en sois aperçu.", "CAMILLE : Entrons dans cette galerie ; c'est là qu'on a crié.", "PERDICAN : Je ne sais ce que j'éprouve ; il me semblé que mes mains sont couvertes de sang.", "CAMILLE : La pauvre enfant nous a sans doute épiés ; elle s'est encore évanouie ; viens, portons-lui secours ; hélas tout cela est cruel.", "PERDICAN : Non, en vérité, je n'entrerai pas ; je sens un froid mortel qui me paralyse. Vas-y, Camille, et tâche de la ramener. Camille sort. Je vous en supplie, mon Dieu ! ne faites pas de moi un meurtrier ! Vous voyez ce qui se passe ; nous sommes deux enfants insensés, et nous avons joué avec la vie et la mort ; mais notre cœur est pur ; ne tuez pas Rosette, Dieu juste ! Je lui trouverai un mari, je réparerai ma faute ; elle est jeune, elle sera riche, elle sera heureuse ; ne faites pas cela, à Dieu ! vous pouvez bénir encore quatre de vos enfants. Eh bien ! Camille, qu'y a-t-il ? Camille rentre.", "CAMILLE : Elle est morte. Adieu, Perdican !", "Introduction", "Alfred de Musset, auteur romantique du XIX° siècle, peinant à trouver des repères dans un monde dans lequel il ne se reconnait pas, décide à la suite de l’échec de sa pièce La nuit vénitienne de n’écrire plus que pour être lu, délaissant la représentation sur scène. C’est dans ce cadre que parait On ne badine pas avec l’amour inspiré de sa propre histoire avec George Sand (lorsqu’ils sont à Venise, Musset tombe malade et Sand aura une aventure avec son médecin). Mettant en scène un trio amoureux entre Perdican, Camille et Rosette sa sœur de lait, les jeux de langage dans la pièce vise à ne pas dévoiler ses sentiments mais à forcer l’autre à le faire. Camille refuse au début de la pièce d’embrasser son cousin Perdican, mettant en péril le projet de mariage. Dès lors, chacun piqué par son orgueil se livrera à un jeu cruel en manipulant Rosette. Les personnages sont de plus en plus troublés ce qui conduit Camille, dans cette scène finale, à se réfugier dans un oratoire pour en appeler à Dieu.", "Lecture", "Nous verrons dans quelle mesure ce dénouement révèle que les jeux du cœur et de la parole ne peuvent mener qu’à une issue tragique.", "Le texte sera décomposé en trois mouvements. Vers une fin heureuse des lignes 1 à 16, un rebondissement imprévu des lignes 16 à 26 et une issue tragique de la ligne 27 à la fin.", "Premier Mouvement : Vers une fin heureuse ?", "PERDICAN : Insensés que nous sommes ! nous nous aimons. Quel songe avons-nous fait, Camille ? Quelles vaines paroles, quelles misérables folies ont passé comme un vent funeste entre nous deux ? Lequel de nous a voulu tromper l'autre ? Hélas ! cette vie est elle-même un si pénible rêve : pourquoi encore y mêler les nôtres ? ô mon Dieu ! le bonheur est une perle si rare dans cet océan d'ici-bas ! Tu nous l'avais donné, pêcheur céleste, tu l'avais tiré pour nous des profondeurs de l'abîme, cet inestimable joyau ; et nous, comme des enfants gâtés que nous sommes, nous en avons fait un jouet. Le vert sentier qui nous amenait l'un vers l'autre avait une pente si douce, il était entouré de buissons si fleuris, il se perdait dans un si tranquille horizon ! Il a bien fallu que la vanité, le bavardage et la colère vinssent jeter leurs rochers informes sur cette route céleste, qui nous aurait conduits à toi dans un baiser ! Il a bien fallu que nous nous fissions du mal, car nous sommes des hommes. Ô insensés ! nous nous aimons. Il la prend dans ses bras.", "CAMILLE : Oui, nous nous aimons, Perdican ; laisse-moi le sentir sur ton cœur. Ce Dieu qui nous regarde ne s'en offensera pas ; il veut bien que je t'aime ; il y a quinze ans qu'il le sait.", "PERDICAN : Chère créature, tu es à moi ! Il l'embrasse ;", "Le lieu « l’oratoire » qui est une petite chapelle est précisé comme pour garantir la sincérité des personnages et ici c’est comme si Dieu était le spectateur garant de la parole à venir. Si Musset critique l’Eglise il croit aussi en un Dieu accessible par le cœur. D’ailleurs dans sa réplique Perdican va s’adresser à Dieu (Ô mon Dieu) en employant le tutoiement. Les types de phrases traduisent l’émotion de Perdican qui s’exprime dans nombre d’exclamatives et d’interrogatives. Cette émotion exprime la sincérité de Perdican qui a laissé tomber le masque de l’orgueil. Dès lors, il va exprimer des regrets. D’abord dans les temps utilisés qui sont des temps du passé : ainsi le passé composé (avons-nous fait, a voulu), le plus que parfait (avais donné, avais tiré), l’imparfait (nous amenait, se perdait), le conditionnel passé à valeur d’irréel du passé (nous aurait conduits). La sincérité se lit aussi dans la beauté du discours de Perdican et des métaphores auxquelles il recourt : celle de la route céleste menant au paradis (pente si douce, buissons si fleuris, si tranquille horizon avec la reprise des adverbes d’intensité « si »), celle des rochers informes qui rappelle les phoques difformes de l’acte II, scène 5, celle de la perle rare que Dieu est capable (pêcheur céleste) de sortir de l’abîme et de leur offrir ; ici, Perdican exprime le remords par l’antithèse entre le joyau offert et le « jouet » qu’en ont fait Camille et lui.", "Perdican s’interroge aussi sur les forces contraires qui ont participé à ce résultat qu’il déplore. Ainsi beaucoup d’interrogations questionnent en ce sens « quelles vaines paroles, quelles misérables folies ? », de même que la forme impersonnelle « il a bien fallu » répétée deux fois. La personnification de la vanité du bavardage et de la colère (qui viennent jeter les rochers informes) donc qui ont jeté des obstacles sur leur route. La culpabilité de Perdican vis-à-vis de lui-même et de Camille existe « nous en avons fait un jouet », « lequel de nous deux a voulu tromper l’autre », ais elle est atténué ou expliquée par le fait qu’ils soient insensés (qui débute la réplique et la termine comme une boucle que l’on ferme).", "Perdican tout au long de la réplique s’est rapproché de Camille jusqu’à la didascalie, « il la prend dans ses bras ». Camille va donner les signes d’un dénouement heureux en reprenant « oui nous nous aimons » et en convoquant le cœur, ce ne sont plus les mots et la parole trompeuse mais le cœur authentique qui le signifie. Et Camille, venue parler à Dieu dans cet oratoire, accepte l’amour humain, avec une union de l’amour humain et divin (Camille emploie une litote : ce Dieu…ne s’en offusquera pas). Finalement ils obtiennent ce qu’ils voulaient et nous avons le sentiment d’un dénouement heureux digne de la comédie avec l’aveu des sentiments sincères et réciproques. Par ailleurs la didascalie « il l’embrasse » semble clore la pièce dont le nœud est précisément le refus de Camille lors de leurs retrouvailles d’embrasser Perdican.", "Deuxième mouvement : Un rebondissement imprévu", "; on entend un grand cri derrière l'autel.", "CAMILLE : C'est la voix de ma sœur de lait.", "PERDICAN : Comment est-elle ici ? Je l'avais laissée dans l'escalier, lorsque tu m'as fait rappeler. Il faut donc qu'elle m'ait suivi sans que je m'en sois aperçu.", "CAMILLE : Entrons dans cette galerie ; c'est là qu'on a crié.", "PERDICAN : Je ne sais ce que j'éprouve ; il me semblé que mes mains sont couvertes de sang.", "CAMILLE : La pauvre enfant nous a sans doute épiés ; elle s'est encore évanouie ; viens, portons-lui secours ; hélas tout cela est cruel.", "PERDICAN : Non, en vérité, je n'entrerai pas ; je sens un froid mortel qui me paralyse. Vas-y, Camille, et tâche de la ramener. Camille sort.", "Le basculement de la scène s’opère entre les deux didascalies. Cela marque donc la soudaineté. La parataxe (absence de mots de liaison) accentue la brutalité de ce basculement. C’est un cri que pousse Rosette, et non une parole, les mots ayant concouru à cette fin tragique. Le lecteur / spectateur est surpris car à la différence des autres rendez-vous mis en scène, dans celui-ci qui est sincère il n’a pas été prévu de cacher Rosette et l’on ignore donc qu’elle l’est. Dès que le cri retentit, les erreurs du passé ressurgissent. Camille reconnait la voix de sa sœur de lait et Perdican n’a pas fait suffisamment attention à elle « je l’avais laissée dans l’escalier ». A partir de cet instant il y a une tension et les réactions des deux personnages seront différentes. Ils vont être séparés car Camille va sortir et Perdican va demeurer. Camille utilise des présentatifs « c’est la voix, C’est là qu’on a crié » ce qui traduit sa volonté de se montrer factuelle, de s’en tenir aux faits et de diriger ses actions sans se laisser déborder par les émotions. Le recours aux impératif (entrons, viens, portons) conforte cette vision et cette réaction. Elle va employer également l’indicatif et non le conditionnel (elle s’est encore évanouie) comme pour conjurer le sort et l’adverbe « encore » renvoie à l’acte III scène 6, dans laquelle elle trouve aussi Rosette évanouie. A l’inverse Perdican pense à une hypothèse plus sombre et il a un pressentiment funeste. Aussi emploie-t-il le subjonctif « il faut donc qu’elle m’ait suivi sans que je m’en sois aperçu », retardant le dénouement tragique car pour lui cela n’est pas encore réel.", "Par ailleurs son pressentiment est vague et diffus (je ne sais ce que j’éprouve / il me semble). Il est davantage dans l’intuition par rapport à Camille donc dans le factuel. Au-delà de l’intuition ce sont même des visions « il me semble que mes mains sont couvertes de sang ». Cela peut être analysé comme une référence à-au personnage Shakespearien de la reine meurtrière Lady Macbeth, obsédée par la vision de tâches de sang sur ses mains. Ce pressentiment de Perdican s’accompagne du champ lexical de la mort (funeste, sang, froid mortel). Lâchement il ne va pas se rendre auprès de Rosette enjoignant à Camille de le faire (vas-y). On se dirige alors vers un dénouement tragique ; comme dans la tragédie classique la mort n’a pas lieu sur scène, et dès lors que Camille et Perdican seront séparés physiquement par la sortie de Camille, l’on devine que cette séparation sera irrémédiable.", "Troisième mouvement : Une issue tragique", "Je vous en supplie, mon Dieu ! ne faites pas de moi un meurtrier ! Vous voyez ce qui se passe ; nous sommes deux enfants insensés, et nous avons joué avec la vie et la mort ; mais notre cœur est pur ; ne tuez pas Rosette, Dieu juste ! Je lui trouverai un mari, je réparerai ma faute ; elle est jeune, elle sera riche, elle sera heureuse ; ne faites pas cela, à Dieu ! vous pouvez bénir encore quatre de vos enfants. Eh bien ! Camille, qu'y a-t-il ? Camille rentre.", "CAMILLE : Elle est morte. Adieu, Perdican !", "C’est une supplication lyrique à laquelle se livre Perdican demeuré seul. Il s’adresse à Dieu (Dieu / Dieu juste) qu’il vouvoie (contrairement au tutoiement du début de l’extrait). Il passe de la position du dandy à celle de l’enfant dans la prière et les impératifs employés (ne faits pas, ne tuez pas) ont effectivement pour valeur la prière. Dieu devient le metteur en scène, c’est lui qui « fait ». Perdican n’est meurtrier que par la volonté de Dieu. Perdican reprend alors les mêmes arguments qu’au début de l’extrait : ils sont deux enfants insensés, ils ont joué avec la vie et la mort. Mais leur cœur est pur et c’est une prière sincère et la pureté de leur cœur rend les personnages à la fois coupables et innocents. Perdican semble aussi cheminer vers le repentir (je réparerai ma faute) avec un futur de promesse, de même que vont suivre les futurs « je lui trouverai un mari », « elle sera riche », « elle sera heureuse » qui sonnent comme des futurs de fausse certitude, comme une valeur prédictive. C’est comme si Perdican, naïvement pensait encore pouvoir mettre son destin en scène campant alors le héros romantique, sensible et imaginatif. Cela étant le champ lexical de la mort continue d’annoncer une fin tragique et la rupture dans sa réplique (eh bien ! Camille, qu’y a-t-il ?) marque le retour à la réalité et c’est un changement de ton dans cette question brève mais dont on imagine que la réponse se trouve déjà sur le visage de Camille qui rentre.", "La dernière réplique de Camille est tout aussi brève. D’abord trois mots très bref (épitrochasme) d’une seule syllabe (elle est morte). Réplique brutale et l’on aurait pu attendre un euphémisme dans cette situation (elle n’est plus), brutalité qui va annoncer que cette mort remet tout le reste en question. Succède alors une phrase nominale, courte aussi Adieu Perdican. C’est alors la conséquence directe de la mort de Rosette. Le titre de la pièce est enfin élucidée : ce n’était pas un simple avertissement mais bien une vérité universelle.", "Conclusion", "Deux coups de théâtre dans cette scène finale, l’un heureux avec l’aveu sincère des sentiments des personnages, l’autre malheureux avec la mort de Rosette. Le sens du proverbe est dévoilé : exprimer les sentiments du cœur est difficile du fait de la peur de souffrir, mais jouer avec la parole peut avoir des conséquences tragiques.", "A la mort physique des amants, Musset préfère la mort de l’amour. C’est aussi le cas dans sa pièce Les caprices de Marianne."]}, {"slug": "ll4", "cat": "theatre", "group": "Lectures linéaires", "title": "Cyrano, la scène du balcon", "sub": "Lecture linéaire n°4 · Rostand, Acte III, scène 7", "obj": [], "toc": [["s1", "Introduction"], ["s2", "Premier mouvement : La déception de Roxane"], ["s3", "Deuxième mouvement vers 4 à 15 : Les mots de Cyrano retiennent Roxane"], ["s4", "Troisième mouvement : La séduction de Roxane par les mots de Cyrano"], ["s5", "Conclusion"]], "html": "\n<section class=\"extrait\"><p class=\"extrait-label\">Le texte<\/p><h3 data-pi=\"0\">Acte III, scène 7<\/h3><p data-pi=\"1\"><strong>ROXANE<\/strong>, <em>entrouvrant sa fenêtre<\/em>  Qui donc m’appelle ?<\/p><p data-pi=\"2\"><strong>CHRISTIAN<\/strong> Moi.<\/p><p data-pi=\"3\"><strong>ROXANE<\/strong> Qui, moi ?<\/p><p data-pi=\"4\"><strong>CHRISTIAN<\/strong> Christian.<\/p><p data-pi=\"5\"><strong>ROXANE<\/strong>, <em>avec dédain<\/em> C’est vous. //<\/p><p data-pi=\"6\"><strong>CHRISTIAN<\/strong> Je voudrais vous parler.<\/p><p data-pi=\"7\"><strong>CYRANO<\/strong>, <em>sous le balcon, à Christian<\/em> Bien. Bien. Presque à voix basse. //<\/p><p data-pi=\"8\"><strong>ROXANE<\/strong> Non ! Vous parlez trop mal. Allez-vous-en !<\/p><p data-pi=\"9\"><strong>CHRISTIAN<\/strong> De grâce !… //<\/p><p data-pi=\"10\"><strong>ROXANE<\/strong> Non ! Vous ne m’aimez plus !<\/p><p data-pi=\"11\"><strong>CHRISTIAN<\/strong><em>, à<\/em> <em>qui Cyrano souffle ses mots<\/em> M’accuser, - justes dieux !-//<\/p><p data-pi=\"12\">De n’aimer plus …quand…j’aime plus !<\/p><p data-pi=\"13\"><strong>ROXANE<\/strong>, <em>qui allait refermer sa fenêtre, s’arrêtant<\/em> Tiens, mais c’est mieux ! //<\/p><p data-pi=\"14\"><strong>CHRISTIAN<\/strong>, <em>même jeu<\/em> L’amour grandit bercé dans mon âme inquiète… //<\/p><p data-pi=\"15\">Que ce … cruel marmot prit pour …barcelonnette ! //<\/p><p data-pi=\"16\"><strong>ROXANE<\/strong>, <em>s’avançant sur le balcon<\/em> C’est mieux ! – Mais, puisqu’il est cruel, vous fûtes sot //<\/p><p data-pi=\"17\">De ne pas, cet amour, l’étouffer au berceau ! //<\/p><p data-pi=\"18\"><strong>CHRISTIAN<\/strong>, <em>même jeu<\/em> Aussi l’ai-je tenté, mais …tentative nulle : //<\/p><p data-pi=\"19\">Ce…nouveau-né, Madame, est un petit …Hercule //<\/p><p data-pi=\"20\"><strong>ROXANE<\/strong> C’est mieux !<\/p><p data-pi=\"21\"><strong>CHRISTIAN<\/strong>, <em>même jeu<\/em> De sorte qu’il …strangula comme rien… //<\/p><p data-pi=\"22\">Les deux serpents…Orgueil et Doute.<\/p><p data-pi=\"23\"><strong>ROXANE<\/strong>, <em>s’accoudant au balcon<\/em> Ah ! c’est très bien. //<\/p><p data-pi=\"24\">Mais pourquoi parlez-vous de façon peu hâtive ? //<\/p><p data-pi=\"25\">Auriez-vous donc la goutte à l’imaginative ? //<\/p><p data-pi=\"26\"><strong>CYRANO<\/strong>, <em>tirant Christian sous le balcon, et se glissant à sa place<\/em> Chut ! Cela devient trop difficile !…<\/p><p data-pi=\"27\"><strong>ROXANE<\/strong> Aujourd’hui…//<\/p><p data-pi=\"28\">Vos mots sont hésitants. Pourquoi ?<\/p><p data-pi=\"29\"><strong>CYRANO<\/strong>, <em>parlant à mi-voix, comme Christian<\/em> C’est qu’il fait nuit, //<\/p><p data-pi=\"30\">Dans cette ombre, à tâtons, ils cherchent votre oreille.//<\/p><p data-pi=\"31\"><strong>ROXANE<\/strong> Les miens n’éprouvent pas difficulté pareille. //<\/p><p data-pi=\"32\"><strong>CYRANO<\/strong> Ils trouvent tout de suite ? oh ! cela va de soi,//<\/p><p data-pi=\"33\">Puisque c’est dans mon cœur, eux, que je les reçoi ; //<\/p><p data-pi=\"34\">Or, moi, j’ai le cœur grand, vous, l’oreille petite.//<\/p><p data-pi=\"35\">D’ailleurs vos mots, à vous, descendent : ils vont plus vite. //<\/p><p data-pi=\"36\">Les miens montent, Madame : il leur faut plus de temps ! //<\/p><p data-pi=\"37\"><strong>ROXANE<\/strong> Mais ils montent bien mieux depuis quelques instants. //<\/p><p data-pi=\"38\"><strong>CYRANO<\/strong> De cette gymnastique, ils ont pris l’habitude ! //<\/p><p data-pi=\"39\"><strong>ROXANE<\/strong> Je vous parle, en effet, d’une vraie altitude ! //<\/p><p data-pi=\"40\"><strong>CYRANO<\/strong> Certe, et vous me tueriez si de cette hauteur //<\/p><p data-pi=\"41\">Vous me laissiez tomber un mot dur sur le cœur. //<\/p><p data-pi=\"42\"><strong>ROXANE<\/strong>, <em>avec un mouvement<\/em> Je descends.<\/p><p data-pi=\"43\"><strong>CYRANO<\/strong>, <em>vivement<\/em> Non !<\/p><\/section><h2 data-pi=\"44\" id=\"s1\">Introduction<\/h2>\n<p data-pi=\"45\">Ecrite par Edmond Rostand, la pièce Cyrano de Bergerac se situe au XVII° siècle et met en scène un mousquetaire, amoureux de sa cousine Roxane, mais sa laideur (très long nez) l’obligera à l’aimer par procuration par l’entremise de Christian, dont Roxane est amoureuse. Christian est beau mais pas éloquent et ne maîtrise pas l’art des mots, l’art de la séduction par les mots. Ce sont donc ceux que Cyrano lui prêtera qui sauront toucher Roxane. La scène étudiée est justement celle du balcon. Après une tentative échouée de parler seul à Roxane, Christian fait appel au secours de Cyrano, qui dissimulé dans l’ombre lui souffle ses mots.<\/p>\n<p data-pi=\"46\">Lecture<\/p>\n<p data-pi=\"47\">Nous verrons comment ce jeu de paroles permet de dévoiler le cœur de Cyrano.<\/p>\n<p data-pi=\"48\">Ce texte est découpé en trois mouvements : des lignes 1 à 10 (vers 1 à 4) qui montrent la déception de Roxane face à la pauvreté des mots de Christian, puis des lignes 11 à 25 (vers 4 à 15) dans lequel Roxane sera retenue par les mots de Cyrano avant d’être séduite dans le dernier mouvement des lignes 26 à 44 (vers 16 à 30).<\/p>\n<h2 data-pi=\"49\" id=\"s2\">Premier mouvement : La déception de Roxane<\/h2>\n<p data-pi=\"50\"><strong>ROXANE<\/strong>, <em>entrouvrant sa fenêtre<\/em>  Qui donc m’appelle ?<\/p>\n<p data-pi=\"51\"><strong>CHRISTIAN<\/strong> Moi.<\/p>\n<p data-pi=\"52\"><strong>ROXANE<\/strong> Qui, moi ?<\/p>\n<p data-pi=\"53\"><strong>CHRISTIAN<\/strong> Christian.<\/p>\n<p data-pi=\"54\"><strong>ROXANE<\/strong>, <em>avec dédain<\/em> C’est vous. //<\/p>\n<p data-pi=\"55\"><strong>CHRISTIAN<\/strong> Je voudrais vous parler.<\/p>\n<p data-pi=\"56\"><strong>CYRANO<\/strong>, <em>sous le balcon, à Christian<\/em> Bien. Bien. Presque à voix basse. //<\/p>\n<p data-pi=\"57\"><strong>ROXANE<\/strong> Non ! Vous parlez trop mal. Allez-vous-en !<\/p>\n<p data-pi=\"58\"><strong>CHRISTIAN<\/strong> De grâce !… //<\/p>\n<p data-pi=\"59\"><strong>ROXANE<\/strong> Non ! Vous ne m’aimez plus !<\/p>\n<p data-pi=\"60\">Si Rostand disloque l’alexandrin ici, c’est à la fois pour dynamiser le début de l’échange marqué par la déception de Roxane suite à la dernière entrevue avec Christian seul, et pour faire oublier le rythme et la sonorité de la versification. C’est donc un échange spontané et assez vif entre les personnages. Si Roxane essaie de faire parler Christian les échanges sont laconiques (moi / qui moi ? / c’est vous) et Christian ne parvient même pas à fournir de réponse complète obligeant Roxane à le relancer. Il ne parvient pas à engager de discussion alors même que Cyrano est là, ce que voient tant Christian que le spectateur (didascalie sous le balcon) et qui encourage Christian. Roxane elle, a sans doute compris que Christian était celui qui l’appelait mais sa question « Qui moi ? » est un appel pour faire parler Christian alors qu’elle est toujours sous le coup de la déception. Mais Christian ne saisit pas cette attente et ne parvient donc pas à s’exprimer ce qui entraîne le dédain de Roxane (didascalie : avec dédain). Roxane affiche donc un refus catégorique d’échanger plus avant avec Christian : deux des répliques commencent par « non » et ces répliques sonnent comme des jugements définitifs. Le premier rappelant la piètre éloquence de Christian (vous parlez trop mal). Ici le jugement de valeur est extrêmement sévère avec l’adverbe d’intensité « trop » à ce point que la sanction subséquente se trouve dans l’injonction impérative « Allez-vous-en ». Le second jugement sonne lui comme la conclusion mélodramatique de cette incapacité à être éloquent devant elle (vous ne m’aimez plus). Si cela paraît une rupture définitive de Roxane, il ne faut pas oublier qu’elle est éprise de Christian et espère qu’il va retrouver les mots qui sauront la toucher.<\/p>\n<h2 data-pi=\"61\" id=\"s3\">Deuxième mouvement vers 4 à 15 : Les mots de Cyrano retiennent Roxane<\/h2>\n<p data-pi=\"62\"><strong>CHRISTIAN<\/strong><em>, à<\/em> <em>qui Cyrano souffle ses mots<\/em> M’accuser, - justes dieux !-//<\/p>\n<p data-pi=\"63\">De n’aimer plus …quand…j’aime plus !<\/p>\n<p data-pi=\"64\"><strong>ROXANE<\/strong>, <em>qui allait refermer sa fenêtre, s’arrêtant<\/em> Tiens, mais c’est mieux ! //<\/p>\n<p data-pi=\"65\"><strong>CHRISTIAN<\/strong>, <em>même jeu<\/em> L’amour grandit bercé dans mon âme inquiète… //<\/p>\n<p data-pi=\"66\">Que ce … cruel marmot prit pour …barcelonnette ! //<\/p>\n<p data-pi=\"67\"><strong>ROXANE<\/strong>, <em>s’avançant sur le balcon<\/em> C’est mieux ! – Mais, puisqu’il est cruel, vous fûtes sot //<\/p>\n<p data-pi=\"68\">De ne pas, cet amour, l’étouffer au berceau ! //<\/p>\n<p data-pi=\"69\"><strong>CHRISTIAN<\/strong>, <em>même jeu<\/em> Aussi l’ai-je tenté, mais …tentative nulle : //<\/p>\n<p data-pi=\"70\">Ce…nouveau-né, Madame, est un petit …Hercule //<\/p>\n<p data-pi=\"71\"><strong>ROXANE<\/strong> C’est mieux !<\/p>\n<p data-pi=\"72\"><strong>CHRISTIAN<\/strong>, <em>même jeu<\/em> De sorte qu’il …strangula comme rien… //<\/p>\n<p data-pi=\"73\">Les deux serpents…Orgueil et Doute.<\/p>\n<p data-pi=\"74\"><strong>ROXANE<\/strong>, <em>s’accoudant au balcon<\/em> Ah ! c’est très bien. //<\/p>\n<p data-pi=\"75\">Mais pourquoi parlez-vous de façon peu hâtive ? //<\/p>\n<p data-pi=\"76\">Auriez-vous donc la goutte à l’imaginative ? //<\/p>\n<p data-pi=\"77\">C’est à partir du début du quatrième vers (lignes 10 /11) que les mots de Cyrano vont précéder ceux de Christian, indication qui nous est communiquée par la didascalie « à qui Cyrano souffle ses mots » et des trois occurrences de celle « même jeu ». Dès lors la qualité de la parole change et le discours devient fluide, construit, et poétique. Il gagne en longueur ; alors que jusqu’à présent Christian ne parvenait à énoncer que de courtes paroles incomplètes, qui ici, soufflèes par Cyrano, deviennent des vers complets (lignes 14 / 15). Et quand ce ne sont pas des vers complets ils sont partagés dans leur construction avec Roxane ce qui appuie leur connivence et leur complicité dans la parole et les mots échangés. Par ailleurs et contrairement au début du texte où elle affichait du dédain, c’est ici une admiration qui transparait de ses mots « C’est mieux / Ah c’est très bien » qui partagent les vers de Cyrano soit qu’ils soient placés en tête de vers, soit en fin. Les jugements de valeur de Roxane suivent par ailleurs un rythme crescendo passant du comparatif (deux occurrences : tiens ! mais c’est mieux ! et c’est mieux) au superlatif (ah ! c’est très bien). Au-delà de la fluidité de la parole c’est la poésie qui tranche ici avec le premier mouvement. Cyrano va avoir recours à des métaphores. Son âme inquiète, devient du fait du mouvement une barcelonnette et son amour est assimilé à un « cruel marmot » traduisant ainsi le tourment que cet amour lui cause. Après la connivence dans les mots, c’est la connivence et la complicité culturelle qui s’installe entre les deux personnages, lorsque Cyrano assimile son amour à Hercule : référence à la mythologie, Hercule avait étranglé, alors qu’il n’avait que 10 mois, deux serpents envoyés par jalousie par Héra, l’épouse de Zeus, pour le tuer. Cyrano entraîne avec lui Roxane et les deux personnages sont cultivés et possèdent de l’esprit et jouent avec les mots ; au terme « étouffer » par exemple, Cyrano répondra par « stranguler ». Ainsi, en convoquant Hercule, Cyrano témoigne de la force et de la puissance de cet amour. Toutefois les paroles étant prononcées par Christian après que Cyrano les lui a soufflées, Roxane le trouve hésitant et va le lui notifier « mais pourquoi parlez-vous de façon peu hâtive ? » et par la référence à la maladie infectieuse de la goutte. Cyrano va donc être contraint de prendre la place de Christian de crainte que leur subterfuge ne soit découvert.<\/p>\n<h2 data-pi=\"78\" id=\"s4\">Troisième mouvement : La séduction de Roxane par les mots de Cyrano<\/h2>\n<p data-pi=\"79\"><strong>CYRANO<\/strong>, <em>tirant Christian sous le balcon, et se glissant à sa place<\/em> Chut ! Cela devient trop difficile !…<\/p>\n<p data-pi=\"80\"><strong>ROXANE<\/strong> Aujourd’hui…//<\/p>\n<p data-pi=\"81\">Vos mots sont hésitants. Pourquoi ?<\/p>\n<p data-pi=\"82\"><strong>CYRANO<\/strong>, <em>parlant à mi-voix, comme Christian<\/em> C’est qu’il fait nuit, //<\/p>\n<p data-pi=\"83\">Dans cette ombre, à tâtons, ils cherchent votre oreille.//<\/p>\n<p data-pi=\"84\"><strong>ROXANE<\/strong> Les miens n’éprouvent pas difficulté pareille. //<\/p>\n<p data-pi=\"85\"><strong>CYRANO<\/strong> Ils trouvent tout de suite ? oh ! cela va de soi,//<\/p>\n<p data-pi=\"86\">Puisque c’est dans mon cœur, eux, que je les reçoi ; //<\/p>\n<p data-pi=\"87\">Or, moi, j’ai le cœur grand, vous, l’oreille petite.//<\/p>\n<p data-pi=\"88\">D’ailleurs vos mots, à vous, descendent : ils vont plus vite. //<\/p>\n<p data-pi=\"89\">Les miens montent, Madame : il leur faut plus de temps ! //<\/p>\n<p data-pi=\"90\"><strong>ROXANE<\/strong> Mais ils montent bien mieux depuis quelques instants. //<\/p>\n<p data-pi=\"91\"><strong>CYRANO<\/strong> De cette gymnastique, ils ont pris l’habitude ! //<\/p>\n<p data-pi=\"92\"><strong>ROXANE<\/strong> Je vous parle, en effet, d’une vraie altitude ! //<\/p>\n<p data-pi=\"93\"><strong>CYRANO<\/strong> Certe, et vous me tueriez si de cette hauteur //<\/p>\n<p data-pi=\"94\">Vous me laissiez tomber un mot dur sur le cœur. //<\/p>\n<p data-pi=\"95\"><strong>ROXANE<\/strong>, <em>avec un mouvement<\/em> Je descends.<\/p>\n<p data-pi=\"96\"><strong>CYRANO<\/strong>, <em>vivement<\/em> Non !<\/p>\n<p data-pi=\"97\">Dès le début du mouvement ici c’est Christian qui est mis à l’écart. D’abord physiquement, il est tiré sous le balcon ; puis dans sa parole étant réduit au silence par l’onomatopée « Chut » de Cyrano qui en même temps (emploi des participes présents) se glisse à sa place. Cyrano doit masquer leur subterfuge face à l’étonnement de Roxane quant à l’hésitation dont il fait preuve. En lui répondant pour s’en justifier, les personnages se livrent à un métadiscours : ils ne parlent plus du fond et de l’essence des mots mais de la façon de les prononcer. Cyrano va utiliser le cadre spatio-temporel à cette fin. Il utilise la nuit (il fait nuit, dans cette ombre) pour justifier l’hésitation de ses mots qui par le jeu de leur personnification, doivent chercher. Grammaticalement les mots deviennent les sujets de nombreux verbes de perception comme éprouver et surtout des verbes de mouvement qui par le jeu de l’anthropomorphisme deviennent des athlètes qui doivent se surmener et fournir des efforts physiques (monter notamment, et prendre l’habitude d’une gymnastique). Roxane accepte le jeu de cette image et s’en empare en répondant avec un certain humour qu’elle lui parle d’une « vraie altitude ». Cyrano n’omet pas de mentionner le sentiment amoureux donnant aussi à cette scène sa tonalité lyrique, en mentionnant par trois fois son cœur. L’hyperbole d’un mot dur qui le tuerait s’il venait à tomber sur son cœur traduit là encore le fait que les deux personnages partagent avec élégance et un certain amusement leur amour pour les mots. Dans l’antithèse (grand / petite) il va insister tant sur la grandeur de son amour pour Roxane que pour la délicatesse de cette dernière. Mais c’est un instant suspendu, une complicité intellectuelle qui appelle les amoureux à un rapprochement physique « Je descends ». C’est ici la réalité qui reprend ses droits et la didascalie (vivement) du refus de Cyrano traduit l’obligation pour Roxane et Christian (mis de côté et oublié sur ce mouvement) de retarder le rapprochement intime, du fait même de ce subterfuge qui pourtant était le seul moyen de séduire Roxane.<\/p>\n<h2 data-pi=\"98\" id=\"s5\">Conclusion<\/h2>\n<p data-pi=\"99\">Ainsi dans cette scène, le stratège mis en place par Christian et Cyrano traduit bien l’effet des mots sur le cœur de Roxane. Déçue de leur dernier entretien, elle se laisse à nouveau emporter puis séduire. Si elle est attirée par Christian, c’est qu’au-delà de son apparence, elle pense que c’est son cœur qui lui parle alors que c’est celui de Cyrano. Ce dernier est obligé de duper Roxane, pour continuer à l’aimer par l’entremise de Christian.<\/p>\n", "idx": ["Acte III, scène 7", "ROXANE, entrouvrant sa fenêtre Qui donc m’appelle ?", "CHRISTIAN Moi.", "ROXANE Qui, moi ?", "CHRISTIAN Christian.", "ROXANE, avec dédain C’est vous. //", "CHRISTIAN Je voudrais vous parler.", "CYRANO, sous le balcon, à Christian Bien. Bien. Presque à voix basse. //", "ROXANE Non ! Vous parlez trop mal. Allez-vous-en !", "CHRISTIAN De grâce !… //", "ROXANE Non ! Vous ne m’aimez plus !", "CHRISTIAN, à qui Cyrano souffle ses mots M’accuser, - justes dieux !-//", "De n’aimer plus …quand…j’aime plus !", "ROXANE, qui allait refermer sa fenêtre, s’arrêtant Tiens, mais c’est mieux ! //", "CHRISTIAN, même jeu L’amour grandit bercé dans mon âme inquiète… //", "Que ce … cruel marmot prit pour …barcelonnette ! //", "ROXANE, s’avançant sur le ba
