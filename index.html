ersonnage de glace et de feu et si elle joue la comédie aux autres, elle se la joue aussi à elle-même ce qui en fait un personnage ambigu. Il lui arrive d'être sincère vis-à-vis de Perdican, mais en même temps elle peut être instigatrice et jalouse. Musset en fait la porte-parole de la condition féminine. Elle reste orgueilleuse ; ainsi, comprenant que Perdican lui a fait croire qu'il aimait Rosette à sa place, elle mettra en œuvre le stratagème du rideau. Toutefois cette machination sera à l'origine de sa chute. Cette chute est d'ailleurs annoncée grâce à l'onomastique choisie par Musset : Camillus étant à l'époque romaine, celui qui assistait les prêtres lors des sacrifices ; c'était le serviteur de l'autel qui avait une prédisposition pour être au contact des victimes sacrifiées, place que Rosette prendra ici à la fin de la pièce.", "Rosette", "Elle est donc la victime sacrifiée, victime de l'orgueil de Camille et de Perdican. C'est la fille de la nourrice de Camille, sa sœur de lait et son ambiguïté tient au fait qu'elle est à la fois lucide et naïve. Lucide parce qu'elle connaît et souligne sa différence sociale avec Perdican, naïve parce qu'elle se laissera séduire par ses déclarations. C'est une paysanne qui se caractérise par sa spontanéité. Elle est innocente, simple. L'onomastique l'enracine aussi dans le monde paysan et champêtre (petite rose).", "Maître Blazius", "Gouverneur de Perdican, c'est le premier personnage décrit dans la pièce dans un registre comique. Il marmotte un pater noster et le niveau de langue s'oppose à la noblesse de la prière. Il est gros, bon vivant, doté d'un triple menton, c'est un délateur. C'est un hypocrite qui à la fois tente de se rapprocher de Bridaine, mais qui fait tout pour le perdre aux yeux du baron.", "Maître Bridaine", "Il se ressemble avec maître Blazius : tous les deux sont gros, aimant la bonne chère, ils sont ignorants, ivrognes, parlant souvent pour ne rien dire et au regard du parcours la parole correspond ici à la logorrhée. Bridaine est le curé de la paroisse ; c'est un personnage caricatural et grotesque.", "Dame Pluche", "Dame pluche est un personnage caricatural. C'est une bigote très sèche, elle est la caricature de la vieille fille dévote. Le titre de « dame » est supposé lui donner une certaine respectabilité qui tombe cependant devant ses aspects caricaturaux. Elle est têtue, obstinée, hypocrite, acariâtre. Très à cheval sur les convenances et la bienséance, elle fait preuve aussi d'une dévotion excessive. Elle ne parvient pas à comprendre le jeu de Camille dont elle ne voit pas le côté manipulateur."]}, {"slug": "parcours", "cat": "theatre", "group": "Découvrir l'œuvre", "title": "Le parcours", "sub": "Les jeux du cœur et de la parole", "obj": [], "toc": [["s1", "La parole"], ["s2", "L’orgueil"], ["s3", "Exposés à venir (déjà distribués)"], ["s4", "Le jeu (au théâtre, mais il écrit seulement pour être lu), mais jeu aussi au sens de stratagème"], ["s5", "Analyse des mots clés : cœur et parole"], ["s6", "Quand la parole exprime le cœur"], ["s7", "Quand la parole cache le cœur"], ["s8", "Quand la parole est manipulatrice"], ["s9", "Deux exemples de parcours"]], "html": "\n<h2 data-pi=\"0\" id=\"s1\">La parole<\/h2>\n<p data-pi=\"1\">Les mots dont on a pu voir qu'ils pouvaient être source de drôlerie sont aussi de véritables moteurs de l'action. Ils doivent être mis en lien avec le parcours « les jeux du cœur et de la parole ». Cette parole aura dans la pièce une valeur maïeutique c'est à dire qu’elle cherche à faire sortir la vérité, à faire dévoiler les secrets aussi bien aux yeux de tous mais aussi aux yeux du personnage souvent dans un déni à la fois protecteur et rassurant. La tension dramatique va souvent osciller entre protection et exposition, avec les outils tantôt du silence tantôt des aveux, tantôt de l'explicite tantôt de l'implicite, tantôt du dit et tantôt du non-dit. Quant aux fantoches on notera par rapport à leurs mots qu'ils ne sont pas capables d'engager de véritables dialogues entre eux et que ce qu'ils disent n'a aucune écoute, aucun impact sur les jeunes gens. Mais par leur intermédiaire Musset nous montre que la parole est manipulation ; Ainsi Blazius et Bridaine s'écoutent beaucoup parler et se satisfont des effets qu’ils pensent être en mesure d'entraîner. Toutefois ces effets sont manqués et en se dénonçant l'un l'autre auprès du baron, ils ne font que décrédibiliser leur parole.<\/p>\n<p data-pi=\"2\">Le proverbe initial pourrait aussi bien être « on ne badine pas avec les mots » car Musset nous montre qu'ils sont une arme et qu'ils peuvent être destructeurs. Ce sont les mots qui tuent Rosette : les mots auxquels elle a voulu croire et les mots qui lui sont révélés dans la supercherie. Pour Camille et de façon paradoxale, les mots sont un masque derrière lequel elle se protège, masque qui lui permet de s'habiller des costumes tantôt de la prude, de la coquette, de l'innocente de l'indifférente ; quand elle cherche à convaincre Perdican qu'elle fait bien de retourner au couvent, c'est en réalité elle-même qu'elle cherche à convaincre et les mots pour Camille sont un poignard contre Perdican alors que de façon paradoxale elle réclame la sincérité et ne parviendra finalement pas à duper Perdican et à masquer que ce dernier ne lui est pas indifférent.<\/p>\n<p data-pi=\"3\">C'est avec la double énonciation que Musset va montrer la perversion du langage. Les multiples destinataires qui pourtant entendent les mêmes mots, n'en perçoivent pas le même message. Lorsque c'est Camille qui est cachée, Perdican s’en amuse en avouant un amour faux à Rosette. Lorsque c'est Rosette qui est cachée, c'est Perdican qui est victime du stratagème de Camille et qui se voit forcé de lui avouer son amour.<\/p>\n<p data-pi=\"4\">Perdican s'exprime avec la rhétorique qu'il a apprise lors de ses études de droit, Camille s'exprime avec une rhétorique plus liturgique, religieuse apprise au couvent. Mais face à ces rhétoriques l’éloquence du cœur et de la parole sincère est celle qui sort de la bouche de Rosette : « Des mots sont des mots et des baisers sont des baisers » (II,3).<\/p>\n<p data-pi=\"5\">Par ailleurs au langage du cœur et de l'esprit s’oppose aussi la logorrhée, ce flux de paroles que Musset utilise pour dénoncer la vacuité des bavardages. Mais il est important de relever que la langue et le phrasé de chaque personnage est aussi révélateur de ce qu'il est, tant dans le vocabulaire que le niveau de langage où les figures utilisées. Par exemple, Blazius utilise un langage très pompeux et pédant lorsqu'il raconte au baron la soi-disant union de Perdican et de Rosette : <em>voilà précisément Le hic Monseigneur hic jacet lepus… voilà ce que je dis et ce qui fait que je n'y comprends rien non plus que vous, révérence parler.<\/em> De la même manière l'abondance de structures négatives qui domine le discours de Camille symbolise son entêtement dans le refus, son obstination et sa fierté : <em>je ne vous aime pas moi je n'ai pas été chercher par dépit cette malheureuse enfant au fond de sa chaumière je n'ai pas répété imprudemment devant elle des paroles brûlante cassée à une autre je n'ai pas faim de jeter au vent pour elle le souvenir d'une amitié chérie je ne lui ai pas mis ma chaîne au cou je ne lui ai pas dit que je l'épouserais.<\/em><\/p>\n<p data-pi=\"6\">La logorrhée est placée dans les discours des fantoches dans des scènes comiques et vides de sens. Blazius et Bridaine parodient la langue tragique dans l'acte III scène 2 en abusant d'un langage soutenu, du champ lexical de la fatalité et de questions rhétoriques dans un discours et un échange qui se caractérisent par leur vacuité : <em>que font-ils maintenant ? hélas voilà midi - ils sont à table que mangent-ils que ne mangent-ils pas ?….<\/em><\/p>\n<h2 data-pi=\"7\" id=\"s2\">L’orgueil<\/h2>\n<p data-pi=\"8\">Camille et Perdican font preuve d'un orgueil démesuré et chacune de leur rencontre est l'occasion d’un affrontement. Camille apparaît comme un personnage froid mais c'est un masque derrière lequel elle se protège. Elle fait preuve d'une croyance spirituelle sincère ce qui explique sa peur lorsque ses propres sentiments amoureux pour Perdican s’imposent à elle. La rigidité de l'éducation qu'elle a reçue au couvent et l'expérience malheureuse de Louise explique sa vision de la relation homme / femme et c'est pourquoi elle voit dans la religion et dans la foi une alternative possible à l'amour.<\/p>\n<p data-pi=\"9\">Perdican lui apparaît instruit et cultivé, p pragmatique et malgré le détachement qu'il affiche par orgueil c'est un personnage très sensible. Pour lui, la passion amoureuse permet à l'homme de se réaliser, elle est indispensable à une vie et en ce sens il est le porte-parole de Musset qui a donc écrit la pièce après sa rupture avec George Sand. Perdican parvient à dissimuler sa sensibilité sous le masque de l'indifférence et de la tromperie.<\/p>\n<p data-pi=\"10\">Le mensonge est inhérent, récurrent et fait partie du jeu des sentiments. Que ce soit Perdican ou Camille. Camille par exemple demande à Perdican s'il est sûr de savoir le degré de mensonge féminin lorsqu'elle lui dit : « êtes-vous sûr que tout mente dans une femme lorsque sa langue ment ? ». Les personnages se mentent les uns aux autres mais se mentent aussi à eux-mêmes. Mais la pièce est aussi un jeu de manipulation et de pouvoir. Il s'agit par la parole de faire plier son adversaire de le contraindre à accepter ses sentiments. C'est un jeu de pouvoir qui vise à assoir sa domination sur l'autre tout en affirmant son droit à l'indépendance et donc il s'agit d'échapper à la condition que la société s'attend que l'on épouse. Donc chaque personnage cherche affermir sa liberté et aussi bien Camille que Perdican sont pris au piège de leur condition dans une société qui les étouffe et ne leur permet pas d'exprimer leur individualité. Le mariage est une transaction commerciale : le refuser c'est repousser cette emprise de la société<\/p>\n<h2 data-pi=\"11\" id=\"s3\">Exposés à venir (déjà distribués)<\/h2>\n<h2 data-pi=\"12\" id=\"s4\">Le jeu (au théâtre, mais il écrit seulement pour être lu), mais jeu aussi au sens de stratagème<\/h2>\n<h2 data-pi=\"13\" id=\"s5\">Analyse des mots clés : cœur et parole<\/h2>\n<h2 data-pi=\"14\" id=\"s6\">Quand la parole exprime le cœur<\/h2>\n<p data-pi=\"15\">J’étais dans la maison ?<\/p>\n<p data-pi=\"16\">Shakespeare roméo et juliette<\/p>\n<h2 data-pi=\"17\" id=\"s7\">Quand la parole cache le cœur<\/h2>\n<p data-pi=\"18\">Le jeu de l’amour et du hasard<\/p>\n<h2 data-pi=\"19\" id=\"s8\">Quand la parole est manipulatrice<\/h2>\n<p data-pi=\"20\">Liaisons dangereuses<\/p>\n<p data-pi=\"21\">Les fausses confidences<\/p>\n<h2 data-pi=\"22\" id=\"s9\">Deux exemples de parcours<\/h2>\n<p data-pi=\"23\">La révélation des mots aux maux<\/p>\n<p data-pi=\"24\">Le stratagème ou l’épreuve de la réalité<\/p>\n", "idx": ["La parole", "Les mots dont on a pu voir qu'ils pouvaient être source de drôlerie sont aussi de véritables moteurs de l'action. Ils doivent être mis en lien avec le parcours « les jeux du cœur et de la parole ». Cette parole aura dans la pièce une valeur maïeutique c'est à dire qu’elle cherche à faire sortir la vérité, à faire dévoiler les secrets aussi bien aux yeux de tous mais aussi aux yeux du personnage souvent dans un déni à la fois protecteur et rassurant. La tension dramatique va souvent osciller entre protection et exposition, avec les outils tantôt du silence tantôt des aveux, tantôt de l'explicite tantôt de l'implicite, tantôt du dit et tantôt du non-dit. Quant aux fantoches on notera par rapport à leurs mots qu'ils ne sont pas capables d'engager de véritables dialogues entre eux et que ce qu'ils disent n'a aucune écoute, aucun impact sur les jeunes gens. Mais par leur intermédiaire Musset nous montre que la parole est manipulation ; Ainsi Blazius et Bridaine s'écoutent beaucoup parler et se satisfont des effets qu’ils pensent être en mesure d'entraîner. Toutefois ces effets sont manqués et en se dénonçant l'un l'autre auprès du baron, ils ne font que décrédibiliser leur parole.", "Le proverbe initial pourrait aussi bien être « on ne badine pas avec les mots » car Musset nous montre qu'ils sont une arme et qu'ils peuvent être destructeurs. Ce sont les mots qui tuent Rosette : les mots auxquels elle a voulu croire et les mots qui lui sont révélés dans la supercherie. Pour Camille et de façon paradoxale, les mots sont un masque derrière lequel elle se protège, masque qui lui permet de s'habiller des costumes tantôt de la prude, de la coquette, de l'innocente de l'indifférente ; quand elle cherche à convaincre Perdican qu'elle fait bien de retourner au couvent, c'est en réalité elle-même qu'elle cherche à convaincre et les mots pour Camille sont un poignard contre Perdican alors que de façon paradoxale elle réclame la sincérité et ne parviendra finalement pas à duper Perdican et à masquer que ce dernier ne lui est pas indifférent.", "C'est avec la double énonciation que Musset va montrer la perversion du langage. Les multiples destinataires qui pourtant entendent les mêmes mots, n'en perçoivent pas le même message. Lorsque c'est Camille qui est cachée, Perdican s’en amuse en avouant un amour faux à Rosette. Lorsque c'est Rosette qui est cachée, c'est Perdican qui est victime du stratagème de Camille et qui se voit forcé de lui avouer son amour.", "Perdican s'exprime avec la rhétorique qu'il a apprise lors de ses études de droit, Camille s'exprime avec une rhétorique plus liturgique, religieuse apprise au couvent. Mais face à ces rhétoriques l’éloquence du cœur et de la parole sincère est celle qui sort de la bouche de Rosette : « Des mots sont des mots et des baisers sont des baisers » (II,3).", "Par ailleurs au langage du cœur et de l'esprit s’oppose aussi la logorrhée, ce flux de paroles que Musset utilise pour dénoncer la vacuité des bavardages. Mais il est important de relever que la langue et le phrasé de chaque personnage est aussi révélateur de ce qu'il est, tant dans le vocabulaire que le niveau de langage où les figures utilisées. Par exemple, Blazius utilise un langage très pompeux et pédant lorsqu'il raconte au baron la soi-disant union de Perdican et de Rosette : voilà précisément Le hic Monseigneur hic jacet lepus… voilà ce que je dis et ce qui fait que je n'y comprends rien non plus que vous, révérence parler. De la même manière l'abondance de structures négatives qui domine le discours de Camille symbolise son entêtement dans le refus, son obstination et sa fierté : je ne vous aime pas moi je n'ai pas été chercher par dépit cette malheureuse enfant au fond de sa chaumière je n'ai pas répété imprudemment devant elle des paroles brûlante cassée à une autre je n'ai pas faim de jeter au vent pour elle le souvenir d'une amitié chérie je ne lui ai pas mis ma chaîne au cou je ne lui ai pas dit que je l'épouserais.", "La logorrhée est placée dans les discours des fantoches dans des scènes comiques et vides de sens. Blazius et Bridaine parodient la langue tragique dans l'acte III scène 2 en abusant d'un langage soutenu, du champ lexical de la fatalité et de questions rhétoriques dans un discours et un échange qui se caractérisent par leur vacuité : que font-ils maintenant ? hélas voilà midi - ils sont à table que mangent-ils que ne mangent-ils pas ?….", "L’orgueil", "Camille et Perdican font preuve d'un orgueil démesuré et chacune de leur rencontre est l'occasion d’un affrontement. Camille apparaît comme un personnage froid mais c'est un masque derrière lequel elle se protège. Elle fait preuve d'une croyance spirituelle sincère ce qui explique sa peur lorsque ses propres sentiments amoureux pour Perdican s’imposent à elle. La rigidité de l'éducation qu'elle a reçue au couvent et l'expérience malheureuse de Louise explique sa vision de la relation homme / femme et c'est pourquoi elle voit dans la religion et dans la foi une alternative possible à l'amour.", "Perdican lui apparaît instruit et cultivé, p pragmatique et malgré le détachement qu'il affiche par orgueil c'est un personnage très sensible. Pour lui, la passion amoureuse permet à l'homme de se réaliser, elle est indispensable à une vie et en ce sens il est le porte-parole de Musset qui a donc écrit la pièce après sa rupture avec George Sand. Perdican parvient à dissimuler sa sensibilité sous le masque de l'indifférence et de la tromperie.", "Le mensonge est inhérent, récurrent et fait partie du jeu des sentiments. Que ce soit Perdican ou Camille. Camille par exemple demande à Perdican s'il est sûr de savoir le degré de mensonge féminin lorsqu'elle lui dit : « êtes-vous sûr que tout mente dans une femme lorsque sa langue ment ? ». Les personnages se mentent les uns aux autres mais se mentent aussi à eux-mêmes. Mais la pièce est aussi un jeu de manipulation et de pouvoir. Il s'agit par la parole de faire plier son adversaire de le contraindre à accepter ses sentiments. C'est un jeu de pouvoir qui vise à assoir sa domination sur l'autre tout en affirmant son droit à l'indépendance et donc il s'agit d'échapper à la condition que la société s'attend que l'on épouse. Donc chaque personnage cherche affermir sa liberté et aussi bien Camille que Perdican sont pris au piège de leur condition dans une société qui les étouffe et ne leur permet pas d'exprimer leur individualité. Le mariage est une transaction commerciale : le refuser c'est repousser cette emprise de la société", "Exposés à venir (déjà distribués)", "Le jeu (au théâtre, mais il écrit seulement pour être lu), mais jeu aussi au sens de stratagème", "Analyse des mots clés : cœur et parole", "Quand la parole exprime le cœur", "J’étais dans la maison ?", "Shakespeare roméo et juliette", "Quand la parole cache le cœur", "Le jeu de l’amour et du hasard", "Quand la parole est manipulatrice", "Liaisons dangereuses", "Les fausses confidences", "Deux exemples de parcours", "La révélation des mots aux maux", "Le stratagème ou l’épreuve de la réalité"]}, {"slug": "ll1", "cat": "theatre", "group": "Lectures linéaires", "title": "Camille et Perdican", "sub": "Lecture linéaire n°1 · Acte II, scène 5", "obj": [], "toc": [["s1", "Introduction"], ["s2", "Premier mouvement : réquisitoire contre le couvent"], ["s3", "Deuxième mouvement : la perte de la sincérité de l’enfance"], ["s4", "Troisième mouvement : Un constat amer et effrayant"], ["s5", "Quatrième mouvement : éloge d’un amour imparfait et sublime"], ["s6", "Conclusion"]], "html": "\n<section class=\"extrait\"><p class=\"extrait-label\">Le texte<\/p><p class=\"speaker\" data-pi=\"0\"><strong>Perdican<\/strong><\/p><p data-pi=\"1\">Sais-tu ce que c'est que des nonnes, malheureuse fille ? Elles qui te représentent l'amour des hommes comme un mensonge, savent-elles qu'il y a pis encore, le mensonge de l'amour divin ? Savent-elles que c'est un crime qu'elles font, de venir chuchoter à une vierge des paroles de femme ? Ah ! comme elles t'ont fait la leçon ! Comme j'avais prévu tout cela quand tu t'ès arrêtée devant le portrait de notre vieille tante ! Tu voulais partir sans me serrer la main ; tu ne voulais revoir ni ce bois, ni cette pauvre petite fontaine qui nous regarde tout en larmes ; tu reniais les jours de ton enfance ; et le masque de plâtre que les nonnes t'ont plaqué sur les joues me refusait un baiser de frère ; mais ton cœur a battu ; il a oublié sa leçon, lui qui ne sait pas lire, et tu es revenue t'asseoir sur l'herbe où nous voilà. Eh bien ! Camille, ces femmes ont bien parlé ; elles t'ont mise dans le vrai chemin ; il pourra m'en coûter le bonheur de ma vie ; mais dis-leur cela de ma part : le ciel n'est pas pour elles.<\/p><p class=\"speaker\" data-pi=\"2\"><strong>Camille<\/strong><\/p><p data-pi=\"3\">Ni pour moi, n'est-ce pas ?<\/p><p class=\"speaker\" data-pi=\"4\"><strong>Perdican<\/strong><\/p><p data-pi=\"5\">Adieu, Camille, retourne à ton couvent, et lorsqu'on te fera de ces récits hideux qui t'ont empoisonnée, réponds ce que je vais te dire : Tous les hommes sont menteurs, inconstants, faux, bavards, hypocrites, orgueilleux et lâches, méprisables et sensuels ; toutes les femmes sont perfides, artificieuses, vaniteuses, curieuses et dépravées ; le monde n'est qu'un égout sans fond où les phoques les plus informes rampent et se tordent sur des montagnes de fange ; mais il y a au monde une chose sainte et sublime, c'est l'union de deux de ces êtres si imparfaits et si affreux. On est souvent trompé en amour, souvent blessé et souvent malheureux ; mais on aime, et quand on est sur le bord de sa tombe, on se retourne pour regarder en arrière ; et on se dit : “ J'ai souffert souvent, je me suis trompé quelquefois, mais j'ai aimé. C'est moi qui ai vécu, et non pas un être factice créé par mon orgueil et mon ennui. ”<\/p><p data-pi=\"6\"><em>Il sort.<\/em><\/p><\/section><h2 data-pi=\"7\" id=\"s1\">Introduction<\/h2>\n<p data-pi=\"8\">Alfred de Musset, auteur romantique du XIX° siècle, peinant à trouver des repères dans un monde dans lequel il ne se reconnait pas, décide à la suite de l’échec de sa pièce <cite>La nuit vénitienne<\/cite> de n’écrire plus que pour être lu, délaissant la représentation sur scène. C’est dans ce cadre que parait <cite>On ne badine pas avec l’amour<\/cite> inspiré de sa propre histoire avec George Sand (lorsqu’ils sont à Venise, Musset tombe malade et Sand aura une aventure avec son médecin). Mettant en scène un trio amoureux entre Perdican, Camille et Rosette sa sœur de lait, les jeux de langage dans la pièce vise à ne pas dévoiler ses sentiments mais à forcer l’autre à le faire. Camille refuse au début de la pièce d’embrasser son cousin Perdican, mettant en péril le projet de mariage. Dans l’extrait étudié, souhaitant devenir religieuse pour trouver l’amour éternel, elle convie Perdican qui va réfuter ses arguments et proposer un éloge de l’amour.<\/p>\n<p data-pi=\"9\">Lecture<\/p>\n<p data-pi=\"10\">Nous verrons comment Perdican tente de convaincre Camille de sa conception romantique de l’Amour.<\/p>\n<p data-pi=\"11\">Le texte sera décomposé en quatre mouvements. Le réquisitoire contre le couvent des lignes 1 à 5, la perte de la sincérité de l’enfance des lignes 5 à 12, un constat amer et effrayant des lignes 12 à 18 et l’éloge de l’amour imparfait mais sublime de la ligne 18 à la fin.<\/p>\n<h2 data-pi=\"12\" id=\"s2\">Premier mouvement : réquisitoire contre le couvent<\/h2>\n<p data-pi=\"13\">Sais-tu ce que c'est que des nonnes, malheureuse fille ? Elles qui te représentent l'amour des hommes comme un mensonge, savent-elles qu'il y a pis encore, le mensonge de l'amour divin ? Savent-elles que c'est un crime qu'elles font, de venir chuchoter à une vierge des paroles de femme ? Ah ! comme elles t'ont fait la leçon ! Comme j'avais prévu tout cela quand tu t'ès arrêtée devant le portrait de notre vieille tante !<\/p>\n<p data-pi=\"14\">Le texte débute par trois questions rhétoriques enchaînées, stratagème rhétorique qui rappelle la maîtrise du langage chez Perdican. Le lexique est par ailleurs significatif dans la mesure où dans ces trois questions c’est le verbe « savoir » d’abord adressées à Camille puis aux nonnes. Cela permet d’immiscer le doute dans l’esprit de Camille qui a pensé jusque-là que les paroles des religieuses étaient des vérités. Exemple d’argumentaire habile, Perdican n’accuse pas Camille dans cette réplique, il ne l’attaque pas directement mais va s’en prendre aux nonnes dont va remettre en cause l’honnêteté. Cela étant la première question est véhémente et l’apostrophe « malheureuse fille » méprisante envers Camille. Dans la deuxième question, le portrait des nonnes est extrêmement négatif passant de femmes manipulatrices (elles qui te représentent l’amour des hommes….) à des femmes manipulées (savent-elles….). Ici Perdican laisse s’exprimer son athéisme. Par ailleurs le chiasme entre amour / mensonge et mensonge / amour qui symbolise le cercle d’un enfermement dans lequel elles sont murées. L’immoralité des nonnes se poursuit à la question suivante puisque ces dernières se livrent à un « crime » en se montrant perfides de venir « chuchoter » à l’oreille de Camille et de lui transmettre leurs souffrances en la poussant vers la peur. Camille est pure « vierge » alors que les nonnes sont appelées « femmes » qui par opposition ont donc déjà vécu, ce qui tend à détruire l’image traditionnelle de la pureté des nonnes et des couvents. Suivent alors deux exclamations. La première montre le résultat devant lequel Perdican est comme sidéré, résultat qui tient à l’influence qu’elles ont eu sur Camille qu’il considère donc comme une victime ici. La deuxième exclamation traduit sa déception et son amertume lorsque Camille a pris sa décision en s’arrêtant devant le portrait de « notre vieille tante », vieille tante qui symbolise l’austérité et dont la vue a convaincu Camille de sa décision.<\/p>\n<h2 data-pi=\"15\" id=\"s3\">Deuxième mouvement : la perte de la sincérité de l’enfance<\/h2>\n<p data-pi=\"16\">Tu voulais partir sans me serrer la main ; tu ne voulais revoir ni ce bois, ni cette pauvre petite fontaine qui nous regarde tout en larmes ; tu reniais les jours de ton enfance ; et le masque de plâtre que les nonnes t'ont plaqué sur les joues me refusait un baiser de frère ; mais ton cœur a battu ; il a oublié sa leçon, lui qui ne sait pas lire, et tu es revenue t'asseoir sur l'herbe où nous voilà. Eh bien ! Camille, ces femmes ont bien parlé ; elles t'ont mise dans le vrai chemin ; il pourra m'en coûter le bonheur de ma vie ; mais dis-leur cela de ma part : le ciel n'est pas pour elles.<\/p>\n<p data-pi=\"17\">Camille : Ni pour moi, n'est-ce pas ?<\/p>\n<p data-pi=\"18\">Dès le début de ce deuxième mouvement, Perdican accuse directement Camille avec trois propositions dont Camille est le sujet (deux courtes insérant une troisième plus longue). Il rappelle les intentions de Camille (répétition du verbe « vouloir ») et rappel dans la proposition centrale du cadre naturel et bucolique. L’évocation de la nature est à la fois un rappel de l’enfance car c’est le cadre de leur histoire, c’est le lieu de leur bonheur sincère et vrai. Avec cette référence à la nature c’est donc aussi des sentiments naturels que Camille « renie » et la personnification de la fontaine traduit l’affection qu’ils ont pour ce lieu ; dès lors le renier est un véritable sacrilège. Perdican montre à Camille qu’il ne croit pas à son manège et que son refus ne correspond pas à ses sentiments véritables. Ainsi elle lui refuse un baiser de frère ce qui convoque à nouveau l’enfance et sa sincérité, sa vérité. Pour Perdican, elle n’est pas elle-même, elle porte un masque de plâtre, symbole là encore du mensonge des nonnes hypocrites. La couleur du masque (plâtre : blanc) rappelant par ailleurs la mort et la froideur. Camille dans le discours de Perdican est sincère dans ses actes car à l’opposé du masque (conjonction d’opposition : mais), Camille est revenu s’assoir sur les lieux de leur enfance parce que son cœur a battu ce qui signifie que ses sentiments sont plus forts au fond que les discours et les mensonges des religieuses. L’interjection « eh bien » annonce l’introduction de l’ironie dans le ton de Perdican, ironie accentuée par les termes « vrai » et « bien » dans les antiphrases qui suivent (t’ont bien parlé / t’ont mise dans le vrai chemin). Perdican est amer et méprise ces nonnes « ces » femmes. Il sait qu’il ne reverra sans doute jamais Camille, il pourra m’en coûter le bonheur de ma vie. L’emploi de l’hyperbole permet à Perdican de se montrer sincère quant à ses sentiments « le bonheur de ma vie ». La conjonction d’opposition « mais » lui permet de revenir aux nonnes et de rappeler leur erreur et leur crime face auquel Perdican annonce comme une sanction « Le ciel n’est pas pour elles » et Perdican est blessé et veut lancer cette sentence à leur visage « dis leur cela de ma part ». Camille l’a pris aussi pour elle, elle est piquée dans son orgueil et sa question sonne à la fois comme une confirmation que comme un espoir qu’elle fasse exception.<\/p>\n<h2 data-pi=\"19\" id=\"s4\">Troisième mouvement : Un constat amer et effrayant<\/h2>\n<p data-pi=\"20\">Perdican<\/p>\n<p data-pi=\"21\">Adieu, Camille, retourne à ton couvent, et lorsqu'on te fera de ces récits hideux qui t'ont empoisonnée, réponds ce que je vais te dire : Tous les hommes sont menteurs, inconstants, faux, bavards, hypocrites, orgueilleux et lâches, méprisables et sensuels ; toutes les femmes sont perfides, artificieuses, vaniteuses, curieuses et dépravées ; le monde n'est qu'un égout sans fond où les phoques les plus informes rampent et se tordent sur des montagnes de fange <\/p>\n<p data-pi=\"22\">Dès le début de ce mouvement et en réponse à la question de Camille, Perdican répond de façon autoritaire et sans appel avec l’emploi notamment de l’impératif « retourne ». Il y a une agressivité dans son propos et il congédie Camille faisant sentir que sa réplique n’attendra pas de réponse (ce qui sera confirmé à la fin du mouvement par la didascalie : il sort). Il va alors tout faire pour continuer de piquer Camille dans son orgueil et l’aspect théâtral de sa réplique est primordial. Il poursuit la dépréciation des discours des nonnes, qualifiés ici de « hideux » et dont l’effet néfaste est mis en emphase par le verbe empoisonner mais il va rappeler à Camille qu’en répétant ses discours, elle n’est qu’une marionnette : car, puisqu’elle est une marionnette qui répète les discours, il lui enjoint alors de répéter, en réponse aux nonnes celui qu’il va li servir et qui débute par un constat amer de la nature de l’homme et de la femme. Le début de ce récit semble au surplus aller dans le sens du discours de Camille en ce qu’il dresse un portrait peu élogieux des hommes dont aucun n’échappe à la règle (tous) ; ainsi une série d’adjectifs péjoratifs qui reprennent les travers moraux du discours de Camille. Dès lors, les hommes sont à l’image que s’en faisait Camille. Mais la juxtaposition de la proposition qui suit, va dresser un portrait aussi peu élogieux des femmes (là encore aucune n’échappe à la règle (toutes) et c’est donc un tableau bien sombre de la nature humaine qui est ici dépeint. Les métaphores qui suivent accentuent cette amertume et ce tableau bien négatif. La métaphore hyperbolique de l’égout sans fond est mise en emphase par la négation restrictive. Ici l’odorat est sollicité car les égouts et la fange rappelle la puanteur. L’hyperbole des phoques les plus difformes (aspect visuel) se tordent et rampent (sens du toucher) et celle des montagnes augmentent encore le pessimisme de ce portrait de la nature humaine, effrayante comme les nonnes le font croire.<\/p>\n<h2 data-pi=\"23\" id=\"s5\">Quatrième mouvement : éloge d’un amour imparfait et sublime<\/h2>\n<p data-pi=\"24\">…mais il y a au monde une chose sainte et sublime, c'est l'union de deux de ces êtres si imparfaits et si affreux. On est souvent trompé en amour, souvent blessé et souvent malheureux ; mais on aime, et quand on est sur le bord de sa tombe, on se retourne pour regarder en arrière ; et on se dit : “ J'ai souffert souvent, je me suis trompé quelquefois, mais j'ai aimé. C'est moi qui ai vécu, et non pas un être factice créé par mon orgueil et mon ennui. ”<\/p>\n<p data-pi=\"25\">Dans cette réplique, Perdican après avoir rappelé les imperfections humaines va donner sa vision de l’amour. Ainsi, par la conjonction d’opposition « mais » il introduit une analyse plus générale. On a vu au mouvement précédent qu’il parlait de tous les hommes et de toutes les femmes. Ici, la thèse avancée dépasse le cadre de la relation des deux personnages. Cela sonne même comme une maxime à l’intérieur de laquelle les adjectifs s’opposent. Les êtres imparfaits et affreux (sur lesquels l’insistance se fait par les adverbes d’intensité « si »), par leur union vont créer une chose sainte et sublime. C’est justement parce que l’amour humain est imparfait, incertain, éphémère, source de souffrance qu’il est aussi noble et puissant en opposition à l’amour divin présenté par les nonnes comme parfait. L’emploi du pronom indéfini « on » offre la vision d’une expérience vécue et partagée par tous. A ce titre quand Perdican va revenir au « je », il ne parle toujours pas de son cas personnel, mais ce pronom a une valeur collective. L’expérience est donc universelle et l’imperfection de cet amour est donc une certitude tirée de l’expérience collective. Les adverbes de fréquence en témoignent (souvent, quelquefois). Mais la souffrance et l’erreur s’effacent devant le fait d’aimer (conjonction d’opposition « mais »). Et aimer est donc comparé au fait de vivre, sincèrement, pleinement en étant fidèle à soi-même. Vision élogieuse d’un amour noble et beau, justement parce qu’imparfait.<\/p>\n<h2 data-pi=\"26\" id=\"s6\">Conclusion<\/h2>\n<p data-pi=\"27\">Cette scène est l’occasion pour Alfred de Musset de verser sa propre vision de l’amour. Au-delà du pouvoir des mots, ici prononcés pour piquer l’orgueil de Camille, Musset puise dans sa vie personnelle la matière de sa pièce, reprenant mot pour mot une lettre que George Sand lui a adressée le 12 mai 1834.<\/p>\n<p data-pi=\"28\"><em>Pour information, voilà l’extrait de la lettre de George Sand du 12 mai 1834<\/em><\/p>\n<p data-pi=\"29\"><em>Mais ton cœur, ton bon cœur, ne le tue pas, je t’en prie ! Qu’il se mette tout entier ou en partie dans toutes les amours de ta vie, mais qu’il y joue toujours son rôle noble, afin qu’un jour tu puisses regarder en arrière et dire comme moi : j’ai souffert souvent, je me suis trompé quelques fois, mais j’ai aimé. C’est moi qui ai vécu et non pas un être factice créé par mon orgueil et mon ennui.<\/em><\/p>\n", "idx": ["Perdican", "Sais-tu ce que c'est que des nonnes, malheureuse fille ? Elles qui te représentent l'amour des hommes comme un mensonge, savent-elles qu'il y a pis encore, le mensonge de l'amour divin ? Savent-elles que c'est un crime qu'elles font, de venir chuchoter à une vierge des paroles de femme ? Ah ! comme elles t'ont fait la leçon ! Comme j'avais prévu tout cela quand tu t'ès arrêtée devant le portrait de notre vieille tante ! Tu voulais partir sans me serrer la main ; tu ne voulais revoir ni ce bois, ni cette pauvre petite fontaine qui nous regarde tout en larmes ; tu reniais les jours de ton enfance ; et le masque de plâtre que les nonnes t'ont plaqué sur les joues me refusait un baiser de frère ; mais ton cœur a battu ; il a oublié sa leçon, lui qui ne sait pas lire, et tu es revenue t'asseoir sur l'herbe où nous voilà. Eh bien ! Camille, ces femmes ont bien parlé ; elles t'ont mise dans le vrai chemin ; il pourra m'en coûter le bonheur de ma vie ; mais dis-leur cela de ma part : le ciel n'est pas pour elles.", "Camille", "Ni pour moi, n'est-ce pas ?", "Perdican", "Adieu, Camille, retourne à ton couvent, et lorsqu'on te fera de ces récits hideux qui t'ont empoisonnée, réponds ce que je vais te dire : Tous les hommes sont menteurs, inconstants, faux, bavards, hypocrites, orgueilleux et lâches, méprisables et sensuels ; toutes les femmes sont perfides, artificieuses, vaniteuses, curieuses et dépravées ; le monde n'est qu'un égout sans fond où les phoques les plus informes rampent et se tordent sur des montagnes de fange ; mais il y a au monde une chose sainte et sublime, c'est l'union de deux de ces êtres si imparfaits et si affreux. On est souvent trompé en amour, souvent blessé et souvent malheureux ; mais on aime, et quand on est sur le bord de sa tombe, on se retourne pour regarder en arrière ; et on se dit : “ J'ai souffert souvent, je me suis trompé quelquefois, mais j'ai aimé. C'est moi qui ai vécu, et non pas un être factice créé par mon orgueil et mon ennui. ”", "Il sort.", "Introduction", "Alfred de Musset, auteur romantique du XIX° siècle, peinant à trouver des repères dans un monde dans lequel il ne se reconnait pas, décide à la suite de l’échec de sa pièce La nuit vénitienne de n’écrire plus que pour être lu, délaissant la représentation sur scène. C’est dans ce cadre que parait On ne badine pas avec l’amour inspiré de sa propre histoire avec George Sand (lorsqu’ils sont à Venise, Musset tombe malade et Sand aura une aventure avec son médecin). Mettant en scène un trio amoureux entre Perdican, Camille et Rosette sa sœur de lait, les jeux de langage dans la pièce vise à ne pas dévoiler ses sentiments mais à forcer l’autre à le faire. Camille refuse au début de la pièce d’embrasser son cousin Perdican, mettant en péril le projet de mariage. Dans l’extrait étudié, souhaitant devenir religieuse pour trouver l’amour éternel, elle convie Perdican qui va réfuter ses arguments et proposer un éloge de l’amour.", "Lecture", "Nous verrons comment Perdican tente de convaincre Camille de sa conception romantique de l’Amour.", "Le texte sera décomposé en quatre mouvements. Le réquisitoire contre le couvent des lignes 1 à 5, la perte de la sincérité de l’enfance des lignes 5 à 12, un constat amer et effrayant des lignes 12 à 18 et l’éloge de l’amour imparfait mais sublime de la ligne 18 à la fin.", "Premier mouvement : réquisitoire contre le couvent", "Sais-tu ce que c'est que des nonnes, malheureuse fille ? Elles qui te représentent l'amour des hommes comme un mensonge, savent-elles qu'il y a pis encore, le mensonge de l'amour divin ? Savent-elles que c'est un crime qu'elles font, de venir chuchoter à une vierge des paroles de femme ? Ah ! comme elles t'ont fait la leçon ! Comme j'avais prévu tout cela quand tu t'ès arrêtée devant le portrait de notre vieille tante !", "Le texte débute par trois questions rhétoriques enchaînées, stratagème rhétorique qui rappelle la maîtrise du langage chez Perdican. Le lexique est par ailleurs significatif dans la mesure où dans ces trois questions c’est le verbe « savoir » d’abord adressées à Camille puis aux nonnes. Cela permet d’immiscer le doute dans l’esprit de Camille qui a pensé jusque-là que les paroles des religieuses étaient des vérités. Exemple d’argumentaire habile, Perdican n’accuse pas Camille dans cette réplique, il ne l’attaque pas directement mais va s’en prendre aux nonnes dont va remettre en cause l’honnêteté. Cela étant la première question est véhémente et l’apostrophe « malheureuse fille » méprisante envers Camille. Dans la deuxième question, le portrait des nonnes est extrêmement négatif passant de femmes manipulatrices (elles qui te représentent l’amour des hommes….) à des femmes manipulées (savent-elles….). Ici Perdican laisse s’exprimer son athéisme. Par ailleurs le chiasme entre amour / mensonge et mensonge / amour qui symbolise le cercle d’un enfermement dans lequel elles sont murées. L’immoralité des nonnes se poursuit à la question suivante puisque ces dernières se livrent à un « crime » en se montrant perfides de venir « chuchoter » à l’oreille de Camille et de lui transmettre leurs souffrances en la poussant vers la peur. Camille est pure « vierge » alors que les nonnes sont appelées « femmes » qui par opposition ont donc déjà vécu, ce qui tend à détruire l’image traditionnelle de la pureté des nonnes et des couvents. Suivent alors deux exclamations. La première montre le résultat devant lequel Perdican est comme sidéré, résultat qui tient à l’influence qu’elles ont eu sur Camille qu’il considère donc comme une victime ici. La deuxième exclamation traduit sa déception et son amertume lorsque Camille a pris sa décision en s’arrêtant devant le portrait de « notre vieille tante », vieille tante qui symbolise l’austérité et dont la vue a convaincu Camille de sa décision.", "Deuxième mouvement : la perte de la sincérité de l’enfance", "Tu voulais partir sans me serrer la main ; tu ne voulais revoir ni ce bois, ni cette pauvre petite fontaine qui nous regarde tout en larmes ; tu reniais les jours de ton enfance ; et le masque de plâtre que les nonnes t'ont plaqué sur les joues me refusait un baiser de frère ; mais ton cœur a battu ; il a oublié sa leçon, lui qui ne sait pas lire, et tu es revenue t'asseoir sur l'herbe où nous voilà. Eh bien ! Camille, ces femmes ont bien parlé ; elles t'ont mise dans le vrai chemin ; il pourra m'en coûter le bonheur de ma vie ; mais dis-leur cela de ma part : le ciel n'est pas pour elles.", "Camille : Ni pour moi, n'est-ce pas ?", "Dès le début de ce deuxième mouvement, Perdican accuse directement Camille avec trois propositions dont Camille est le sujet (deux courtes insérant une troisième plus longue). Il rappelle les intentions de Camille (répétition du verbe « vouloir ») et rappel dans la proposition centrale du cadre naturel et bucolique. L’évocation de la nature est à la fois un rappel de l’enfance car c’est le cadre de leur histoire, c’est le lieu de leur bonheur sincère et vrai. Avec cette référence à la nature c’est donc aussi des sentiments naturels que Camille « renie » et la personnification de la fontaine traduit l’affection qu’ils ont pour ce lieu ; dès lors le renier est un véritable sacrilège. Perdican montre à Camille qu’il ne croit pas à son manège et que son refus ne correspond pas à ses sentiments véritables. Ainsi elle lui refuse un baiser de frère ce qui convoque à nouveau l’enfance et sa sincérité, sa vérité. Pour Perdican, elle n’est pas elle-même, elle porte un masque de plâtre, symbole là encore du mensonge des nonnes hypocrites. La couleur du masque (plâtre : blanc) rappelant par ailleurs la mort et la froideur. Camille dans le discours de Perdican est sincère dans ses actes car à l’opposé du masque (conjonction d’opposition : mais), Camille est revenu s’assoir sur les lieux de leur enfance parce que son cœur a battu ce qui signifie que ses sentiments sont plus forts au fond que les discours et les mensonges des religieuses. L’interjection « eh bien » annonce l’introduction de l’ironie dans le ton de Perdican, ironie accentuée par les termes « vrai » et « bien » dans les antiphrases qui suivent (t’ont bien parlé / t’ont mise dans le vrai chemin). Perdican est amer et méprise ces nonnes « ces » femmes. Il sait qu’il ne reverra sans doute jamais Camille, il pourra m’en coûter le bonheur de ma vie. L’emploi de l’hyperbole permet à Perdican de se montrer sincère quant à ses sentiments « le bonheur de ma vie ». La conjonction d’opposition « mais » lui permet de revenir aux nonnes et de rappeler leur erreur et leur crime face auquel Perdican annonce comme une sanction « Le ciel n’est pas pour elles » et Perdican est blessé et veut lancer cette sentence à leur visage « dis leur cela de ma part ». Camille l’a pris aussi pour elle, elle est piquée dans son orgueil et sa question sonne à la fois comme une confirmation que comme un espoir qu’elle fasse exception.", "Troisième mouvement : Un constat amer et effrayant", "Perdican", "Adieu, Camille, retourne à ton couvent, et lorsqu'on te fera de ces récits hideux qui t'ont empoisonnée, réponds ce que je vais te dire : Tous les hommes sont menteurs, inconstants, faux, bavards, hypocrites, orgueilleux et lâches, méprisables et sensuels ; toutes les femmes sont perfides, artificieuses, vaniteuses, curieuses et dépravées ; le monde n'est qu'un égout sans fond où les phoques les plus informes rampent et se tordent sur des montagnes de fange", "Dès le début de ce mouvement et en réponse à la question de Camille, Perdican répond de façon autoritaire et sans appel avec l’emploi notamment de l’impératif « retourne ». Il y a une agressivité dans son propos et il congédie Camille faisant sentir que sa réplique n’attendra pas de réponse (ce qui sera confirmé à la fin du mouvement par la didascalie : il sort). Il va alors tout faire pour continuer de piquer Camille dans son orgueil et l’aspect théâtral de sa réplique est primordial. Il poursuit la dépréciation des discours des nonnes, qualifiés ici de « hideux » et dont l’effet néfaste est mis en emphase par le verbe empoisonner mais il va rappeler à Camille qu’en répétant ses discours, elle n’est qu’une marionnette : car, puisqu’elle est une marionnette qui répète les discours, il lui enjoint alors de répéter, en réponse aux nonnes celui qu’il va li servir et qui débute par un constat amer de la nature de l’homme et de la femme. Le début de ce récit semble au surplus aller dans le sens du discours de Camille en ce qu’il dresse un portrait peu élogieux des hommes dont aucun n’échappe à la règle (tous) ; ainsi une série d’adjectifs péjoratifs qui reprennent les travers moraux du discours de Camille. Dès lors, les hommes sont à l’image que s’en faisait Camille. Mais la juxtaposition de la proposition qui suit, va dresser un portrait aussi peu élogieux des femmes (là encore aucune n’échappe à la règle (toutes) et c’est donc un tableau bien sombre de la nature humaine qui est ici dépeint. Les métaphores qui suivent accentuent cette amertume et ce tableau bien négatif. La métaphore hyperbolique de l’égout sans fond est mise en emphase par la négation restrictive. Ici l’odorat est sollicité car les égouts et la fange rappelle la puanteur. L’hyperbole des phoques les plus difformes (aspect visuel) se tordent et rampent (sens du toucher) et celle des montagnes augmentent encore le pessimisme de ce portrait de la nature humaine, effrayante comme les nonnes le font croire.", "Quatrième mouvement : éloge d’un amour imparfait et sublime", "…mais il y a au monde une chose sainte et sublime, c'est l'union de deux de ces êtres si imparfaits et si affreux. On est souvent trompé en amour, souvent blessé et souvent malheureux ; mais on aime, et quand on est sur le bord de sa tombe, on se retourne pour regarder en arrière ; et on se dit : “ J'ai souffert souvent, je me suis trompé quelquefois, mais j'ai aimé. C'est moi qui ai vécu, et non pas un être factice créé par mon orgueil et mon ennui. ”", "Dans cette réplique, Perdican après avoir rappelé les imperfections humaines va donner sa vision de l’amour. Ainsi, par la conjonction d’opposition « mais » il introduit une analyse plus générale. On a vu au mouvement précédent qu’il parlait de tous les hommes et de toutes les femmes. Ici, la thèse avancée dépasse le cadre de la relation des deux personnages. Cela sonne même comme une maxime à l’intérieur de laquelle les adjectifs s’opposent. Les êtres imparfaits et affreux (sur lesquels l’insistance se fait par les adverbes d’intensité « si »), par leur union vont créer une chose sainte et sublime. C’est justement parce que l’amour humain est imparfait, incertain, éphémère, source de souffrance qu’il est aussi noble et puissant en opposition à l’amour divin présenté par les nonnes comme parfait. L’emploi du pronom indéfini « on » offre la vision d’une expérience vécue et partagée par tous. A ce titre quand Perdican va revenir au « je », il ne parle toujours pas de son cas personnel, mais ce pronom a une valeur collective. L’expérience est donc universelle et l’imperfection de cet amour est donc une certitude tirée de l’expérience collective. Les adverbes de fréquence en témoignent (souvent, quelquefois). Mais la souffrance et l’erreur s’effacent devant le fait d’aimer (conjonction d’opposition « mais »). Et aimer est donc comparé au fait de vivre, sincèrement, pleinement en étant fidèle à soi-même. Vision élogieuse d’un amour noble et beau, justement parce qu’imparfait.", "Conclusion", "Cette scène est l’occasion pour Alfred de Musset de verser sa propre vision de l’amour. Au-delà du pouvoir des mots, ici prononcés pour piquer l’orgueil de Camille, Musset puise dans sa vie personnelle la matière de sa pièce, reprenant mot pour mot une lettre que George Sand lui a adressée le 12 mai 1834.", "Pour information, voilà l’extrait de la lettre de George Sand du 12 mai 1834", "Mais ton cœur, ton bon cœur, ne le tue pas, je t’en prie ! Qu’il se mette tout entier ou en partie dans toutes les amours de ta vie, mais qu’il y joue toujours son rôle noble, afin qu’un jour tu puisses regarder en arrière et dire comme moi : j’ai souffert souvent, je me suis trompé quelques fois, mais j’ai aimé. C’est moi qui ai vécu et non pas un être factice créé par mon orgueil et mon ennui."]}, {"slug": "ll2", "cat": "theatre", "group": "Lectures linéaires", "title": "« Je t'aime, Rosette ! »", "sub": "Lecture linéaire n°2 · Acte III, scène 3", "obj": [], "toc": [["s1", "Introduction"], ["s2", "Premier mouvement : le cadeau symbolique"], ["s3", "Deuxième mouvement : le jeu théâtral du regard"], ["s4", "Troisième mouvement : la duplicité du discours de Perdican"], ["s5", "Conclusion"]], "html": "\n<section class=\"extrait\"><p class=\"extrait-label\">Le texte<\/p><p data-pi=\"0\"><strong>Perdican<\/strong><em>, à haute voix, de manière que Camille l’entende.<\/em><\/p><p data-pi=\"1\">Je t’aime, Rosette ! toi seule au monde tu n’as rien oublié de nos beaux jours passés ; toi seule tu te souviens de la vie qui n’est plus ; prends ta part de ma vie nouvelle ; donne-moi ton cœur, chère enfant ; voilà le gage de notre amour.<\/p><p data-pi=\"2\"><em>(Il lui pose sa chaîne sur le cou.)<\/em><\/p><p class=\"speaker\" data-pi=\"3\"><strong>Rosette<\/strong><\/p><p data-pi=\"4\">Vous me donnez votre chaîne d’or ?<\/p><p class=\"speaker\" data-pi=\"5\"><strong>Perdican<\/strong><\/p><p data-pi=\"6\">Regarde à présent cette bague. Lève-toi et approchons-nous de cette fontaine. Nous vois-tu tous les deux, dans la source, appuyés l’un sur l’autre ? Vois-tu tes beaux yeux près des miens, ta main dans la mienne ? Regarde tout cela s’effacer. <em>(Il jette sa bague dans l’eau.)<\/em> Regarde comme notre image a disparu ; la voilà qui revient peu à peu ; l’eau qui s’était troublée reprend son équilibre ; elle tremble encore ; de grands cercles noirs courent à sa surface ; patience, nous reparaissons ; déjà je distingue de nouveau tes bras enlacés dans les miens ; encore une minute, et il n’y aura plus une ride sur ton joli visage : regarde ! c’était une bague que m’avait donnée Camille.<\/p><p data-pi=\"7\"><strong>Camille<\/strong><em>, à part.<\/em><\/p><p data-pi=\"8\">Il a jeté ma bague dans l’eau.<\/p><p class=\"speaker\" data-pi=\"9\"><strong>Perdican<\/strong><\/p><p data-pi=\"10\">Sais-tu ce que c’est que l’amour, Rosette ? Écoute ! le vent se tait ; la pluie du matin roule en perles sur les feuilles séchées que le soleil ranime. Par la lumière du ciel, par le soleil que voilà, je t’aime ! Tu veux bien de moi, n’est-ce pas ? On n’a pas flétri ta jeunesse ; on n’a pas infiltré dans ton sang vermeil les restes d’un sang affadi ? Tu ne veux pas te faire religieuse ; te voilà jeune et belle dans les bras d’un jeune homme. Ô Rosette, Rosette ! sais-tu ce que c’est que l’amour ?<\/p><p class=\"speaker\" data-pi=\"11\"><strong>Rosette<\/strong><\/p><p data-pi=\"12\">Hélas ! monsieur le docteur, je vous aimerai comme je pourrai.<\/p><\/section><h2 data-pi=\"13\" id=\"s1\">Introduction<\/h2>\n<p data-pi=\"14\">Alfred de Musset, auteur romantique du XIX° siècle, peinant à trouver des repères dans un monde dans lequel il ne se reconnait pas, décide à la suite de l’échec de sa pièce <cite>La nuit vénitienne<\/cite> de n’écrire plus que pour être lu, délaissant la représentation sur scène. C’est dans ce cadre que parait <cite>On ne badine pas avec l’amour<\/cite> inspiré de sa propre histoire avec George Sand (lorsqu’ils sont à Venise, Musset tombe malade et Sand aura une aventure avec son médecin). Mettant en scène un trio amoureux entre Perdican, Camille et Rosette sa sœur de lait, les jeux de langage dans la pièce vise à ne pas dévoiler ses sentiments mais à forcer l’autre à le faire. Camille refuse au début de la pièce d’embrasser son cousin Perdican, mettant en péril le projet de mariage. Dans l’extrait étudié, après avoir été blessé par une lettre que camille adressait à une maie et disant qu’elle laissait Perdican avec « un poignard dans le cœur », ce dernier décide se venger et de lui montrer qu’il ne l’aime pas. Il organise alors le stratagème de double rendez-vous.<\/p>\n<p data-pi=\"15\">Lecture<\/p>\n<p data-pi=\"16\">Nous verrons comment les mots d’amour destinés à Rosette ont en réalité pour but de blesser Camille.<\/p>\n<p data-pi=\"17\">Le texte sera décomposé en trois mouvements. Le stratège de la déclaration d’amour des lignes 1 à 4, le jeu théâtral du regard des lignes 5 à 13 et enfin la duplicité du discours de Perdican (lignes 14 à la fin).<\/p>\n<h2 data-pi=\"18\" id=\"s2\">Premier mouvement : le cadeau symbolique<\/h2>\n<p data-pi=\"19\"><strong>Perdican<\/strong>, <em>à haute voix, de manière que Camille l’entende.<\/em><\/p>\n<p data-pi=\"20\">Je t’aime, Rosette ! toi seule au monde tu n’as rien oublié de nos beaux jours passés ; toi seule tu te souviens de la vie qui n’est plus ; prends ta part de ma vie nouvelle ; donne-moi ton cœur, chère enfant ; voilà le gage de notre amour.<\/p>\n<p data-pi=\"21\"><em>(Il lui pose sa chaîne sur le cou.)<\/em><\/p>\n<p data-pi=\"22\"><strong>Rosette<\/strong><\/p>\n<p data-pi=\"23\">Vous me donnez votre chaîne d’or ?<\/p>\n<p data-pi=\"24\">Le texte s’ouvre sur une didascalie qui peut sembler inutile (à voix haute) mais qui va rappeler le caractère superficiel de la réplique, un jeu d’acteur exagéré pour être entendue de Camille (proposition circonstancielle de but). Perdican devient le metteur en scène et la mise abyme opère en plaçant Camille dans la position de spectatrice du stratagème. Par ailleurs, Musset ne veut plus que ses pièces soient jouées et il donne au lecteur les clés pour s’imaginer la pièce sur scène. Le topos littéraire de l’amour est abordé sans détour ici, sans précaution. L’exclamative après Rosette montre qu’il parle surtout pour que Camille l’entende. L’anaphore en début de proposition insiste sur cette volonté de rendre Camille jalouse, anaphore renforcée par l’hyperbole « au monde ». La double négation (tu n’as rien oublié) forme la litote qui est reprise à la forme affirmative (tu te souviens). Perdican se sert de la nostalgie et le groupe « nos plus beaux jours » est ambigüe dans la mesure où il évoque aussi le passé de Camille et il traite ce moment de l’enfance comme un souvenir idéalisé. L’échange avec Rosette reste toutefois inégal. D’abord Perdican tutoie Rosette qui, elle, le vouvoie. Il s’adresse souvent à elle avec une certaine autorité avec des injonctives (deux impératifs : prends ta part, donne-moi). S’il emploie beaucoup de déterminants possessifs, il lui demande l’entièreté de son cœur (donne-moi ton cœur chère enfant) alors que lui ne lui offre qu’une part de sa vie (prends ta part de ma vie nouvelle). D’ailleurs il ne lui offre pas une bague ou un collier mais une chaine qui rappelle l’entrave. Avec le présentatif « voilà », on comprend qu’il prend l’initiative de la lui placer autour du cou, ce que confirme la didascalie). La réaction de Rosette et sa question « vous me donnez votre chaîne d’or ? » traduit qu’elle n’a pas eu le temps de réaliser le geste et qu’elle est surprise ; cela peut aussi sous-entendre la question : pourquoi vous me donnez votre chaîne d’or ? Cette réaction inégale entre les personnages révèle Perdican comme dominant l’échange et la relation avec Rosette et donc sa manipulation.<\/p>\n<h2 data-pi=\"25\" id=\"s3\">Deuxième mouvement : le jeu théâtral du regard<\/h2>\n<p data-pi=\"26\"><strong>Perdican<\/strong><\/p>\n<p data-pi=\"27\">Regarde à présent cette bague. Lève-toi et approchons-nous de cette fontaine. Nous vois-tu tous les deux, dans la source, appuyés l’un sur l’autre ? Vois-tu tes beaux yeux près des miens, ta main dans la mienne ? Regarde tout cela s’effacer. <em>(Il jette sa bague dans l’eau.)<\/em> Regarde comme notre image a disparu ; la voilà qui revient peu à peu ; l’eau qui s’était troublée reprend son équilibre ; elle tremble encore ; de grands cercles noirs courent à sa surface ; patience, nous reparaissons ; déjà je distingue de nouveau tes bras enlacés dans les miens ; encore une minute, et il n’y aura plus une ride sur ton joli visage : regarde ! c’était une bague que m’avait donnée Camille.<\/p>\n<p data-pi=\"28\"><strong>Camille<\/strong><em>, à part.<\/em><\/p>\n<p data-pi=\"29\">Il a jeté ma bague dans l’eau.<\/p>\n<p data-pi=\"30\">Perdican se positionne ici comme un véritable metteur en scène. C’est lui qui dirige (présence de nombreux impératifs deuxième personne du singulier et première du pluriel). Par ailleurs il ordonnance les actions (regards et gestes) comme ceux d’acteurs (regarde, lève-toi, approchons-nous). C’est aussi un ordonnancement temporel avec le complément circonstanciel de temps (à présent), la conjonction de coordination « et ». Perdican est aussi responsable du décor et des accessoires et emploie à ce titre les démonstratifs (cette bague, cette fontaine). Il rappelle la présence du couple sur scène (première personne du pluriel et « tous les deux », « appuyés l’un sur l’autre ». Dans le but de rendre Camille jalouse il va insister sur cette présence du couple : tes yeux / les miens, ta main / la mienne (la main rappelant le symbole du mariage). Si Perdican dirige la scène pour Rosette, il le fait aussi pour Camille qui dans cette théâtralisation se positionne comme spectatrice. Le jeu de regard est complexe et omniprésent. La présence du champ lexical du regard (regarde, vois-tu), et les questions rhétoriques (vois-tu…. : Rosette voit forcément la même chose que lui) sont en réalité destinées à Camille qui ne voit pas et ne vit la scène que les mots de Perdican.<\/p>\n<p data-pi=\"31\">Arrive alors le coup de théâtre de la bague jetée. Perdican ne jette la bague qu’après l’avoir annoncé (regarde tout cela s’effacer). Il ménage ainsi ses effets. Il invite alors Rosette à regarder ce qui a disparu (emploi du passé composé : action achevée). Vient ensuite le présent d’énonciation pour suivre (pour que Camille suive) le déroulé de la scène. Il s’agit alors d’attendre la réapparition du tableau de Perdican et de Rosette dans le reflet. Cette attente est encore mise en scène par Perdican qui emploie les préfixes devant les verbes (revient reprend reparaissons), et qui ménage un effet de lenteur. Il invite à la « patience », introduit des compléments circonstanciels et des adverbes temporels (peu à peu, encore, de nouveau, encore une minute). La ponctuation (virgules et points-virgules permettent des pauses dans la lecture de la scène. Cette réapparition peut aussi apparaitre comme une scène prophétique de la fin de la pièce. En effet les cercles noirs évoquent la mort et l’emploi du futur « il n’y aura plus » annonce la jeunesse éternelle de la jeune femme qui mourra un peu plus tard dans la pièce. La réplique se termine par l’aveu de l’origine de la bague et l’imparfait « c’était » sonne différemment selon les destinataires : c’est une déclaration d’amour pour Rosette et une provocation pour Camille. Le plus que parfait rappelle le passé des fiançailles et de l’enfance commune ? par ailleurs Perdican ménage encore ses effets en reculant sur le plan syntaxique le nom de Camille à la fin de la phrase. Camille réagit par une phrase exclamative qui marque son indignation et l’emploi du possessif « ma » traduit que c’était effectivement un cadeau qu’elle lui avait fait. Camille comprend que Perdican a organisé ce rendez-vous par dépit et elle le dira à la scène 6 du même acte : « Il a lu ma lettre, cela est certain ; sa scène du bois est une vengeance, comme son amour pour Rosette ».<\/p>\n<h2 data-pi=\"32\" id=\"s4\">Troisième mouvement : la duplicité du discours de Perdican<\/h2>\n<p data-pi=\"33\"><strong>Perdican<\/strong><\/p>\n<p data-pi=\"34\">Sais-tu ce que c’est que l’amour, Rosette ? Écoute ! le vent se tait ; la pluie du matin roule en perles sur les feuilles séchées que le soleil ranime. Par la lumière du ciel, par le soleil que voilà, je t’aime ! Tu veux bien de moi, n’est-ce pas ? On n’a pas flétri ta jeunesse ; on n’a pas infiltré dans ton sang vermeil les restes d’un sang affadi ? Tu ne veux pas te faire religieuse ; te voilà jeune et belle dans les bras d’un jeune homme. Ô Rosette, Rosette ! sais-tu ce que c’est que l’amour ?<\/p>\n<p data-pi=\"35\"><strong>Rosette<\/strong><\/p>\n<p data-pi=\"36\">Hélas ! monsieur le docteur, je vous aimerai comme je pourrai.<\/p>\n<p data-pi=\"37\">La question qui ouvre ce mouvement et cette réplique est a priori rhétorique dans la mesure ou Rosette est jeune et naïve. Par ailleurs c’est une question fermée à laquelle elle ne pourrait répondre que par oui ou par non sans définir l’amour. Perdican va alors avoir recours à la nature ; n’oublions pas que Rosette est une jeune paysanne proche de la nature. Par ailleurs son prénom évoque le diminutif de la rosée (une petite rosée) que Perdican convoque (la pluie du matin roule en perles…) et l’amour est métaphoriquement comparé au soleil qui ranime. Mais la métaphore est plus complexe que cela car la rosée vient à disparaître (elle sèche). Et il y a trois personnages : l’amour donc le soleil, le vent qui se tait (il écoute et Camille se tait, écoute) et la rosée qui disparait (cette métaphore de l’amour semble donc néfaste pour Rosette). Perdican va ensuite opposer Rosette et Camille ; ainsi, l’assertion « tu veux bien de moi » avec l’insistance du « n’est-ce pas » rappelle le rejet de Camille et sa volonté de se faire religieuse au contraire de Rosette (deux occurrences du verbe vouloir). Il insiste par ailleurs sur la jeunesse de Rosette avec la polyptote (jeune : deux occurrences et jeunesse) pour marquer le fait qu’elle na pas encore été pervertie par le monde et les institutions religieuses dont la critique indirecte va suivre. En effet, l’image du sang affadi infiltré par le pronom personnel « on » qui rappelle les nonnes dont le sang est affadi, suite aux déceptions et désillusions. Le sang vermeil de Rosette rappelle dans l’acte II, scène 5 le discours de Perdican sur les nonnes qui « font sentir à ton sang vermeil la fraîcheur de leurs tombes ». L’épanadiplose de la fin de la réplique (reprise de la même question) n’a ici pas le même sens. Car s’il veut montrer à Camille qui écoute que Rosette sait mieux ce qu’est l’amour. Pourtant ce n’est pas le cas puisque Rosette naïve, ne perçoit pas le mal qu’on peut faire et que Perdican lui fait, par amour.<\/p>\n<h2 data-pi=\"38\" id=\"s5\">Conclusion<\/h2>\n<p data-pi=\"39\">Dans cette scène dans laquelle, par le jeu de la mise en abyme, Perdican se pose en metteur en scène de son stratagème théâtral, jouant ici sur une triple énonciation des mots qui laissent entrevoir la fin tragique de la pièce. Ce jeu de mise en abyme et de présence d’un personnage caché pour assister à une mise en scène, se retrouvera encore dans l’acte III quand Camille demandera à Rosette de se cacher pour assister à son échange avec Perdican. Rosette qui se cachera aussi d’elle-même dans la dernière scène.<\/p>\n", "idx": ["Perdican, à haute voix, de manière que Camille l’entende.", "Je t’aime, Rosette ! toi seule au monde tu n’as rien oublié de nos beaux jours passés ; toi seule tu te souviens de la vie qui n’est plus ; prends ta part de ma vie nouvelle ; donne-moi ton cœur, chère enfant ; voilà le gage de notre amour.", "(Il lui pose sa chaîne sur le cou.)", "Rosette", "Vous me donnez votre chaîne d’or ?", "Perdican", "Regarde à présent cette bague. Lève-toi et approchons-nous de cette fontaine. Nous vois-tu tous les deux, dans la source, appuyés l’un sur l’autre ? Vois-tu tes beaux yeux près des miens, ta main dans la mienne ? Regarde tout cela s’effacer. (Il jette sa bague dans l’eau.) Regarde comme notre image a disparu ; la voilà qui revient peu à peu ; l’eau qui s’était troublée reprend son équilibre ; elle tremble encore ; de grands cercles noirs courent à sa surface ; patience, nous reparaissons ; déjà je distingue de nouveau tes bras enlacés dans les miens ; encore une minute, et il n’y aura plus une ride sur ton joli visage : regarde ! c’était une bague que m’avait donnée Camille.", "Camille, à part.", "Il a jeté ma bague dans l’eau.", "Perdican", "Sais-tu ce que c’est que l’amour, Rosette ? Écou
