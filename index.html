<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Site de français – 1ère 4 – M. Herczeg</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAF7F1; --surface:#FFFFFF; --ink:#221D27; --ink-soft:#5D5563;
  --rouge:#8E1C2C; --rouge-deep:#5C0E1A; --or:#A8822F; --or-ink:#7E5F1C;
  --bleu:#25407F; --line:#E4DCCE; --toile:#2E4C8F; --toile-op:.13;
  --mark:#F6E3A6; --extrait:#F3EEE4;
  --display:"Cormorant Garamond","Cormorant",Garamond,"Times New Roman",serif;
  --text:"Source Serif 4","Source Serif Pro",Georgia,"Times New Roman",serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#15121A; --surface:#1F1B26; --ink:#EEE7DB; --ink-soft:#B5ABB9;
    --rouge:#E57A8B; --rouge-deep:#6E1424; --or:#D6B25E; --or-ink:#D6B25E;
    --bleu:#A6B9F0; --line:#3A3343; --toile:#9FB4EE; --toile-op:.09;
    --mark:#6B5418; --extrait:#1B1821; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#15121A; --surface:#1F1B26; --ink:#EEE7DB; --ink-soft:#B5ABB9;
  --rouge:#E57A8B; --rouge-deep:#6E1424; --or:#D6B25E; --or-ink:#D6B25E;
  --bleu:#A6B9F0; --line:#3A3343; --toile:#9FB4EE; --toile-op:.09;
  --mark:#6B5418; --extrait:#1B1821; color-scheme:dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--text);font-size:17.5px;line-height:1.62;}
img,svg{max-width:100%}
a{color:var(--bleu)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--or);outline-offset:3px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- En-tête ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:10px 16px}
.brand{display:flex;align-items:baseline;gap:8px;text-decoration:none;color:var(--ink);margin-right:auto}
.brand b{font-family:var(--display);font-weight:600;font-style:italic;font-size:1.45rem;letter-spacing:.01em;color:var(--rouge)}
.brand span{font-size:.85rem;color:var(--ink-soft)}
.icon-btn{width:42px;height:42px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;background:var(--surface);cursor:pointer}
.icon-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.theme-moon{display:none}
:root[data-theme="dark"] .theme-moon{display:block}
:root[data-theme="dark"] .theme-sun{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .theme-moon{display:block}:root:not([data-theme="light"]) .theme-sun{display:none}}

/* ---------- Scène (accueil) ---------- */
.stage{position:relative;overflow:hidden;min-height:min(78vh,560px);display:grid;place-items:center;text-align:center;
  background:radial-gradient(ellipse 60% 55% at 50% 42%,#4a2530 0%,#24121a 55%,#120a0e 100%);color:#F4E7C9;isolation:isolate}
.stage::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 34% 48% at 50% 48%,rgba(255,226,170,.22),transparent 70%);z-index:-1}
.curtain{position:absolute;top:0;bottom:0;width:31%;z-index:2;pointer-events:none}
.curtain svg{width:100%;height:100%;display:block}
.curtain.l{left:0}
.curtain.r{right:0;transform:scaleX(-1)}
.valance{position:absolute;left:0;right:0;top:0;height:70px;z-index:3;pointer-events:none}
.valance svg{width:100%;height:100%;display:block}
.boards{position:absolute;left:0;right:0;bottom:0;height:64px;z-index:1;background:
  linear-gradient(to bottom,#3a2218,#1d110c);border-top:2px solid #B08A3A}
.boards::before{content:"";position:absolute;left:0;right:0;top:6px;height:6px;background:radial-gradient(circle,#FFE6A8 0 2.5px,transparent 3.5px) 0 0/34px 6px repeat-x;filter:drop-shadow(0 0 6px #ffcf70);opacity:.9}
.stage-text{position:relative;z-index:4;padding:84px 22% 100px;max-width:900px}
.stage-kicker{font-size:.95rem;color:#E2C98F;margin:0 0 8px}
.crest{display:block;width:74px;height:auto;margin:0 auto 14px;filter:drop-shadow(0 6px 16px rgba(0,0,0,.55))}
.brand{align-items:center}.brand-crest{width:26px;height:auto;align-self:center}
.foot-crest{display:block;width:44px;height:auto;margin:0 auto 12px}
.stage h1{font-family:var(--display);font-style:italic;font-weight:600;font-size:clamp(2.7rem,9.5vw,5.4rem);line-height:.95;margin:0;letter-spacing:-.005em;text-shadow:0 2px 24px rgba(0,0,0,.5)}
.fleuron{display:block;margin:14px auto 12px;width:120px;height:18px;color:#C9A253}
.stage p.lede{margin:0 auto;max-width:30ch;font-size:1.02rem;color:#EADCC0}
@media (max-width:600px){.stage-text{padding:84px 19% 96px}.crest{width:62px}.curtain{width:24%}.stage p.lede{font-size:.95rem}}
@media (prefers-reduced-motion:no-preference){
  .stage.opening .curtain.l{animation:openL 1.6s cubic-bezier(.6,.05,.25,1) both}
  .stage.opening .curtain.r{animation:openR 1.6s cubic-bezier(.6,.05,.25,1) both}
  .stage.opening .stage-text{animation:rise 1.1s .7s ease-out both}
  @keyframes openL{from{transform:translateX(62%)}to{transform:none}}
  @keyframes openR{from{transform:scaleX(-1) translateX(62%)}to{transform:scaleX(-1)}}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
}

/* ---------- Mise en page ---------- */
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}
.searchbar{position:relative;z-index:5;max-width:640px;margin:-28px auto 0;}
.searchbar button{width:100%;display:flex;align-items:center;gap:12px;padding:15px 20px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);box-shadow:0 10px 30px -12px rgba(40,10,20,.35);cursor:pointer;text-align:left;font-size:1rem}
.searchbar svg{width:20px;height:20px;stroke:var(--rouge);fill:none;stroke-width:1.8;flex:none}
section.block{padding:52px 0 8px}
h2.sec{font-family:var(--display);font-weight:600;font-size:2.1rem;line-height:1.1;margin:0 0 6px;color:var(--ink)}
p.sec-sub{margin:0 0 24px;color:var(--ink-soft)}

/* ---------- Toile & billets ---------- */
.toile{position:relative;border-radius:22px;overflow:visible;border:1px solid var(--line);background:var(--surface);padding:26px 18px}
.toile>svg.pattern{position:absolute;inset:0;width:100%;height:100%;clip-path:inset(0 round 22px);color:var(--toile);opacity:var(--toile-op);pointer-events:none}
.tickets{position:relative;display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}
.ticket{position:relative;display:grid;grid-template-columns:1fr auto;background:var(--paper);border:1.5px solid var(--or);border-radius:10px;
  -webkit-mask:radial-gradient(circle 11px at 0 50%,transparent 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 11px at 100% 50%,transparent 98%,#000) right/51% 100% no-repeat;
          mask:radial-gradient(circle 11px at 0 50%,transparent 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 11px at 100% 50%,transparent 98%,#000) right/51% 100% no-repeat}
.ticket .main{padding:18px 18px 16px 24px}
.ticket .what{font-family:var(--display);font-size:1.75rem;font-weight:600;line-height:1;margin:0 0 4px;color:var(--rouge)}
.ticket .when{margin:0 0 10px;font-size:.92rem;color:var(--ink-soft)}
.ticket .left{font-size:.95rem;font-variant-numeric:tabular-nums;line-height:1.35}
.ticket .left b{font-weight:600;white-space:nowrap}
.ticket .stub{border-left:2px dashed var(--or);padding:14px 22px 14px 18px;display:grid;place-items:center;text-align:center;min-width:104px}
.ticket .j{font-family:var(--display);font-weight:700;font-size:2.9rem;line-height:.9;color:var(--ink);font-variant-numeric:lining-nums}
.ticket .jl{font-size:.78rem;color:var(--ink-soft)}

/* ---------- Parcours (accueil) ---------- */
.cats{display:grid;gap:18px;grid-template-columns:repeat(6,1fr)}
.cat{grid-column:span 3;display:grid;grid-template-columns:1fr 110px;gap:10px;align-items:center;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 20px;transition:border-color .2s,transform .2s}
.cat:hover{border-color:var(--or)}
.cat.feat{grid-column:span 6;grid-template-columns:1fr 210px;background:linear-gradient(135deg,#6a1322,#3e0a14);color:#F4E7C9;border-color:#7d2433;padding:28px 26px}
.cat .meta{font-size:.88rem;color:var(--ink-soft);margin:0 0 4px}
.cat.feat .meta{color:#E2C98F}
.cat h3{font-family:var(--display);font-weight:600;font-size:1.85rem;line-height:1.05;margin:0 0 8px}
.cat.feat h3{font-size:clamp(2rem,5vw,2.6rem);font-style:italic}
.cat p.d{margin:0;font-size:.95rem;color:var(--ink-soft)}
.cat.feat p.d{color:#EADCC0}
.cat .count{display:inline-block;margin-top:12px;font-size:.85rem;color:var(--or-ink);border-bottom:1px solid currentColor}
.cat.feat .count{color:#E2C98F}
.cat .ill{width:100%;height:auto;color:var(--rouge)}
.cat.feat .ill{color:#E2C98F}
.later{margin:22px 0 0;color:var(--ink-soft);font-size:.95rem}
.later em{color:var(--ink);font-style:italic}
@media (max-width:700px){.cat,.cat.feat{grid-column:span 6}.cat{grid-template-columns:1fr 84px}.cat.feat{grid-template-columns:1fr 120px;padding:24px 20px}}

/* ---------- Page parcours ---------- */
.banner{background:linear-gradient(135deg,#6a1322,#3a0912);color:#F4E7C9;position:relative;overflow:hidden}
.banner .wrap{display:grid;grid-template-columns:1fr 200px;gap:16px;align-items:center;padding-top:34px;padding-bottom:34px}
.banner .crumb a{color:#E2C98F;text-decoration:none;font-size:.92rem}
.banner h1{font-family:var(--display);font-style:italic;font-weight:600;font-size:clamp(2.3rem,7vw,3.6rem);line-height:1;margin:8px 0 10px}
.banner p{margin:0;color:#EADCC0;max-width:52ch}
.banner .ill{color:#E2C98F;width:100%}
.banner.plain{background:linear-gradient(135deg,#22325f,#141d3b)}
@media (max-width:640px){.banner .wrap{grid-template-columns:1fr 90px}}
.cartouche{margin:-1px 0 0;border:1px solid var(--line);border-top:0;border-radius:0 0 16px 16px;background:var(--surface);padding:16px 20px;display:grid;gap:4px 24px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));font-size:.95rem}
.cartouche div span{display:block;color:var(--ink-soft);font-size:.82rem}
.programme{margin:34px 0 0}
.programme h2{font-family:var(--display);font-weight:600;font-size:1.7rem;margin:0 0 4px;display:flex;align-items:center;gap:12px}
.programme h2::after{content:"";flex:1;height:1px;background:var(--line)}
.programme ul{list-style:none;margin:0 0 10px;padding:0}
.programme li a{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:baseline;padding:14px 4px;border-bottom:1px dotted var(--line);text-decoration:none;color:var(--ink)}
.programme li a:hover .t{color:var(--rouge)}
.programme .n{font-family:var(--display);font-weight:700;font-size:1.25rem;color:var(--or-ink);min-width:2.2ch}
.programme .t{font-family:var(--display);font-weight:600;font-size:1.4rem;line-height:1.15;display:block}
.programme .s{display:block;font-size:.88rem;color:var(--ink-soft)}
.programme .chev{width:18px;height:18px;stroke:var(--ink-soft);fill:none;stroke-width:1.8}

/* ---------- Page de cours ---------- */
.doc-head{padding:30px 0 6px}
.doc-head .crumb{font-size:.92rem}
.doc-head .crumb a{text-decoration:none;color:var(--rouge)}
.doc-head .grp{margin:18px 0 2px;color:var(--or-ink);font-size:.92rem}
.doc-head h1{font-family:var(--display);font-weight:600;font-size:clamp(2.3rem,7vw,3.4rem);line-height:1.02;margin:0 0 6px}
.doc-head .sub{margin:0;color:var(--ink-soft);font-style:italic}
.doc-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:28px;padding-bottom:40px}
@media (min-width:980px){.doc-grid{grid-template-columns:240px minmax(0,1fr)}.toc{position:sticky;top:90px;align-self:start}}
.toc{font-size:.92rem}
.toc details{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:12px 16px}
.toc summary{cursor:pointer;font-family:var(--display);font-weight:600;font-size:1.2rem}
.toc ol{margin:10px 0 2px;padding-left:1.2em}
.toc li{margin:6px 0}
.toc a{text-decoration:none;color:var(--ink-soft)}
.toc a:hover{color:var(--rouge)}
.obj{border:1px solid var(--or);border-radius:14px;padding:14px 18px;margin:0 0 22px;background:var(--surface)}
.obj b{font-family:var(--display);font-size:1.15rem;color:var(--or-ink)}
.obj ul{margin:6px 0 0;padding-left:1.2em}
article.cours{max-width:70ch}
article.cours h2{font-family:var(--display);font-weight:600;font-size:1.75rem;line-height:1.15;color:var(--rouge);margin:2.1em 0 .5em;padding-top:.6em;border-top:1px solid var(--line)}
article.cours h2:first-child{margin-top:0}
article.cours h3{font-family:var(--display);font-style:italic;font-weight:600;font-size:1.35rem;margin:1.6em 0 .3em}
article.cours p{margin:0 0 1em;hyphens:auto;-webkit-hyphens:auto}
article.cours cite{font-style:italic}
.table-wrap{overflow-x:auto;margin:0 0 1.2em;border:1px solid var(--line);border-radius:12px}
.table-wrap table{border-collapse:collapse;width:100%;min-width:420px;font-size:.95rem}
.table-wrap th,.table-wrap td{border-bottom:1px solid var(--line);padding:10px 12px;text-align:left;vertical-align:top}
.table-wrap th{background:var(--extrait);font-weight:600}
.table-wrap td p{margin:0 0 .4em}
.extrait{background:var(--extrait);border-left:3px solid var(--or);border-radius:4px 14px 14px 4px;padding:18px 20px 8px;margin:0 0 2em;font-size:1rem}
.extrait-label{font-family:var(--display);font-style:italic;font-size:1.25rem;color:var(--or-ink);margin:0 0 8px!important}
.extrait h3{margin-top:.2em!important;font-size:1.2rem!important}
.extrait strong{font-variant:small-caps;letter-spacing:.04em;font-weight:600;color:var(--rouge)}
.extrait p.speaker{margin:.9em 0 .1em!important}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.flash{animation:flash 2.4s ease-out}
@keyframes flash{0%,40%{background:color-mix(in srgb,var(--mark) 70%,transparent)}100%{background:transparent}}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:40px}
.pager a{display:block;border:1px solid var(--line);border-radius:14px;padding:12px 16px;text-decoration:none;color:var(--ink);background:var(--surface)}
.pager a span{display:block;font-size:.82rem;color:var(--ink-soft)}
.pager a b{font-family:var(--display);font-size:1.2rem;font-weight:600}
.pager a.next{text-align:right;grid-column:2}

/* ---------- Recherche ---------- */
.search{position:fixed;inset:0;z-index:50;background:var(--paper);display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.search.open{display:flex}
.search-top{display:flex;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);max-width:820px;width:100%;margin:0 auto}
.search-top input{flex:1;min-width:0;font:inherit;font-size:1.05rem;padding:12px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.search-res{overflow-y:auto;flex:1;width:100%;max-width:820px;margin:0 auto;padding:8px 16px 40px}
.search-res .hint{color:var(--ink-soft);padding:18px 4px}
.search-res .hint button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;margin:4px 4px 0 0;cursor:pointer}
.res-doc{margin:20px 0 4px;font-family:var(--display);font-weight:600;font-size:1.3rem;color:var(--rouge)}
.res-doc small{font-family:var(--text);font-size:.8rem;color:var(--ink-soft);font-weight:400;margin-left:6px}
.res{display:block;width:100%;text-align:left;border:0;border-bottom:1px dotted var(--line);background:none;padding:10px 4px;cursor:pointer;font-size:.95rem;color:var(--ink-soft);line-height:1.5}
.res:hover{color:var(--ink)}


/* ---------- Exposés : tableaux blancs ---------- */
.tableaux{--mur:#E9E1D2;--mur2:#DED3BF;display:grid;gap:18px;grid-template-columns:1fr;margin:0 0 2.2em;padding:22px 16px 18px;border-radius:18px;
  background:var(--mur);border:1px solid var(--line)}
:root[data-theme="dark"] .tableaux{--mur:#2B2632;--mur2:#3A3343}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tableaux{--mur:#2B2632;--mur2:#3A3343}}
@media (min-width:620px){.tableaux{grid-template-columns:1fr 1.25fr;padding:26px 22px 20px}}
.wb{display:flex;flex-direction:column}
.wb-s{position:relative;flex:1;min-height:170px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;padding:20px 16px;text-align:center;
  background:radial-gradient(ellipse 40% 30% at 25% 75%,rgba(120,130,140,.07),transparent 70%),radial-gradient(ellipse 35% 25% at 78% 25%,rgba(120,130,140,.06),transparent 70%),linear-gradient(160deg,#FFFFFF,#EEF1F2);
  border:7px solid #B9BEC3;border-color:#D3D7DB #A6ACB2 #9AA0A6 #C7CCD0;border-radius:6px;box-shadow:0 10px 22px -12px rgba(30,20,10,.45),inset 0 0 0 1px rgba(0,0,0,.05)}
.wb-tray{height:9px;margin:0 6%;background:linear-gradient(#C6CBD0,#959BA1);border-radius:0 0 5px 5px;position:relative}
.mk{position:absolute;top:-5px;width:34px;height:7px;border-radius:3px;background:#2B2B2B}
.mk::after{content:"";position:absolute;right:-5px;top:1px;width:7px;height:5px;border-radius:0 3px 3px 0;background:inherit;filter:brightness(1.6)}
.mk.b{left:22%;background:#1F3A93}.mk.r{left:52%;background:#C0272D}.mk.k{left:30%}.mk.g{left:60%;background:#2E7D4F}
.wb-s{container-type:inline-size}
.hw{display:block;white-space:nowrap;font-family:"Caveat","Bradley Hand","Segoe Print","Comic Sans MS",cursive;font-weight:700;line-height:1.08;letter-spacing:.005em}
.hw.t1{color:#1F3A93;font-size:clamp(1.6rem,13cqi,2.6rem)}
.hw.t2{color:#C0272D;font-size:clamp(1.7rem,6vw,2.1rem);margin-top:6px}
.hw.t3{color:#1B1B1B;font-size:clamp(1.3rem,9.4cqi,2.2rem)}
.hw-line{display:block;width:70%;height:12px;margin:2px auto 0;overflow:visible}
.hw-line path{fill:none;stroke:#C0272D;stroke-width:3.2;stroke-linecap:round}
@media (prefers-reduced-motion:no-preference){
  .hw{clip-path:inset(-10% 100% -20% 0);animation:ecrire var(--w,1s) var(--d,0s) cubic-bezier(.5,.1,.6,.95) forwards}
  .hw-line path{stroke-dasharray:200;stroke-dashoffset:200;animation:trait .45s var(--d,0s) ease-out forwards}
  @keyframes ecrire{to{clip-path:inset(-10% -4% -20% 0)}}
  @keyframes trait{to{stroke-dashoffset:0}}
}
article.cours p.chute{font-family:var(--display);font-style:italic;font-weight:600;font-size:1.5rem;line-height:1.25;color:var(--rouge);text-align:center;margin:1.4em 0 .4em}
.cats .cat.wide{grid-column:span 6}

/* ---------- Le prof qui surveille ---------- */
.tk{--pw:150px;position:relative;z-index:1;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tk:nth-child(2){z-index:2}
@media (max-width:600px){.tk{--pw:124px}.tickets{row-gap:48px}}
.tk .ticket{z-index:2}
.peek-box{position:absolute;right:18px;bottom:calc(100% - 4px);width:var(--pw);height:calc(var(--pw)*.83);overflow:hidden;z-index:1;pointer-events:none}
.peek-box img{display:block;width:100%;height:auto;transform:translateY(calc(var(--pw)*.83 - 13px));transition:transform .55s cubic-bezier(.3,1.35,.5,1)}
@media (prefers-reduced-motion:no-preference){
  .peek-box img{animation:tease 7s ease-in-out infinite}
  .tk:nth-child(2) .peek-box img{animation-delay:3.5s}
  @keyframes tease{0%,80%,100%{transform:translateY(calc(var(--pw)*.83 - 13px))}85%{transform:translateY(calc(var(--pw)*.5))}88%{transform:translateY(calc(var(--pw)*.53))}91%{transform:translateY(calc(var(--pw)*.5))}95%{transform:translateY(calc(var(--pw)*.83 - 13px))}}
}
.tk:hover .peek-box img,.tk.peeking .peek-box img,.tk.auto .peek-box img{transform:translateY(0);animation:guette 2.6s .7s ease-in-out infinite}
@keyframes guette{0%,100%{translate:0 0}25%{translate:-5px 1px}55%{translate:5px 1px}}
.bulle{position:absolute;z-index:3;right:calc(var(--pw) + 26px);bottom:calc(100% + var(--pw)*.42);background:#fff;color:#1B1B1B;border:2px solid #1B1B1B;border-radius:14px;padding:3px 11px 2px;
  font-family:"Caveat","Bradley Hand","Comic Sans MS",cursive;font-weight:700;font-size:1.3rem;line-height:1.1;white-space:nowrap;opacity:0;transform:scale(.5);transform-origin:right bottom;transition:opacity .2s,transform .25s;pointer-events:none}
.bulle::after{content:"";position:absolute;right:-9px;bottom:6px;border:7px solid transparent;border-left:10px solid #1B1B1B}
.tk:hover .bulle,.tk.peeking .bulle,.tk.auto .bulle{opacity:1;transform:none;transition-delay:.5s}
.ticket .stamp{position:absolute;left:46%;top:40%;transform:translate(-50%,-50%) rotate(-12deg) scale(2.4);opacity:0;border:3px solid #D0141F;color:#D0141F;
  font:800 1.05rem/1 system-ui,-apple-system,sans-serif;letter-spacing:.2em;text-transform:uppercase;padding:5px 10px 4px;border-radius:6px;background:color-mix(in srgb,var(--paper) 80%,transparent);pointer-events:none;transition:opacity .2s,transform .25s cubic-bezier(.3,1.5,.5,1)}
.tk:hover .stamp,.tk.peeking .stamp,.tk.auto .stamp{opacity:1;transform:translate(-50%,-50%) rotate(-12deg) scale(1)}
.tk:hover .ticket,.tk.peeking .ticket,.tk.auto .ticket{border-color:#D0141F;animation:alerte .5s steps(1) infinite}
@keyframes alerte{50%{background:color-mix(in srgb,#D0141F 16%,var(--paper))}}

/* ---------- Le bouton rouge ---------- */
.alarme-zone{display:flex;flex-direction:column;align-items:center;gap:12px;margin:34px 0 0;text-align:center}
.socle{padding:13px;border-radius:50%;background:repeating-linear-gradient(45deg,#F5C400 0 11px,#1B1B1B 11px 22px);box-shadow:0 10px 24px -10px rgba(0,0,0,.6)}
.big-red{display:grid;place-items:center;width:128px;height:128px;border-radius:50%;border:0;cursor:pointer;color:#fff;padding:0 14px;
  font:800 .95rem/1.05 system-ui,-apple-system,sans-serif;letter-spacing:.06em;text-transform:uppercase;text-shadow:0 1px 2px rgba(0,0,0,.45);
  background:radial-gradient(circle at 36% 30%,#FF7A7A,#D0141F 46%,#7A0710 100%);box-shadow:0 8px 0 #4E040A,inset 0 -6px 12px rgba(0,0,0,.35);transition:transform .08s,box-shadow .08s}
.big-red:active{transform:translateY(6px);box-shadow:0 2px 0 #4E040A,inset 0 -4px 10px rgba(0,0,0,.35)}
.alarme-zone p{margin:0;color:var(--ink-soft);font-style:italic;font-size:.95rem}

/* ---------- L'alarme ---------- */
.alarme{position:fixed;inset:0;z-index:100;display:none;place-items:center;overflow:auto;color:#fff;background:#2E0005;padding:44px 0}
.alarme.on{display:grid}
.alarme::before{content:"";position:fixed;inset:0;background:#E0101E;opacity:.35;pointer-events:none}
.gyro{position:fixed;top:-90px;width:240px;height:240px;border-radius:50%;pointer-events:none;
  background:conic-gradient(rgba(255,50,50,.95),transparent 22%,transparent 50%,rgba(255,50,50,.95) 50%,transparent 72%);filter:blur(8px)}
.gyro.l{left:-90px}.gyro.r{right:-90px}
.hazard{position:fixed;left:0;right:0;height:26px;background:repeating-linear-gradient(-45deg,#F5C400 0 18px,#111 18px 36px);z-index:3}
.hazard.t{top:0}.hazard.b{bottom:0}
.alarme-panel{position:relative;z-index:2;width:calc(100% - 32px);max-width:560px;text-align:center}
.alarme .sur{margin:0;font:700 .95rem/1.2 system-ui,-apple-system,sans-serif;letter-spacing:.24em;text-transform:uppercase;color:#FFD84D}
.alarme h2{margin:4px 0 6px;font:900 clamp(2.6rem,13vw,4.6rem)/1 system-ui,-apple-system,sans-serif;letter-spacing:.06em;text-transform:uppercase;text-shadow:0 0 22px #FF1A1A}
.alarme .sous{margin:0 0 12px;font-size:1.1rem}
.alarme .cd{display:inline-block;margin:0 0 18px;padding:10px 16px;border:2px solid #FF3B3B;border-radius:10px;background:#000;color:#FF3B3B;
  font:800 clamp(1.25rem,5.6vw,2rem)/1.1 ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;text-shadow:0 0 10px #FF0000}
.alarme .face{width:min(290px,72vw);height:calc(min(290px,72vw)*.83);margin:0 auto;overflow:hidden;border-bottom:7px solid #F5C400}
.alarme .face img{display:block;width:100%;height:auto;transform:translateY(103%)}
.alarme .legende{margin:10px 0 18px;font-family:"Caveat","Bradley Hand","Comic Sans MS",cursive;font-weight:700;font-size:1.7rem}
.alarme .stop{font:700 1rem system-ui,-apple-system,sans-serif;background:#fff;color:#8E1C2C;border:0;border-radius:999px;padding:14px 26px;cursor:pointer}
.alarme.on .face img{animation:monte 1.1s .35s cubic-bezier(.3,1.3,.5,1) forwards,guette 2.2s 1.6s ease-in-out infinite}
@keyframes monte{to{transform:translateY(0)}}
@media (prefers-reduced-motion:no-preference){
  .alarme::before{animation:flashR .5s steps(1) infinite}
  .gyro{animation:tourne .8s linear infinite}
  .hazard{animation:defile .9s linear infinite}
  .alarme h2{animation:clign .5s steps(1) infinite}
  .alarme.on .alarme-panel{animation:secoue .45s ease-in-out 2}
  @keyframes flashR{50%{opacity:.75}}
  @keyframes tourne{to{transform:rotate(1turn)}}
  @keyframes defile{to{background-position:50.9px 0}}
  @keyframes clign{50%{color:#FFD84D}}
  @keyframes secoue{0%,100%{transform:none}20%{transform:translate(-8px,3px) rotate(-1deg)}40%{transform:translate(7px,-3px) rotate(1deg)}60%{transform:translate(-5px,2px)}80%{transform:translate(4px,-1px)}}
}
footer{border-top:1px solid var(--line);margin-top:56px;padding:26px 0 34px;color:var(--ink-soft);font-size:.9rem;text-align:center}
footer svg{width:90px;height:14px;color:var(--or);display:block;margin:0 auto 10px}
</style>
</head>

<script type="application/json" id="docs-data">[{"slug": "auteur", "cat": "theatre", "group": "Découvrir l'œuvre", "title": "L'auteur", "sub": "Alfred de Musset, le « poète des nuits »", "obj": [], "toc": [], "html": "\n<p data-pi=\"0\">« Rien ne nous rend si grand qu’une grande douleur », écrivait Musset dans son poème le Pélican.<\/p>\n<p data-pi=\"1\">Alfred de Musset est un écrivain français du XIXème siècle, surnommé le « poète des nuits ».<\/p>\n<p data-pi=\"2\">Né en décembre 1810, Alfred de Musset grandit dans une famille aisée, cultivée et littéraire. Paul Foucher, écrivain romantique, sera par ailleurs l’ami intime d’Alfred de Musset.<\/p>\n<p data-pi=\"3\">Musset ayant grandi dans cet univers littéraire, cultive des goûts très hétéroclites qui vont des grands classiques à des genres mineurs. Ainsi il admire des auteurs comme Rousseau ou Voltaire, mais va s'inspirer aussi d’auteurs du XVIIe comme Racine, Corneille ou La Fontaine. C'est son grand-père qui va aussi l'initier au genre du proverbe qui est un genre qui touche davantage à l'amusement et au divertissement ; il s'agit d’un genre dramatique mineur basé sur une intrigue sentimentale légère. C’est sur cette base qu’est écrite la pièce <cite>On ne badine pas avec l’amour<\/cite>, avant que Musset ne l’oriente vers le drame.<\/p>\n<p data-pi=\"4\">C’est d’abord vers la poésie qu’il veut se diriger à ses débuts et il écrira à Paul Foucher : « <em>Je ne voudrais pas écrire ou je voudrais être Shakespeare ou Schiller : je ne fais donc rien. ».<\/em><\/p>\n<p data-pi=\"5\">C’est un élève brillant qui débute des études de droit puis de médecine. Il pratique le dessin, la peinture, la musique. Il fréquente les salons à la mode et les cercles littéraires. Il écrit : « <em>À 18 ans, j’hésitais encore sur l’état que j’embrasserais, lorsque le hasard me lia avec quelques jeunes gens qui s’occupaient de littérature. ».<\/em> Grâce à Paul Foucher, Musset est introduit dans le cercle de <a href=\"https://www.lalanguefrancaise.com/litterature/victor-hugo\" rel=\"noopener\" target=\"_blank\">Victor Hugo<\/a> et assiste aux réunions du Cénacle (groupe de jeunes écrivains romantiques qui de 1823 à 1830 se réunirent chez <a href=\"https://www.larousse.fr/encyclopedie/personnage/Jean_Charles_Emmanuel_Nodier/135415\" rel=\"noopener\" target=\"_blank\">Charles Nodier<\/a> et chez <a href=\"https://www.larousse.fr/encyclopedie/personnage/Victor_Hugo/124393\" rel=\"noopener\" target=\"_blank\">Victor Hugo<\/a>. Il comprenait notamment Théophile Gautier, Vigny, Musset, Sainte-Beuve, Mérimée, Dumas, Balzac et Nerval. C'est chez Hugo que le groupe prépara la <a href=\"https://www.larousse.fr/encyclopedie/divers/bataille_d_Hernani/103660\" rel=\"noopener\" target=\"_blank\">bataille d'Hernani<\/a>. Il y rencontre notamment Sainte-Beuve, Delacroix, Mérimée, Alfred de Vigny<strong>.<\/strong><\/p>\n<p data-pi=\"6\">En 1829, Musset écrit sa première œuvre, <em>Contes d’Espagne et d’Italie<\/em>, qu’il publie en 1830. Ce recueil de vers officialise sa carrière littéraire. Il publie également des poèmes dans la <em>Revue de Paris<\/em>. Première pièce de théâtre en 1830, <em>La Quittance du diable<\/em>, ainsi que <em>Les<\/em> <em>Secrètes pensées de Rafaël<\/em>, où il tisse une réflexion sur la place de l’artiste. Son admiration pour ses aînés ne l’empêche pas de prendre ses distances par rapport au mouvement romantique.<\/p>\n<p data-pi=\"7\">1830 est aussi l’année de la révolution de Juillet. Dès son enfance, Musset avait été sensibilisé à la politique. On sait par Paul Foucher que la famille avait assisté avec admiration à l’arrivée de Napoléon aux Tuileries, à son retour de l’Île d’Elbe. Musset assiste avec intérêt à la révolution contre le pouvoir de Charles X mais il ne voit finalement en Louis Philippe qu’un roi remplaçant un roi. Il refuse ainsi la mission sociale des écrivains et des poètes, celle des romantiques, et se montre cynique et indifférent par rapport à la politique.<\/p>\n<p data-pi=\"8\">Fin 1830, il écrit une pièce de théâtre, <em>La Nuit vénitienne ou les Noces de Laurette<\/em>. La première a lieu à l’Odéon et se solde par un échec cuisant : la pièce est interrompue après deux représentations. Musset décide alors de ne plus jamais écrire pour la scène. Il écrira désormais des pièces à lire, non destinées à la mise en scène et à la représentation, qu’il publie dans <em>La Revue des deux Mondes<\/em>.<\/p>\n<p data-pi=\"9\">Musset vit en dandy. Il sort et fréquente ses pairs dans les salons et les cafés. Il y fait notamment la rencontre d’un ami qu’il conservera toute sa vie, Alfred Tattet, poète et héritier vivant de ses rentes.<\/p>\n<p data-pi=\"10\">Musset, pour gagner sa vie, continue d’écrire une chronique intitulée « La Revue fantastique », publiée dans le journal <em>Le Temps<\/em>. Il y invente deux personnages :<\/p>\n<ul>\n<li data-pi=\"11\"><p data-pi=\"12\">L’un, vertueux et sensible comme Werther (Les souffrances du jeune Werther, Goethe), promènerait autour de lui des regards innocents,<\/p><\/li>\n<li data-pi=\"13\"><p data-pi=\"14\">l’autre, damné comme Valmont (Les liaisons dangereuses, Choderlos de Laclos), aurait cet œil dont l’éclair est comparable à une flèche aigüe. <\/p><\/li>\n<\/ul>\n<p data-pi=\"15\">Ces deux courts portraits traduisent l’ambiguïté du caractère de Musset, un homme à deux visages, à la fois vertueux et aussi cynique et cruel.<\/p>\n<p data-pi=\"16\">En 1832, Musset rompt définitivement avec ses amis du Cénacle car, bien que classé parmi les romantiques, il souhaite se défaire de la technique. Ses anciens amis ne sauront lui pardonner cet affront et le traiteront d’amateur. En avril 1832, le père de Musset meurt. Ils étaient très proches et c’est une épreuve pour lui. Il s’investit pleinement dans la littérature pour vivre de sa plume et ne pas être à la charge de sa mère.<\/p>\n<p data-pi=\"17\">Le recueil Spectacle dans un fauteuil est publié en 1833, année fructueuse pour Musset qui écrit ses pièces les plus célèbres dont <em>André del Sarto<\/em>, <em>Les Caprices de Marianne et Fantasio<\/em>. Le thème du triangle amoureux est particulièrement présent dans ses pièces et les personnages masculins ont hérité de la dualité de caractère propre à Musset. A côté du théâtre, l’année 1833 est une année de publication poétique pour Alfred de Musset. Il écrit alors Rolla, œuvre marquée par la mélancolie. On y trouve la célèbre formule du mal du siècle : « <em>Je suis né trop tard dans un monde trop vieux <\/em>», réflexion typique du malaise d’une génération perdue dans une époque qui ne lui offre pas d’avenir.<\/p>\n<p data-pi=\"18\">L’année 1833 est aussi celle de sa rencontre avec George Sand. Ils font connaissance lors d’un dîner chez l’éditeur Buloz. S’ensuivent une relation épistolaire et une camaraderie qui se transforme rapidement en liaison amoureuse à la fin de l’été. Alfred de Musset a alors 23 ans, George Sand, 30 ans. Leur histoire est faite de ruptures et de réconciliations (cf film de Diane Kurys <em>Les Enfants du siècle,<\/em> 1999). La relation prend fin durant l’automne 1833, lors de leur voyage à Venise. Après tromperies et trahisons mutuelles (Sand entretenait notamment une liaison avec Pagello, le médecin italien de Musset), les deux amants séparés rentrent à Paris, puis se séparent définitivement en mars 1835. Cette séparation laisse une marque profonde et douloureuse chez Musset. George Sand a été son seul véritable amour. Cette souffrance devient le moteur de création de Musset qui publie en 1834 <em>On ne Badine pas avec l’amour<\/em> puis <em>Lorenzaccio<\/em>. C’est en 1836 qu’il publie une œuvre à caractère autobiographique,<em> La Confession d’un enfant du siècle, qui oscille entre débauche, amour passionné et désillusion<\/em>. Il s’agit en réalité de la peinture de toute une génération, née sous Napoléon et ayant connu la Restauration. Une génération désenchantée, dépourvue de tout idéal. Sous prétexte de raconter sa vie, Musset présente à la jeunesse de son temps un miroir où elle peut reconnaître ses extravagances, ses aspirations et ses déceptions après l’avènement de Louis-Philippe.<\/p>\n<p data-pi=\"19\">En même temps, Musset continue à écrire de la poésie <em>(La Nuit de Mai, La Nuit de Décembre, La Nuit d’Août, La Nuit d’Octobre, 1837).  <\/em>Les quatre nuits renvoient aux quatre saisons, et expriment les souffrances du poète, son destin malheureux et ses difficultés amoureuses. <\/p>\n<p data-pi=\"20\">Cette même année, il est également nommé conservateur de la bibliothèque du ministère de l’Intérieur, grâce au duc d’Orléans, mais il sombre dans la mélancolie. Alfred de Musset poursuit sa vie de dandy, il sort beaucoup et boit. Au printemps 1840, il tombe gravement malade et en garde des séquelles. En 1845, toujours très affaibli, Musset publie un conte <em>Mimi Pinson<\/em>, puis le proverbe <em>Il faut qu’une porte soit ouverte ou fermée<\/em>.<\/p>\n<p data-pi=\"21\">Avant la fin de sa vie, Musset connaît une double consécration en tant que dramaturge : quelques-unes de ses pièces sont jouées à la Comédie française, et rencontrent un franc succès. Puis, en 1852, il est élu à l’Académie française. Cependant, rongé par la maladie et l’alcool, il s’isole, aigri, et prématurément vieilli. Il s’éteint le 2 mai 1857 et sera inhumé au cimetière du Père-Lachaise.<\/p>\n", "idx": ["« Rien ne nous rend si grand qu’une grande douleur », écrivait Musset dans son poème le Pélican.", "Alfred de Musset est un écrivain français du XIXème siècle, surnommé le « poète des nuits ».", "Né en décembre 1810, Alfred de Musset grandit dans une famille aisée, cultivée et littéraire. Paul Foucher, écrivain romantique, sera par ailleurs l’ami intime d’Alfred de Musset.", "Musset ayant grandi dans cet univers littéraire, cultive des goûts très hétéroclites qui vont des grands classiques à des genres mineurs. Ainsi il admire des auteurs comme Rousseau ou Voltaire, mais va s'inspirer aussi d’auteurs du ue"]], "html": "\n<p data-pi=\"0\">« Je suis venu trop tard dans un monde trop vieux ». C'est ainsi que Musset qualifie le mal du siècle en 1836 dans <cite>La confession d'un enfant du siècle<\/cite> et Perdican et Camille traduisent effectivement cette conception du mal du siècle. La pièce est composée en 1834 après que Musset et revenu d’Italie et après donc sa rupture avec George Sand. Elle paraît dans <cite>la revue des deux mondes<\/cite> avant d'être reprise dans le recueil <cite>comédies et proverbes<\/cite>.<\/p>\n<p data-pi=\"1\">Mais à sa sortie, c'est le frère d’Alfred de Musset, Paul de Musset qui va modifier la pièce pour le rendre notamment moins subversive et il faudra attendre 1923 pour que la version originale de la pièce soit à nouveau représentée.<\/p>\n<h2 data-pi=\"2\" id=\"s1\">Les contours généraux<\/h2>\n<p data-pi=\"3\">La pièce <cite>On ne badine pas avec l'amour<\/cite> peut être considérée comme un proverbe. Le proverbe est un genre dramatique mineur, genre théâtral qui met en scène la société française sous la Restauration et la monarchie de Juillet et qui va révéler certaines vérités sur le genre humain. C'est une intrigue simple légère.<\/p>\n<p data-pi=\"4\">Musset en réalité s'amuse à partir du proverbe pour le faire glisser vers le drame romantique même si après cette pièce Musset a écrit d'autres proverbes par exemple : il ne faut jurer de rien ; un caprice ; il faut qu'une porte soit ouverte ou fermée…<\/p>\n<p data-pi=\"5\">Il transforme avec Badine une forme mineure pour lui donner ses lettres de noblesse. Ainsi il densifie l'intrigue, accentue la profondeur des personnages.<\/p>\n<p data-pi=\"6\">Musset est donc parti du proverbe pour faire glisser la pièce vers le drame romantique ; le drame romantique est un genre théâtral du dix-neuvième siècle avec la bataille d’Hernani en 1830. Les grands principes sont exposés par Victor Hugo dans la préface de Cromwell. Il s'agit notamment d'abandonner les règles classiques - les unités de temps de lieu d'intrigue - ainsi que les règles de vraisemblance de bienséance, et de favoriser le mélange des genres tout en restant fidèle à la réalité, mais on ne s'interdisant pas d'allier par exemple le sublime et le grotesque. Les personnages deviennent complexes et peuvent se conduire en héros tout en affichant leurs faiblesses. Ils peuvent être tourmentés marginalisés, rejetés, incompris et au dix-neuvième siècle traduisent parfois la mélancolie et le désenchantement de la jeunesse romantique, ce fameux mal du siècle. Ainsi à une dimension lyrique et poétique propre au romantisme s'ajoute la portée politique et sociale du XIXe siècle. Ce mélange des genres se retrouve ici dans la pièce car on va avoir des personnages absurdes (Blazius Pluche) qui vont cohabiter avec des personnages plus touchants, plus profonds comme Perdican, Camille ou Rosette. L'aspect politique et social se retrouve dans le rapport des couches sociales et notamment dans les réactions face à l'hypothétique mariage entre Perdican et Rosette.<\/p>\n<h2 data-pi=\"7\" id=\"s2\">La dimension autobiographique<\/h2>\n<p data-pi=\"8\"><em>Dans une lettre qu'il écrit à George Sand le 23 août 1834 Musset écrit : « La postérité répètera nos noms comme ceux de ces amants intemporels qui n'en ont plus qu'un à eux deux, comme Roméo et Juliette, comme Héloïse et Abélard ; on ne parlera jamais de l'un sans parler de l'autre. »<\/em><\/p>\n<p data-pi=\"9\">L'ensemble des thèmes développés dans l'œuvre font écho à la vie de l'auteur et notamment à sa rupture avec George Sand. On ne badine pas avec l'amour est une pièce de l'échec amoureux et a donc une portée autobiographique. Des tensions du couple formé avec George Sand peuvent être associés à la lutte des sexes dans la pièce, les revendications de Camille pouvant faire écho à la personnalité de Sand. De même à la fin de ses études à Paris, comme le fait Perdican dans la pièce, Musset est rentré dans son village natal. Perdican peut être vu comme le double littéraire de Musset. L'auteur et le personnage sont cultivés, brillants, d'excellents stratèges mais aussi mélancoliques. Les amours difficiles, malheureuses de Musset se retrouvent dans trois de ses œuvres : baladine donc, mais aussi la confession d'un enfant du siècle et les nuits. On ne peut donc voir qu'une dimension cathartique dans la mesure où chaque ouvrage est une introspection : à travers ces personnages Musset tente de dépasser ses propres douleurs. Et en utilisant à cette fin cathartique, le genre du proverbe, Musset affiche sa modernité et sa fantaisie afin de proposer une réflexion sur les émotions de chacun à travers la psychologie des personnages.<\/p>\n<h2 data-pi=\"10\" id=\"s3\">La structure<\/h2>\n<p data-pi=\"11\">Trois actes qui correspondent à trois journées. L’acte I est celui de l'exposition qui présente donc les personnages, le thème et les enjeux de la pièce. L'acte II est celui des péripéties et du faux dénouement qui pourrait donc constituer une fin possible (celle de l'amour impossible et de la séparation irrémédiable). L’acte III sera le véritable dénouement et il existe parce que les masques, les stratagèmes et les faux-semblants doivent être mis à jour. Il est plus développé que les deux précédents et focalise précisément sur les personnages, leurs émotions, et leurs confessions. Il y a une atmosphère du conte avec des repères historiques qui sont volontairement flous ainsi qu'avec certains décors : lorsque le chœur invite à s'asseoir sous ce noyer (I,3).<\/p>\n<p data-pi=\"12\">Quant à la fin, la vanité est un des rouages essentiels de la pièce. Ainsi Musset conjugue une fin heureuse (la reconnaissance des sentiments réciproques) et une fin de tragique (cet amour impossible car l'orgueil des personnages a provoqué la mort de Rosette), l’amour inatteignable qui reste justement au cœur de la pièce.<\/p>\n<h2 data-pi=\"13\" id=\"s4\">Les accents<\/h2>\n<h3 data-pi=\"14\">Comiques<\/h3>\n<p data-pi=\"15\">Après l'échec de la nuit vénitienne Musset décide donc d'écrire du théâtre non plus pour être représenté mais seulement pour être lu. Dans ce cadre, une de ses préoccupations majeures va être de créer des pièces hybrides dans lesquelles il va mélanger les registres.<\/p>\n<p data-pi=\"16\">Le comique est très présent et on retrouve différents types de comiques : le comique de situation avec les jeux de cache-cache par exemple, le comique de caractère porté par des personnages comme maître Blazius et Bridaine. Comique aussi dans certains thèmes ou dans le langage parfois employé. On notera tout au long de la pièce des parallélismes récurrents qui participent à ce comique. Ainsi dans le premier acte Blazius annonce «  Le jeune Perdican fils de notre seigneur, vient d'atteindre sa majorité et il est reçu docteur à Paris » tandis que le baron annonce «  Ma nièce est depuis hier à 07h de nuit parvenue à l'âge de 18 ans, elle sort du meilleur couvent de France ».<\/p>\n<p data-pi=\"17\">Blazius et Bridaine incarnent aussi ce parallélisme comique et leur gloutonnerie est redoublée par leur cupidité : lorsqu'ils sont chassés du château, ils n'expriment pas ce que l'on pourrait attendre, c'est-à-dire des regrets pour avoir perdu leurs fonctions, mais ils sont au contraire désespérés d'avoir quitté une bonne table et le parallélisme se retrouve dans les reproches qu'ils se font de leur négligence dans l'acte 3 scène 2 : <em>pourquoi une fatale curiosité m'a elle poussé à écouter…. / pourquoi un vain orgueil m’a-t-il éloigné de ce dîner honorable…. / Hélas j’étais gris il faut en convenir… / hélas le vin m'avait monté la tête.<\/em><\/p>\n<p data-pi=\"18\">Le comique de mots est très présent dans le décalage et l'opposition des niveaux de langue ou dans l'association de langage surprenante et incongrue notamment lorsque le cœur décrit Blazius de cette façon (I,1) : doucement bercé sur sa mule fringante / se ballottant sur son ventre rebondi / et les yeux à demi fermés / marmottant un pater noster dans son triple menton. Ainsi des comparaisons participent aux comiques de mots, le chœur associant Blazius à un poupon sur l'oreiller.<\/p>\n<h2 data-pi=\"19\" id=\"s5\">La pièce d’un échec dramatique<\/h2>\n<p data-pi=\"20\">La pièce est celle d'un échec parce que les mots ont la dualité suivante : tantôt ils reflètent la vérité et la transparence, tantôt ils servent des lieux communs et permettent la dissimulation. Mais la pièce est un échec d'abord parce que le retour à l'enfance est impossible et parce que l'entrée dans l'âge adulte se concrétise par une union impossible. Et lorsque la parole véritable traduisant la sincérité du cœur apparait alors elle est source d'éloignement. Et fidèlement à ce mal du siècle les personnages restent prisonniers d'une sorte d'entre-deux un passé disparu et un avenir malheureux. C'est une pièce pessimiste car le bonheur est inatteignable, et dominent l'orgueil et le poids des convenances. Les personnages sont dans l'aveuglement et le déni. La parole reste mensongère, elle permet d'instrumentaliser les sentiments. Perdican est obligé de dissimuler pour faire avancer l'action, dissimuler à Rosette, dissimuler à Camille mais également à lui-même. En fait, le drame de la pièce provient de l'urgence à faire jaillir une parole véritable et sincère, mais qui ne parvient pas à se faire entendre. Ainsi, acte 3 scène 6, la réplique de Camille <em>que voulez-vous me dire c'est à Rosette qu'il faut parler….<\/em> Est enserrée par les répétitions <em>écoute moi<\/em> de Perdican.<\/p>\n<h2 data-pi=\"21\" id=\"s6\">Une pièce poétique<\/h2>\n<p data-pi=\"22\">On trouve dans la pièce un lyrisme qui participe à la poésie et cette poésie se retrouve dans les mots mais aussi dans les décors notamment de la nature qui va bercer les souvenirs d'enfance et rythmer l'évolution des personnages. Les 3 actes correspondent à 3 journées qui vont voir évoluer les états d'âme des personnages. La pièce est un mélange de genres et propose une poétique des contrastes par exemple l'opposition du langage des fantoches avec le badinage amoureux des personnages principaux. Le mal du siècle s’exprime aussi dans une sorte de poésie de la noirceur avec dans la pièce tout ce qui va s'apparenter à la nostalgie, à la quête de la nature, à l'aspiration un idéal. Idéal inatteignable car dans les thèmes de l'œuvre, figurent l'amour impossible, l'amour trahi, les conflits internes et cette poésie mise en perspective avec le mal du siècle porte donc une valeur cathartique en ce qu’elle révèle la psychologie du jeune homme ou de la jeune femme du XIXe siècle déchiré(e) entre mélancolie profondeur et légèreté.<\/p>\n<h2 data-pi=\"23\" id=\"s7\">Une pièce critique<\/h2>\n<p data-pi=\"24\">Plusieurs aspects sont critiqués dans la pièce, plusieurs univers.<\/p>\n<p data-pi=\"25\">D'abord évidemment une critique de l'église dans les discours que Perdican porte par rapport aux sœurs qui forment l'entourage de Camille au couvent. Mais cette critique passe aussi par les caricatures qui sont faites de maître Blazius et de maître Bridaine qui sont donc deux hommes d'église. Ils sont décrits comme cupides, méchants, ambitieux, alcooliques, gourmands et stupides. Ils reflètent cette image de l'église qui se met au service des puissants (ici le baron) auxquels des passe- droit peuvent être accordés (dispenses nécessaires pour marier Perdican à sa cousine).<\/p>\n<p data-pi=\"26\">Musset se livre aussi à une critique des notables à travers le personnage du baron. C'est un personnage puissant, fier mais qui ne parvient pas à imposer son autorité et qui ne parviendra pas imposer le mariage de Perdican et de Camille, mariage qu'il souhaite uniquement pour son propre plaisir. Ne parvenant pas à faire respecter ses volontés, il va réagir de façon grotesque et ridicule : ainsi par exemple, il veut s'habiller de noir si Perdican épouse Rosette. C'est un personnage qui manque de finesse dans la mesure où il ne comprend pas ce qui se trame autour de lui, et ce malgré les efforts des uns et des autres pour le lui expliquer.<\/p>\n<p data-pi=\"27\">L’éducation est critiquée aussi dans la pièce. L’éducation apparaît d'abord superficielle et semble compliquer la vie en société des jeunes gens. Camille par exemple a peur de souffrir en tombant amoureuse au regard de ce qu'on a pu lui enseigner. Le fossé est grand entre Camille et Perdican d'un côté et Rosette de l'autre. Toutefois Perdican privilégie son lien avec la nature par rapport à l'éducation qu'il a reçu. Par exemple, dans le passage sur l'héliotrope Perdican va dire qu’elle sent bon - il ne va pas l'analyser privilégiant donc la sensation à la connaissance plus artificielle.<\/p>\n", "idx": ["« Je suis venu trop tard dans un monde trop vieux ». C'est ainsi que Musset qualifie le mal du siècle en 1836 dans La confession d'un enfant du siècle et Perdican et Camille traduisent effectivement cette conception du mal du siècle. La pièce est composée en 1834 après que Musset et revenu d’Italie et après donc sa rupture avec George Sand. Elle paraît dans la revue des deux mondes avant d'être reprise dans le recueil comédies et proverbes.", "Mais à sa sortie, c'est le frère d’Alfred de Musset, Paul de Musset qui va modifier la pièce pour le rendre notamment moins subversive et il faudra attendre 1923 pour que la version originale de la pièce soit à nouveau représentée.", "Les contours généraux", "La pièce On ne badine pas avec l'amour peut être considérée comme un proverbe. Le proverbe est un genre dramatique mineur, genre théâtral qui met en scène la société française sous la Restauration et la monarchie de Juillet et qui va révéler certaines vérités sur le genre humain. C'est une intrigue simple légère.", "Musset en réalité s'amuse à partir du proverbe pour le faire glisser vers le drame romantique même si après cette pièce Musset a écrit d'autres proverbes par exemple : il ne faut jurer de rien ; un caprice ; il faut qu'une porte soit ouverte ou fermée…", "Il transforme avec Badine une forme mineure pour lui donner ses lettres de noblesse. Ainsi il densifie l'intrigue, accentue la profondeur des personnages.", "Musset est donc parti du proverbe pour faire glisser la pièce vers le drame romantique ; le drame romantique est un genre théâtral du dix-neuvième siècle avec la bataille d’Hernani en 1830. Les grands principes sont exposés par Victor Hugo dans la préface de Cromwell. Il s'agit notamment d'abandonner les règles classiques - les unités de temps de lieu d'intrigue - ainsi que les règles de vraisemblance de bienséance, et de favoriser le mélange des genres tout en restant fidèle à la réalité, mais on ne s'interdisant pas d'allier par exemple le sublime et le grotesque. Les personnages deviennent complexes et peuvent se conduire en héros tout en affichant leurs faiblesses. Ils peuvent être tourmentés marginalisés, rejetés, incompris et au dix-neuvième siècle traduisent parfois la mélancolie et le désenchantement de la jeunesse romantique, ce fameux mal du siècle. Ainsi à une dimension lyrique et poétique propre au romantisme s'ajoute la portée politique et sociale du XIXe siècle. Ce mélange des genres se retrouve ici dans la pièce car on va avoir des personnages absurdes (Blazius Pluche) qui vont cohabiter avec des personnages plus touchants, plus profonds comme Perdican, Camille ou Rosette. L'aspect politique et social se retrouve dans le rapport des couches sociales et notamment dans les réactions face à l'hypothétique mariage entre Perdican et Rosette.", "La dimension autobiographique", "Dans une lettre qu'il écrit à George Sand le 23 août 1834 Musset écrit : « La postérité répètera nos noms comme ceux de ces amants intemporels qui n'en ont plus qu'un à eux deux, comme Roméo et Juliette, comme Héloïse et Abélard ; on ne parlera jamais de l'un sans parler de l'autre. »", "L'ensemble des thèmes développés dans l'œuvre font écho à la vie de l'auteur et notamment à sa rupture avec George Sand. On ne badine pas avec l'amour est une pièce de l'échec amoureux et a donc une portée autobiographique. Des tensions du couple formé avec George Sand peuvent être associés à la lutte des sexes dans la pièce, les revendications de Camille pouvant faire écho à la personnalité de Sand. De même à la fin de ses études à Paris, comme le fait Perdican dans la pièce, Musset est rentré dans son village natal. Perdican peut être vu comme le double littéraire de Musset. L'auteur et le personnage sont cultivés, brillants, d'excellents stratèges mais aussi mélancoliques. Les amours difficiles, malheureuses de Musset se retrouvent dans trois de ses œuvres : baladine donc, mais aussi la confession d'un enfant du siècle et les nuits. On ne peut donc voir qu'une dimension cathartique dans la mesure où chaque ouvrage est une introspection : à travers ces personnages Musset tente de dépasser ses propres douleurs. Et en utilisant à cette fin cathartique, le genre du proverbe, Musset affiche sa modernité et sa fantaisie afin de proposer une réflexion sur les émotions de chacun à travers la psychologie des personnages.", "La structure", "Trois actes qui correspondent à trois journées. L’acte I est celui de l'exposition qui présente donc les personnages, le thème et les enjeux de la pièce. L'acte II est celui des péripéties et du faux dénouement qui pourrait donc constituer une fin possible (celle de l'amour impossible et de la séparation irrémédiable). L’acte III sera le véritable dénouement et il existe parce que les masques, les stratagèmes et les faux-semblants doivent être mis à jour. Il est plus développé que les deux précédents et focalise précisément sur les personnages, leurs émotions, et leurs confessions. Il y a une atmosphère du conte avec des repères historiques qui sont volontairement flous ainsi qu'avec certains décors : lorsque le chœur invite à s'asseoir sous ce noyer (I,3).", "Quant à la fin, la vanité est un des rouages essentiels de la pièce. Ainsi Musset conjugue une fin heureuse (la reconnaissance des sentim quer.", "L’éducation est critiquée aussi dans la pièce. L’éducation apparaît d'abord superficielle et semble compliquer la vie en société des jeunes gens. Camille par exemple a peur de souffrir en tombant amoureuse au regard de ce qu'on a pu lui enseigner. Le fossé est grand entre Camille et Perdican d'un côté et Rosette de l'autre. Toutefois Perdican privilégie son lien avec la nature par rapport à l'éducation qu'il a reçu. Par exemple, dans le passage sur l'héliotrope Perdican va dire qu’elle sent bon - il ne va pas l'analyser privilégiant donc la sensation à la connaissance plus artificielle."]}, {"slug": "personnages", "cat": "theatre", "group": "Découvrir l'œuvre", "title": "Les personnages", "sub": "Les principaux et les fantoches", "obj": [], "toc": [], "html": "\n<p data-pi=\"0\">Les principaux et les fantoches / le chœur<\/p>\n<h3 data-pi=\"1\">Le Baron<\/h3>\n<p data-pi=\"2\">Il est le symbole de la désillusion car alors qu'il pense avoir assuré le bonheur de sa famille grâce à sa position matérielle et grâce au mariage qu’il imagine entre Perdican et Camille. Il se campe en metteur en scène, en marionnettiste. Mais la réalité sera toute autre. Il ne parvient pas à imposer ses décisions et ses souhaits, il manque d'autorité paternelle. Le ridicule de ses réactions est source de comique ce qui est aussi renforcé par sa routine et ses rituels car il est le stéréotype du noble de province. Il incarne la figure traditionnelle du père dans les comédies qui se ridiculise par certains de ses traits de caractère : c'est quelqu'un d'obtu, de colérique, d'égoïste, qui ne cherche d'ailleurs l'union de Perdican et de Camille que pour rompre sa propre solitude. C'est un être naïf qui manque de finesse et ne comprend pas tout ce qui se joue autour de lui. Il manque aussi de courage et de combativité préférant aller s’enfermer pour s'abandonner à la douleur si Perdican épouse Rosette.<\/p>\n<h3 data-pi=\"3\">Perdican<\/h3>\n<p data-pi=\"4\">Âgé de 21 ans au début de la pièce et diplômé, c'est un garçon brillant, un noble (c'est le fils du baron), il maîtrise la rhétorique. C'est un personnage qui est déchiré entre l'enfance à laquelle il reste attaché et le monde adulte symbolisé par exemple par la fin de ses études et donc la connaissance qu'il relativise pour rester modeste et sensible face à la nature. C'est en quelque sorte la figure de Musset et il incarne la jeunesse, il est le séducteur et s’il est spontané, passionné, il porte aussi des masques pendant la pièce notamment celui du beau parleur, du séducteur, masque qu'il retirera pour avouer ses sentiments à Camille.<\/p>\n<h3 data-pi=\"5\">Camille<\/h3>\n<p data-pi=\"6\">Elle est âgée de 18 ans au début de la pièce. Elle sort du couvent mais souhaite y retourner pour se faire religieuse alors que le baron et Perdican pensent qu'elle est promise à ce dernier. Elle est décrite de façon méliorative comme une très belle jeune femme. Toutefois derrière ce portrait Camille est la véritable manipulatrice, la marionnettiste, la machiniste de la pièce. C'est un personnage de glace et de feu et si elle joue la comédie aux autres, elle se la joue aussi à elle-même ce qui en fait un personnage ambigu. Il lui arrive d'être sincère vis-à-vis de Perdican, mais en même temps elle peut être instigatrice et jalouse. Musset en fait la porte-parole de la condition féminine. Elle reste orgueilleuse ; ainsi, comprenant que Perdican lui a fait croire qu'il aimait Rosette à sa place, elle mettra en œuvre le stratagème du rideau. Toutefois cette machination sera à l'origine de sa chute. Cette chute est d'ailleurs annoncée grâce à l'onomastique choisie par Musset : Camillus étant à l'époque romaine, celui qui assistait les prêtres lors des sacrifices ; c'était le serviteur de l'autel qui avait une prédisposition pour être au contact des victimes sacrifiées, place que Rosette prendra ici à la fin de la pièce.<\/p>\n<h3 data-pi=\"7\">Rosette<\/h3>\n<p data-pi=\"8\">Elle est donc la victime sacrifiée, victime de l'orgueil de Camille et de Perdican. C'est la fille de la nourrice de Camille, sa sœur de lait et son ambiguïté tient au fait qu'elle est à la fois lucide et naïve. Lucide parce qu'elle connaît et souligne sa différence sociale avec Perdican, naïve parce qu'elle se laissera séduire par ses déclarations. C'est une paysanne qui se caractérise par sa spontanéité. Elle est innocente, simple. L'onomastique l'enracine aussi dans le monde paysan et champêtre (petite rose).<\/p>\n<h3 data-pi=\"9\">Maître Blazius<\/h3>\n<p data-pi=\"10\">Gouverneur de Perdican, c'est le premier personnage décrit dans la pièce dans un registre comique. Il marmotte un pater noster et le niveau de langue s'oppose à la noblesse de la prière. Il est gros, bon vivant, doté d'un triple menton, c'est un délateur. C'est un hypocrite qui à la fois tente de se rapprocher de Bridaine, mais qui fait tout pour le perdre aux yeux du baron.<\/p>\n<h3 data-pi=\"11\">Maître Bridaine<\/h3>\n<p data-pi=\"12\">Il se ressemble avec maître Blazius : tous les deux sont gros, aimant la bonne chère, ils sont ignorants, ivrognes, parlant souvent pour ne rien dire et au regard du parcours la parole correspond ici à la logorrhée. Bridaine est le curé de la paroisse ; c'est un personnage caricatural et grotesque.<\/p>\n<h3 data-pi=\"13\">Dame Pluche<\/h3>\n<p data-pi=\"14\">Dame pluche est un personnage caricatural. C'est une bigote très sèche, elle est la caricature de la vieille fille dévote. Le titre de « dame » est supposé lui donner une certaine respectabilité qui tombe cependant devant ses aspects caricaturaux. Elle est têtue, obstinée, hypocrite, acariâtre. Très à cheval sur les convenances et la bienséance, elle fait preuve aussi d'une dévotion excessive. Elle ne parvient pas à comprendre le jeu de Camille dont elle ne voit pas le côté manipulateur.<\/p>\n", "idx": ["Les principaux et les fantoches / le chœur", "Le Baron", "Il est le symbole de la désillusion car alors qu'il pense avoir assuré le bonhe
